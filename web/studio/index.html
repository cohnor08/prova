<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prova Studio</title>
<link rel="icon" href="/img/icon-192.png">
<style>
  /* Sky palette, straight from src/constants/theme.js (SKY_BASE + SOFT_ACCENTS.blue). */
  :root{
    color-scheme:dark;
    --page:#101318;--ground:#171A21;--card:#212630;--raised:#2A303C;--line:#333B4A;
    --ink:#F4F6FA;--ink-2:#A8B2C4;--ink-3:#8A94A8;
    --primary:#2A99DB;--primary-dk:#1E7CB5;--teal:#1D93A1;
    --good:#6EE7B7;--warn:#B8894A;--bad:#F58B8B;--on-primary:#fff;
    --r-sm:8px;--r-md:12px;--r-lg:18px;
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Helvetica,Arial,sans-serif;
    --round:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;
    --serif:Georgia,"Iowan Old Style",serif;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.22);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
  h1,h2,h3,h4{margin:0;text-wrap:balance}
  button,input,select,textarea{font:inherit;color:inherit}
  .hidden{display:none!important}
  :focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:4px}
  .fig{font-family:var(--round);font-weight:600;font-variant-numeric:tabular-nums}
  a{color:var(--primary)}

  /* login */
  .login{min-height:100vh;display:grid;place-items:center;padding:24px}
  .loginbox{width:min(400px,100%);background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:30px;box-shadow:var(--shadow)}
  .loginbox .brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .loginbox .word{font-family:var(--serif);font-size:21px;letter-spacing:3.5px}
  .loginbox p{color:var(--ink-3);font-size:13px;margin:0 0 22px}
  label{display:block;font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-3);margin:0 0 6px}
  input,select,textarea{width:100%;background:var(--raised);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;font-size:14px}
  input:focus,select:focus,textarea:focus{border-color:var(--primary);outline:none}
  input:-webkit-autofill,
  input:-webkit-autofill:hover,
  input:-webkit-autofill:focus,
  input:-webkit-autofill:active{
    -webkit-text-fill-color:var(--ink);
    -webkit-box-shadow:0 0 0 1000px var(--raised) inset;
    box-shadow:0 0 0 1000px var(--raised) inset;
    caret-color:var(--ink);
    transition:background-color 9999s ease-out 0s;
  }
  input::placeholder,textarea::placeholder{color:var(--ink-3)}

  .field{margin-bottom:15px}
  .err{color:var(--bad);font-size:13px;min-height:19px;margin-top:4px}

  .btn{border:0;cursor:pointer;font-weight:650;background:var(--primary);color:var(--on-primary);border-radius:var(--r-sm);padding:11px 20px}
  .btn:hover{background:var(--primary-dk)}
  .btn[disabled]{opacity:.55;cursor:default}
  .btn.ghost{background:transparent;color:var(--ink-2);border:1px solid var(--line)}
  .btn.ghost:hover{background:var(--raised)}
  .btn.sm{padding:7px 13px;font-size:13px}
  .btn.wide{width:100%}
  .btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}

  /* shell */
  .shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh;background:var(--ground)}
  .rail{border-right:1px solid var(--line);background:var(--page);display:flex;flex-direction:column;padding:20px 13px;gap:22px}
  .brand{display:flex;align-items:center;gap:11px;padding:0 8px}
  .brand img{width:30px;height:30px;border-radius:8px}
  .brand .word{font-family:var(--serif);font-size:18px;letter-spacing:3.5px}
  .brand .sub{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--ink-3);font-weight:700}
  .navgroup{display:flex;flex-direction:column;gap:2px}
  .eyebrow{font-size:10.5px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink-3);padding:0 10px 7px}
  .nav{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:var(--r-sm);color:var(--ink-2);font-weight:500;cursor:pointer;background:none;border:0;width:100%;text-align:left}
  .nav svg{width:17px;height:17px;flex:none;opacity:.85}
  .nav:hover{background:var(--card);color:var(--ink)}
  .nav[aria-current="page"]{background:var(--card);color:var(--ink);font-weight:650;box-shadow:inset 2px 0 0 var(--primary)}
  .nav .count{margin-left:auto;font-size:11px;font-weight:700;background:var(--primary);color:#fff;border-radius:999px;padding:1px 7px;font-family:var(--round)}
  .ask{margin-top:auto;text-align:left;width:100%;cursor:pointer;border:0;border-radius:var(--r-md);padding:12px 14px;
    background:linear-gradient(150deg,var(--teal),var(--primary));color:#fff}
  .ask strong{display:block;font-size:13.5px}
  .ask span{display:block;font-size:11.5px;opacity:.85}
  .who{display:flex;align-items:center;gap:10px;padding:12px 8px 0;border-top:1px solid var(--line)}
  .avatar{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:11.5px;font-weight:700;background:var(--raised);color:var(--ink-2);font-family:var(--round)}
  .who .nm{font-size:13px;font-weight:600;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:110px}
  .who .rl{font-size:11.5px;color:var(--ink-3)}

  .top{display:flex;align-items:center;gap:16px;padding:0 26px;height:64px;border-bottom:1px solid var(--line);background:var(--ground);position:sticky;top:0;z-index:5}
  .top h1{font-size:16px;font-weight:650}
  .chips{margin-left:auto;display:flex;gap:8px;align-items:center}
  .chip{display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600}
  .chip .lab{color:var(--ink-3);font-weight:500}
  .chip .v{font-family:var(--round);font-variant-numeric:tabular-nums}

  .content{padding:26px;display:flex;flex-direction:column;gap:22px}
  .greet{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap}
  .greet h2{font-size:24px;font-weight:640;letter-spacing:-.3px}
  .greet p{margin:3px 0 0;color:var(--ink-3);font-size:13.5px}
  .greet .btn{margin-left:auto}
  .cols{display:grid;grid-template-columns:minmax(0,2.1fr) minmax(0,1fr);gap:22px;align-items:start}
  .cols.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .stack{display:flex;flex-direction:column;gap:22px;min-width:0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow)}
  .card>header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .card h3{font-size:14.5px;font-weight:650}
  .card header .meta{margin-left:auto;font-size:12.5px;color:var(--ink-3);font-family:var(--round)}
  .hint{color:var(--ink-3);font-size:12.5px}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow)}
  .stat .art{margin-left:auto;flex:none}
  .stat .k{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-3)}
  .stat .v{font-family:var(--round);font-weight:600;font-size:28px;line-height:1.15;font-variant-numeric:tabular-nums}
  .stat .v small{font-size:12.5px;color:var(--ink-3);font-weight:600;margin-left:4px}
  .stat .d{font-size:12px;color:var(--ink-3)}
  .stat .art{margin-left:auto;flex:none}

  .tablewrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;min-width:620px}
  th{text-align:left;font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-3);font-weight:700;padding:0 12px 11px}
  td{padding:12px;border-top:1px solid var(--line);font-size:13.5px;vertical-align:middle}
  td.n{font-family:var(--round);font-variant-numeric:tabular-nums}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:var(--raised)}
  tbody tr[aria-selected="true"]{background:var(--raised);box-shadow:inset 2px 0 0 var(--primary)}
  td.stu{display:flex;align-items:center;gap:11px;font-weight:600}
  .state{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600}
  .dot{width:7px;height:7px;border-radius:50%;flex:none}
  .s-ok .dot{background:var(--good)} .s-ok{color:var(--good)}
  .s-sl .dot{background:var(--warn)} .s-sl{color:var(--warn)}
  .s-no .dot{background:var(--bad)}  .s-no{color:var(--bad)}

  .pill{font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:3px 8px;border-radius:999px;display:inline-block}
  .pill.ok{background:color-mix(in srgb,var(--good) 20%,transparent);color:var(--good)}
  .pill.set{background:color-mix(in srgb,var(--teal) 20%,transparent);color:var(--teal)}
  .pill.warn{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn)}
  .pill.bad{background:color-mix(in srgb,var(--bad) 20%,transparent);color:var(--bad)}
  .pill.off{background:var(--raised);color:var(--ink-3)}

  .chart{display:grid;grid-template-columns:repeat(7,1fr);gap:9px;align-items:end;height:130px;padding-top:6px}
  .bar{display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;justify-content:flex-end}
  .bar .fill{width:100%;max-width:32px;border-radius:5px 5px 2px 2px;background:linear-gradient(180deg,var(--primary),color-mix(in srgb,var(--primary) 55%,transparent))}
  .bar .zero{width:100%;max-width:32px;height:3px;border-radius:2px;background:var(--line)}
  .bar .d{font-size:11px;color:var(--ink-3);font-weight:600}
  .bar .m{font-size:10.5px;color:var(--ink-3);font-family:var(--round)}

  .rows{display:flex;flex-direction:column}
  .prow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
  .prow:first-child{border-top:0;padding-top:0}
  .prow .pl{flex:1;min-width:0}
  .prow .pt{font-weight:600;font-size:13.5px}
  .prow .ps{font-size:12px;color:var(--ink-3)}

  .task{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
  .task:first-child{border-top:0;padding-top:0}
  .tick{width:20px;height:20px;border-radius:50%;flex:none;border:1.5px solid var(--line);background:none;cursor:pointer;display:grid;place-items:center;padding:0}
  .tick svg{width:11px;height:11px;color:var(--ground);opacity:0}
  .task.done .tick{background:var(--good);border-color:var(--good)}
  .task.done .tick svg{opacity:1}
  .task .t{flex:1;min-width:0;font-size:13.5px;font-weight:550}
  .task.done .t{color:var(--ink-3);text-decoration:line-through}
  .del{background:none;border:0;color:var(--ink-3);cursor:pointer;font-size:17px;line-height:1;padding:2px 6px}
  .del:hover{color:var(--bad)}

  .cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
  .cal .hd{background:var(--raised);padding:9px 8px;text-align:center;font-size:11px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--ink-3)}
  .cal .hd b{display:block;font-family:var(--round);font-size:15px;color:var(--ink);letter-spacing:0}
  .cal .cell{background:var(--card);padding:9px 8px;min-height:132px;display:flex;flex-direction:column;gap:6px}
  .cal .cell.today{background:color-mix(in srgb,var(--primary) 7%,var(--card))}
  .ev{border-radius:7px;padding:7px 9px;font-size:11.5px;line-height:1.35;background:color-mix(in srgb,var(--primary) 18%,transparent);color:var(--primary);border-left:2px solid var(--primary);cursor:pointer;text-align:left;border-top:0;border-right:0;border-bottom:0;width:100%}
  .ev:hover{background:color-mix(in srgb,var(--primary) 28%,transparent)}
  .ev b{display:block;font-weight:650}
  .ev .tm{font-family:var(--round);opacity:.85}
  .ev.att-present{border-left-color:var(--good);color:var(--good);background:color-mix(in srgb,var(--good) 15%,transparent)}
  .ev.att-late{border-left-color:var(--warn);color:var(--warn);background:color-mix(in srgb,var(--warn) 15%,transparent)}
  .ev.att-absent{border-left-color:var(--bad);color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,transparent)}

  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40}
  .modal{position:fixed;z-index:41;top:50%;left:50%;transform:translate(-50%,-50%);width:min(460px,94vw);max-height:88vh;overflow:auto;background:var(--ground);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:var(--shadow)}
  .modal h3{font-size:17px;margin-bottom:16px}
  .modal .acts{display:flex;gap:10px;margin-top:20px}
  .modal .acts .btn{flex:1}
  .seg{display:flex;gap:8px;flex-wrap:wrap}
  .seg button{background:var(--raised);border:1px solid var(--line);color:var(--ink-2);border-radius:var(--r-sm);padding:8px 14px;cursor:pointer;font-size:13px;font-weight:600}
  .seg button[aria-pressed="true"]{border-color:var(--primary);color:var(--ink);box-shadow:inset 0 0 0 1px var(--primary)}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:11px 22px;box-shadow:var(--shadow);opacity:0;transition:.22s;z-index:60;font-size:13.5px;font-weight:600}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .trow{border-top:1px solid var(--line)}
  .trow:first-child{border-top:0}
  .thead2{display:flex;align-items:center;gap:11px;padding:13px 0;cursor:pointer;min-width:0}
  .chev{width:15px;height:15px;flex:none;color:var(--ink-3);transition:transform .18s}
  .trow.open .chev{transform:rotate(90deg)}
  .tbody2{padding:0 0 15px 26px;display:none}
  .trow.open .tbody2{display:block}
  .tdesc{color:var(--ink-2);font-size:13px;line-height:1.6;white-space:pre-wrap;margin:0 0 12px}
  .ttl{font-weight:600;font-size:13.5px}
  @keyframes sp{to{transform:rotate(360deg)}}
  /* Segmented control — sized to sit level with the small buttons beside it,
     and quiet: the active segment lifts rather than filling with accent. */
  .segview{display:inline-flex;background:var(--raised);border:1px solid var(--line);
    border-radius:var(--r-sm);padding:2px;gap:2px;flex:none;align-self:center}
  .segview button{border:0;background:transparent;color:var(--ink-3);font:inherit;font-size:12.5px;
    font-weight:600;padding:6px 12px;border-radius:6px;cursor:pointer;line-height:1.2}
  .segview button:hover{color:var(--ink)}
  .segview button[aria-pressed="true"]{background:var(--card);color:var(--ink);
    box-shadow:0 1px 2px rgba(0,0,0,.25)}
  .empty{text-align:center;padding:34px 20px;color:var(--ink-3)}
  .msg{display:grid;grid-template-columns:270px minmax(0,1fr);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--card);box-shadow:var(--shadow);height:600px}
  .convs{border-right:1px solid var(--line);overflow-y:auto;background:var(--page)}
  .conv{display:flex;gap:11px;padding:13px 14px;border:0;border-bottom:1px solid var(--line);cursor:pointer;width:100%;text-align:left;background:none;color:inherit;align-items:center}
  .conv:hover{background:var(--card)}
  .conv[aria-selected="true"]{background:var(--card);box-shadow:inset 2px 0 0 var(--primary)}
  .conv .cn{font-size:13.5px;font-weight:650;display:block}
  .conv .cp{font-size:12px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;max-width:170px}
  .thread{display:flex;flex-direction:column;min-width:0}
  .thead{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px}
  .thead .tn{font-weight:650;font-size:14px} .thead .ts{font-size:12px;color:var(--ink-3)}
  .bubbles{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:11px}
  .bub{max-width:74%;padding:10px 14px;border-radius:16px;font-size:13.5px;line-height:1.5}
  .bub.them{background:var(--raised);border-bottom-left-radius:5px;align-self:flex-start}
  .bub.me{background:var(--primary);color:var(--on-primary);border-bottom-right-radius:5px;align-self:flex-end}
  .composer{border-top:1px solid var(--line);padding:12px 14px;display:flex;gap:10px;align-items:center}
  .composer input{flex:1;background:var(--raised);border:1px solid var(--line);border-radius:999px;padding:9px 15px}

  .empty .ring{width:54px;height:54px;border-radius:50%;border:2px solid var(--line);margin:0 auto 14px;display:grid;place-items:center}
  .spin{display:inline-block;width:15px;height:15px;border:2px solid var(--line);border-top-color:var(--primary);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  @media (max-width:1080px){
    .cols,.cols.even{grid-template-columns:minmax(0,1fr)}
    .shell{grid-template-columns:70px minmax(0,1fr)}
    .rail .word,.rail .sub,.nav span:not(.count),.eyebrow,.who .nm,.who .rl{display:none}
    .nav{justify-content:center}
    .cal{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
  @media (max-width:720px){.stats{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="splash" style="min-height:100vh;display:grid;place-items:center">
  <div style="text-align:center">
    <img src="/img/icon-192.png" alt="" style="width:64px;height:64px;border-radius:17px">
    <div style="font-family:var(--serif);font-size:20px;letter-spacing:3.5px;margin-top:14px">PROVA</div>
    <div style="font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--ink-3);font-weight:700;margin-top:4px">Studio</div>
    <div style="margin-top:18px;display:inline-block;width:16px;height:16px;border:2px solid var(--line);
      border-top-color:var(--primary);border-radius:50%;animation:sp .7s linear infinite"></div>
  </div>
</div>
<div class="login hidden" id="login">
  <div class="loginbox">
    <div class="brand"><img src="/img/icon-192.png" alt="" style="width:34px;height:34px;border-radius:9px">
      <div><div class="word">PROVA</div><div class="sub" style="font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--ink-3);font-weight:700">Studio</div></div></div>
    <p>Sign in with your Prova teacher account.</p>
    <div class="field"><label for="em">Email</label><input id="em" type="email" autocomplete="username"></div>
    <div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password"></div>
    <button class="btn wide" id="loginBtn">Sign in</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<div class="shell hidden" id="app">
  <aside class="rail">
    <div class="brand"><img src="/img/icon-192.png" alt="">
      <div><div class="word">PROVA</div><div class="sub">Studio</div></div></div>
    <div class="navgroup" id="nav"></div>
    <button class="ask" id="askBtn"><strong>Ask Prova</strong><span>Stuck on something? Just ask.</span></button>
    <div class="who">
      <div class="avatar" id="meAv">–</div>
      <div style="min-width:0"><div class="nm" id="meNm">…</div><div class="rl" id="meRl">Teacher</div></div>
      <button class="del" id="signout" title="Sign out" style="margin-left:auto">⏻</button>
    </div>
  </aside>
  <div>
    <header class="top">
      <h1 id="pageTitle">Students</h1>
      <div class="chips">
        <span class="chip"><span class="lab">Students</span><span class="v" id="chipCount">–</span></span>
        <span class="chip"><span class="lab">Code</span><span class="v" id="chipCode">–</span></span>
      </div>
    </header>
    <div id="screen"></div>
  </div>
</div>

<div id="overlays"></div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore, collection, getDocs, doc, getDoc, updateDoc, setDoc, query, where,
  addDoc, serverTimestamp, onSnapshot, orderBy, limit }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

function agoLabel(iso) {
  if (!iso) return 'Never';
  const then = new Date(iso); if (isNaN(then)) return 'Never';
  const days = Math.floor((Date.now() - then.getTime()) / 86400000);
  if (days <= 0) return 'Today';
  if (days === 1) return 'Yesterday';
  return days + ' days ago';
}
function daysSince(iso) {
  if (!iso) return 999;
  const then = new Date(iso); if (isNaN(then)) return 999;
  return Math.floor((Date.now() - then.getTime()) / 86400000);
}
function stateOf(s) {
  const d = daysSince(s.lastSessionDate);
  if (d >= 7) return ['no','Silent'];
  if (d >= 3 || !s.weekMins) return ['sl','Slipping'];
  return ['ok','On track'];
}

// src/lib/teacher.js queryMyStudents — legacy teacherUid OR teacherUids array.
async function loadStudents() {
  const [a, b] = await Promise.all([
    getDocs(query(collection(db, 'users'), where('teacherUid', '==', meUid))),
    getDocs(query(collection(db, 'users'), where('teacherUids', 'array-contains', meUid))),
  ]);
  const map = new Map();
  for (const dd of [...a.docs, ...b.docs]) map.set(dd.id, { uid: dd.id, ...dd.data() });
  students = [...map.values()];

  // Last 7 days of practice per student, from sessionHistory/{uid}/logs.
  const cutoff = dayKey(addDays(new Date(), -6));
  await Promise.all(students.map(async (s) => {
    s.week = {}; s.weekMins = 0;
    try {
      const logs = await getDocs(query(collection(db, 'sessionHistory', s.uid, 'logs'), where('date', '>=', cutoff)));
      logs.forEach((l) => {
        const v = l.data() || {};
        const mins = Number(v.totalMinutes) || 0;
        s.week[v.date || l.id] = mins;
        s.weekMins += mins;
      });
    } catch { /* a student with no history, or rules — treat as zero */ }
  }));
  students.sort((x, y) => daysSince(y.lastSessionDate) - daysSince(x.lastSessionDate));
  $('#chipCount').textContent = students.length;
  renderNav();
}
const byUid = (uid) => students.find((s) => s.uid === uid);

// A teacher with no join code cannot be found by any student, so nothing in
// Studio can ever fill up. Same alphabet as src/lib/teacher.js — ambiguous
// characters (0/O, 1/I) left out so a code can be read aloud.
const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
async function ensureTeacherCode() {
  if (me.teacherCode) return me.teacherCode;
  let code = '';
  for (let i = 0; i < 6; i++) code += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)];
  await saveMe({ teacherCode: code });
  await refreshMe();
  $('#chipCode').textContent = code;
  return code;
}

function ring(pct, colour) {
  const off = 132 - 132 * Math.max(0, Math.min(100, pct)) / 100;
  return `<svg class="art" width="52" height="52" viewBox="0 0 52 52" aria-hidden="true">
    <circle cx="26" cy="26" r="21" fill="none" stroke="var(--raised)" stroke-width="6"/>
    <circle cx="26" cy="26" r="21" fill="none" stroke="${colour}" stroke-width="6" stroke-linecap="round"
      stroke-dasharray="132" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 26 26)"/></svg>`;
}
const statCard = (k, v, u, d, art) =>
  `<div class="stat"><div><div class="k">${k}</div><div class="v">${v}${u ? `<small>${u}</small>` : ''}</div>
   <div class="d">${d}</div></div>${art || ''}</div>`;
function weekBars(week) {
  const days = []; const today = new Date();
  for (let i = 6; i >= 0; i--) { const d = addDays(today, -i); days.push({ k: dayKey(d), d: DOW[(d.getDay() + 6) % 7] }); }
  const max = Math.max(1, ...days.map((x) => week[x.k] || 0));
  return `<div class="chart">${days.map((x) => {
    const m = week[x.k] || 0;
    return `<div class="bar">${m ? `<div class="fill" style="height:${Math.max(6, Math.round(m / max * 96))}%"></div>` : '<div class="zero"></div>'}
      <div class="m">${m}</div><div class="d">${x.d}</div></div>`;
  }).join('')}</div>`;
}
function sparkFor(week) {
  const pts = []; const today = new Date();
  for (let i = 6; i >= 0; i--) pts.push(week[dayKey(addDays(today, -i))] || 0);
  const max = Math.max(1, ...pts);
  const d = pts.map((v, i) => `${i === 0 ? 'M' : 'L'}${i * 9.6} ${18 - (v / max) * 15}`).join(' ');
  return d;
}

}

// mark is a NUMBER 1-5 in the app, drawn as stars — tapping the lit star
// again clears it, same as the phone.
function starPick(sel, set) {
  const host = $(sel); if (!host) return;
  host.addEventListener('click', (e) => {
    const b = e.target.closest('[data-star]'); if (!b) return;
    const n = +b.getAttribute('data-star');
    const cur = [...host.children].filter(x => x.getAttribute('aria-pressed') === 'true').length;
    const next = cur === n ? 0 : n;
    set(next || null);
    [...host.children].forEach((x, i) => {
      const on = i + 1 <= next;
      x.setAttribute('aria-pressed', String(on));
      x.style.color = on ? 'var(--warn)' : 'var(--line)';
    });
  });
}

// ── Assign task — the sheet from TeacherScreen ───────────────────────────
// Task shape written to the student's doc:
// { id,title,description,youtube,song,drill,drillLevel,drillMode,dueDate,
//   durationMin,completed } — anything else the phone would not understand.
// dueDate is stored as a full ISO timestamp. <input type="date"> only accepts
// YYYY-MM-DD, so it has to be converted both ways — and shown as a date, not
// the raw string.
function dueToInput(v) {
  if (!v) return '';
  const d = new Date(v);
  if (isNaN(d)) return typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v) ? v : '';
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
}
// Midday local, so a timezone shift can never move it to the day before.
const inputToDue = (v) => v ? new Date(v + 'T12:00:00').toISOString() : '';
function fmtDue(v) {
  if (!v) return '';
  const d = new Date(v);
  if (isNaN(d)) return String(v);
  const days = Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) -
    new Date(new Date().getFullYear(), new Date().getMonth(), new Date().getDate())) / 86400000);
  if (days < 0) return 'overdue';
  if (days === 0) return 'due today';
  if (days === 1) return 'due tomorrow';
  return 'due ' + d.toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
}

function spark(week, colour) {
  const pts = []; const today = new Date();
  for (let i = 6; i >= 0; i--) pts.push(week[dayKey(addDays(today, -i))] || 0);
  const max = Math.max(1, ...pts);
  const d = pts.map((v, i) => `${i === 0 ? 'M' : 'L'}${i * 11} ${18 - (v / max) * 15}`).join(' ');
  return `<svg class="art" width="72" height="40" viewBox="0 0 72 40" aria-hidden="true">
    <path d="${d} L66 40 L0 40 Z" fill="color-mix(in srgb,${colour} 16%,transparent)"/>
    <path d="${d}" fill="none" stroke="${colour}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

// Lessons falling in the next 7 days, weekly repeats resolved.
function lessonsThisWeek() {
  const out = [];
  for (let i = 0; i < 7; i++) {
    const ds = dayKey(addDays(new Date(), i));
    lessonsOn(ds).forEach(l => out.push({ ...l, date: ds }));
  }
  return out.slice(0, 6);
}

// ══ YOUTUBE ════════════════════════════════════════════════════════════
// Tasks carry `youtube` (a link OR a search phrase) and resources carry `yt`
// (always a phrase). A link plays straight away; a phrase goes through the
// searchYouTube function — the same one the app uses — and the results are
// offered before anything plays.
function ytId(v) {
  if (!v) return null;
  const m = String(v).match(/(?:youtu\.be\/|v=|\/embed\/|\/shorts\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}
function ytPlay(videoId, title) {
  document.querySelector('#overlays').innerHTML = `
    <div class="scrim" data-close></div>
    <div class="modal" style="width:min(860px,94vw);padding:0;overflow:hidden;text-align:left">
      <div style="display:flex;align-items:center;gap:12px;padding:14px 18px">
        <div style="font-weight:650;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(title || 'Lesson')}</div>
        <button class="x" data-close style="margin-left:auto">×</button></div>
      <div style="aspect-ratio:16/9;background:#000">
        <iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(videoId)}?rel=0&autoplay=1"
          style="width:100%;height:100%;border:0" allow="autoplay; encrypted-media; picture-in-picture"
          allowfullscreen title="${esc(title || 'Lesson')}"></iframe></div>
      <div style="padding:12px 18px;display:flex;gap:10px;align-items:center">
        <a class="btn sm ghost" target="_blank" rel="noopener"
           href="https://www.youtube.com/watch?v=${encodeURIComponent(videoId)}">Open on YouTube</a></div>
    </div>`;
}
async function openYouTube(value, title) {
  const direct = ytId(value);
  if (direct) return ytPlay(direct, title);
  const q = String(value || title || '').trim();
  if (!q) return;
  document.querySelector('#overlays').innerHTML = `
    <div class="scrim" data-close></div><div class="modal" style="text-align:left">
      <div style="display:flex;align-items:center"><span class="lab">Finding a lesson</span>
        <button class="x" data-close style="margin-left:auto">×</button></div>
      <h3 style="margin:8px 0 16px;font-size:17px">${esc(q)}</h3>
      <p class="hint" style="margin:0">Searching YouTube…</p></div>`;
  try {
    const res = await httpsCallable(fns, 'searchYouTube')({ q, max: 6 });
    const list = (res?.data?.results) || [];
    if (!list.length) throw new Error('none');
    document.querySelector('#overlays').innerHTML = `
      <div class="scrim" data-close></div><div class="modal" style="text-align:left;width:min(560px,94vw)">
        <div style="display:flex;align-items:center"><span class="lab">Pick a lesson</span>
          <button class="x" data-close style="margin-left:auto">×</button></div>
        <h3 style="margin:8px 0 16px;font-size:17px">${esc(q)}</h3>
        <div class="rows">${list.map(v => `
          <button class="prow" data-ytid="${esc(v.videoId)}" data-yttitle="${esc(v.title || '')}"
            style="width:100%;background:none;border:0;border-top:1px solid var(--line);cursor:pointer;text-align:left">
            ${v.thumbnail ? `<img src="${esc(v.thumbnail)}" alt="" style="width:96px;border-radius:8px;flex:none">` : ''}
            <span class="pl"><span class="pt" style="display:block">${esc(v.title || 'Lesson')}</span>
            <span class="ps">${esc(v.channel || '')}</span></span></button>`).join('')}</div></div>`;
  } catch {
    document.querySelector('#overlays').innerHTML = `
      <div class="scrim" data-close></div><div class="modal" style="text-align:left">
        <div style="display:flex;align-items:center"><span class="lab">Lesson</span>
          <button class="x" data-close style="margin-left:auto">×</button></div>
        <h3 style="margin:8px 0 12px;font-size:17px">${esc(q)}</h3>
        <p class="hint" style="margin:0 0 18px">Couldn't search from here — open the results on YouTube instead.</p>
        <a class="btn" target="_blank" rel="noopener"
           href="https://www.youtube.com/results?search_query=${encodeURIComponent(q)}">Search YouTube</a></div>`;
  }
}
document.addEventListener('click', (e) => {
  const pick = e.target.closest('[data-ytid]');
  if (pick) { ytPlay(pick.getAttribute('data-ytid'), pick.getAttribute('data-yttitle')); return; }
  const open = e.target.closest('[data-yt]');
  if (open) openYouTube(open.getAttribute('data-yt'), open.getAttribute('data-yttitle'));
});


// ══ CHAT MEDIA ═════════════════════════════════════════════════════════
// Uploads land at chatMedia/{chatId}/… — the path the Storage rules already
// allow and the phone already reads. 150 MB cap and image/video only, matching
// src/lib/media.js and storage.rules.
const MAX_UPLOAD_BYTES = 150 * 1024 * 1024;
const STORAGE_BUCKET = 'prova-583c9.firebasestorage.app';
async function uploadChatMedia(file, chatId, onProgress) {
  if (file.size > MAX_UPLOAD_BYTES) throw new Error('too big');
  const type = file.type.startsWith('video') ? 'video' : 'image';
  const ext = (file.name.split('.').pop() || (type === 'video' ? 'mp4' : 'jpg')).toLowerCase();
  const path = `chatMedia/${chatId}/${Date.now()}.${ext}`;
  const token = await auth.currentUser.getIdToken();
  const url = `https://firebasestorage.googleapis.com/v0/b/${STORAGE_BUCKET}/o?uploadType=media&name=${encodeURIComponent(path)}`;
  const res = await new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', url);
    xhr.setRequestHeader('Authorization', 'Bearer ' + token);
    xhr.setRequestHeader('Content-Type', file.type || 'application/octet-stream');
    xhr.upload.onprogress = (e) => { if (e.lengthComputable && onProgress) onProgress(e.loaded / e.total); };
    xhr.onload = () => (xhr.status >= 200 && xhr.status < 300)
      ? resolve(JSON.parse(xhr.responseText)) : reject(new Error('upload ' + xhr.status));
    xhr.onerror = () => reject(new Error('network'));
    xhr.send(file);
  });
  const dlToken = (res.downloadTokens || '').split(',')[0];
  return { url: `https://firebasestorage.googleapis.com/v0/b/${STORAGE_BUCKET}/o/${encodeURIComponent(path)}?alt=media&token=${dlToken}`,
           type };
}
async function sendMedia(file) {
  if (!CUR || !file) return;
  if (!/^(image|video)\//.test(file.type)) { toast('Photos and video only'); return; }
  if (file.size > MAX_UPLOAD_BYTES) { toast('That file is over 150 MB'); return; }
  const bar = document.querySelector('#upBar');
  if (bar) bar.parentElement.style.display = 'block';
  try {
    const media = await uploadChatMedia(file, CUR.id, (p) => { if (bar) bar.style.width = Math.round(p * 100) + '%'; });
    const preview = media.type === 'video' ? '🎥 Video' : '📷 Photo';
    const meta = { chatId: CUR.id, lastMessage: preview, lastMessageAt: serverTimestamp(), lastSenderUid: meUid };
    await addDoc(collection(db, 'chats', CUR.id, 'messages'),
      { senderUid: meUid, text: '', mediaUrl: media.url, mediaType: media.type, timestamp: serverTimestamp() });
    await Promise.all([
      setDoc(doc(db, 'userChats', meUid, 'conversations', CUR.id),
        { ...meta, otherUid: CUR.otherUid, otherEmail: CUR.otherEmail || '' }, { merge: true }),
      setDoc(doc(db, 'userChats', CUR.otherUid, 'conversations', CUR.id),
        { ...meta, otherUid: meUid, otherEmail: me.email || '' }, { merge: true }),
    ]);
  } catch (err) {
    toast(/too big|over 150/.test(err.message) ? 'That file is over 150 MB' : 'Upload failed — try again');
  } finally {
    if (bar) { bar.style.width = '0%'; bar.parentElement.style.display = 'none'; }
  }
}

// ══ MESSAGES ═══════════════════════════════════════════════════════════
// src/lib/chat.js: chatId is the two meUids sorted and joined, the thread
// lives at chats/{chatId}/messages, and each side keeps a pointer at
// userChats/{meUid}/conversations/{chatId}.
const makeChatId = (a, b) => [a, b].sort().join('_');
let CONVS = [], CUR = null, unsubMsgs = null, MSGS = [];
const NAMES = {};   // meUid → display name, resolved once

async function nameFor(meUid, fallback) {
  if (NAMES[meUid]) return NAMES[meUid];
  try {
    const d = (await getDoc(doc(db, 'users', meUid))).data() || {};
    NAMES[meUid] = displayName({ ...d, email: d.email || fallback });
  } catch { NAMES[meUid] = (fallback || '').split('@')[0] || 'Someone'; }
  return NAMES[meUid];
}

async function loadConvs() {
  const snap = await getDocs(collection(db, 'userChats', meUid, 'conversations'));
  CONVS = snap.docs.map(d => ({ id: d.id, ...d.data() }))
    .sort((a, b) => (b.lastMessageAt?.seconds || 0) - (a.lastMessageAt?.seconds || 0));
  await Promise.all(CONVS.map(async c => { c.name = await nameFor(c.otherUid, c.otherEmail); }));
}

function openThread(chatId) {
  CUR = CONVS.find(c => c.id === chatId) || null;
  if (unsubMsgs) { unsubMsgs(); unsubMsgs = null; }
  MSGS = [];
  if (!CUR) return paintThread();
  paintThread();
  const q = query(collection(db, 'chats', chatId, 'messages'), orderBy('timestamp', 'asc'), limit(200));
  unsubMsgs = onSnapshot(q, (snap) => {
    MSGS = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    paintBubbles();
  }, () => { MSGS = []; paintBubbles(); });
  setDoc(doc(db, 'chats', chatId), { lastRead: { [meUid]: new Date().toISOString() } }, { merge: true }).catch(() => {});
}

function paintBubbles() {
  const b = document.querySelector('#thBub'); if (!b) return;
  const atBottom = b.scrollHeight - b.scrollTop - b.clientHeight < 60;
  b.innerHTML = MSGS.length ? MSGS.map(m => {
      const mine = m.senderUid === meUid;
      const when = m.timestamp?.seconds
        ? new Date(m.timestamp.seconds * 1000).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : '';
      if (m.mediaUrl) return `<div class="bub ${mine ? 'me' : 'them'}" style="padding:6px">
        ${m.mediaType === 'video'
          ? `<video src="${esc(m.mediaUrl)}" controls style="max-width:230px;border-radius:12px;display:block"></video>`
          : `<img src="${esc(m.mediaUrl)}" alt="" style="max-width:230px;border-radius:12px;display:block">`}</div>`;
      return `<div class="bub ${mine ? 'me' : 'them'}">${esc(m.text)}
        <span style="display:block;font-size:10.5px;opacity:.6;margin-top:3px">${when}</span></div>`;
    }).join('') : '<div class="empty">No messages yet — say hello.</div>';
  if (atBottom) b.scrollTop = b.scrollHeight;
}

function paintThread() {
  const host = document.querySelector('#thread'); if (!host) return;
  if (!CUR) { host.innerHTML = `<div class="empty">Pick a conversation.</div>`; return; }
  host.innerHTML = `
    <div class="thead"><span class="avatar">${initials(CUR.name || '?')}</span>
      <div><div class="tn">${esc(CUR.name)}</div><div class="ts">${esc(CUR.otherEmail || '')}</div></div></div>
    <div class="bubbles" id="thBub"></div>
    <div style="display:none;padding:0 14px"><div style="height:4px;background:var(--raised);border-radius:2px;overflow:hidden">
      <div id="upBar" style="width:0%;height:100%;background:var(--primary);transition:width .15s"></div></div></div>
    <div class="composer">
      <label class="btn sm ghost" for="msgFile" style="cursor:pointer;flex:none">📎</label>
      <input id="msgFile" type="file" accept="image/*,video/*" style="display:none">
      <input id="msgIn" placeholder="Write a message…" autocomplete="off">
      <button class="btn sm" id="msgSend">Send</button></div>`;
  paintBubbles();
  const inp = document.querySelector('#msgIn');
  document.querySelector('#msgSend').onclick = sendMsg;
  inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMsg(); });
  const fileIn = document.querySelector('#msgFile');
  if (fileIn) fileIn.addEventListener('change', () => {
    const f = fileIn.files && fileIn.files[0];
    fileIn.value = '';
    if (f) sendMedia(f);
  });
  inp.focus();
}

async function sendMsg() {
  const inp = document.querySelector('#msgIn');
  const text = (inp.value || '').trim();
  if (!text || !CUR) return;
  inp.value = '';
  const meta = { chatId: CUR.id, lastMessage: text, lastMessageAt: serverTimestamp(), lastSenderUid: meUid };
  try {
    await addDoc(collection(db, 'chats', CUR.id, 'messages'),
      { senderUid: meUid, text, timestamp: serverTimestamp() });
    // Both sides get the pointer updated, exactly as sendChatMessage does.
    await Promise.all([
      setDoc(doc(db, 'userChats', meUid, 'conversations', CUR.id),
        { ...meta, otherUid: CUR.otherUid, otherEmail: CUR.otherEmail || '' }, { merge: true }),
      setDoc(doc(db, 'userChats', CUR.otherUid, 'conversations', CUR.id),
        { ...meta, otherUid: meUid, otherEmail: me.email || '' }, { merge: true }),
    ]);
  } catch { inp.value = text; toast('Could not send — check your connection'); }
}

// ── OVERVIEW — attendance and marks over a term, a year, or all time ────
// TeacherOverviewScreen's ranges, computed off the same attendance map.
const RANGE_DAYS = { Term: 90, Year: 365, All: 100000 };
let OVR = 'Term';
function viewOverview() {
  const cutoff = dayKey(addDays(new Date(), -RANGE_DAYS[OVR]));
  const recs = attendanceList().filter(r => (r.date || '') >= cutoff);
  const byStudent = {};
  recs.forEach(r => {
    const k = r.studentUid || r.studentName || '—';
    const b = byStudent[k] || (byStudent[k] = { name: r.studentName || 'Student', present: 0, late: 0,
      absent: 0, notMarked: 0, marks: [], notes: [] });
    if (r.status === 'present') b.present++;
    else if (r.status === 'late') b.late++;
    else if (r.status === 'absent') b.absent++;
    else b.notMarked++;
    if (r.mark) b.marks.push(+r.mark);
    if ((r.note || '').trim()) b.notes.push({ date: r.date, note: r.note });
  });
  const rows = Object.values(byStudent).sort((a, b) => a.name.localeCompare(b.name));
  const tot = rows.reduce((a, r) => ({ present: a.present + r.present, late: a.late + r.late,
    absent: a.absent + r.absent, lessons: a.lessons + r.present + r.late + r.absent + r.notMarked }),
    { present: 0, late: 0, absent: 0, lessons: 0 });
  const allMarks = rows.flatMap(r => r.marks);
  const avg = allMarks.length ? (allMarks.reduce((a, b) => a + b, 0) / allMarks.length) : 0;
  const stars = (n) => `<span style="color:var(--warn)">${'★'.repeat(Math.round(n))}<span style="color:var(--line)">${'★'.repeat(5 - Math.round(n))}</span></span>`;

  $('#screen').innerHTML = `<div class="content">
    <div class="greet"><div><h2>Overview</h2>
      <p>Attendance and marks across your studio.</p></div>
      <div style="margin-left:auto;display:flex;gap:8px">
        ${Object.keys(RANGE_DAYS).map(k => `<button class="btn ghost sm" data-ovr="${k}"${
          OVR === k ? ' style="border-color:var(--primary);color:var(--ink)"' : ''}>${k}</button>`).join('')}</div></div>

    <div class="stats">
      ${statCard('Lessons', tot.lessons, '', `${OVR === 'All' ? 'All time' : 'Last ' + RANGE_DAYS[OVR] + ' days'}`, '')}
      ${statCard('Attendance', tot.lessons ? Math.round(tot.present / tot.lessons * 100) : 0, '%',
        `${tot.present} present · ${tot.late} late · ${tot.absent} absent`,
        ring(tot.lessons ? tot.present / tot.lessons * 100 : 0, 'var(--good)'))}
      ${statCard('Average mark', allMarks.length ? avg.toFixed(1) : '—', allMarks.length ? '/5' : '',
        allMarks.length ? `${allMarks.length} lessons marked` : 'Nothing marked yet', '')}
    </div>

    ${rows.length ? `<section class="card"><header><h3>By student</h3><span class="meta">${rows.length}</span></header>
      <div class="tablewrap"><table><thead><tr><th>Student</th><th>Lessons</th><th>Present</th>
        <th>Late</th><th>Absent</th><th>Average mark</th></tr></thead><tbody>
        ${rows.map(r => { const n = r.present + r.late + r.absent + r.notMarked;
          const m = r.marks.length ? r.marks.reduce((a, b) => a + b, 0) / r.marks.length : 0;
          return `<tr><td class="stu"><span class="avatar">${initials(r.name)}</span>${esc(r.name)}</td>
            <td class="n">${n}</td><td class="n">${r.present}</td><td class="n">${r.late}</td><td class="n">${r.absent}</td>
            <td>${r.marks.length ? stars(m) + ` <span class="hint">${m.toFixed(1)}</span>` : '<span class="hint">—</span>'}</td></tr>`;
        }).join('')}</tbody></table></div></section>`
      : `<section class="card">${emptyState('Nothing in this range', 'Mark attendance on the calendar and it builds up here.')}</section>`}

    ${rows.some(r => r.notes.length) ? `<section class="card"><header><h3>Lesson notes</h3>
      <span class="meta">${rows.reduce((a, r) => a + r.notes.length, 0)}</span></header>
      ${rows.filter(r => r.notes.length).map(r => `
        <div class="trow${ROPEN['ov' + r.name] ? ' open' : ''}">
          <div class="thead2" data-ovopen="${esc(r.name)}">
            <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 5l7 7-7 7"/></svg>
            <div style="flex:1;min-width:0"><div class="ttl">${esc(r.name)}</div></div>
            <div class="dur">${r.notes.length} note${r.notes.length === 1 ? '' : 's'}</div></div>
          <div class="tbody2">${r.notes.sort((a, b) => String(b.date).localeCompare(String(a.date)))
            .map(n => `<div style="padding:9px 0;border-top:1px solid var(--line)">
              <div class="hint">${esc(fmtDay(n.date))}</div>
              <div style="font-size:13px;color:var(--ink-2);line-height:1.6;margin-top:3px">${esc(n.note)}</div></div>`).join('')}
          </div></div>`).join('')}</section>` : ''}
  </div>`;

  $('#screen').addEventListener('click', (e) => {
    const r = e.target.closest('[data-ovr]');
    if (r) { OVR = r.getAttribute('data-ovr'); return viewOverview(); }
    const o = e.target.closest('[data-ovopen]');
    if (o) { const y = window.scrollY, k = 'ov' + o.getAttribute('data-ovopen');
      ROPEN[k] = !ROPEN[k]; viewOverview(); window.scrollTo(0, y); }
  }, { once: true });
}

async function delFrom(field, i) {
  if (!confirm('Delete this?')) return;
  const next = (Array.isArray(me[field]) ? me[field] : []).filter((_, k) => k !== i);
  try { await saveMe({ [field]: next }); await refreshMe(); viewResources(); toast('Deleted'); }
  catch { toast('Could not delete'); }
}
// One sheet for all three — they differ only in their fields.
function newThing(kind, editIdx) {
  const F = 'width:100%;background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:inherit;font:inherit';
  const field = kind === 'pack' ? 'packs' : kind === 'program' ? 'programs' : 'resources';
  const list = Array.isArray(me[field]) ? me[field] : [];

  modal(`<div style="display:flex;align-items:center"><span class="lab">${label}</span>
      <button class="x" data-close style="margin-left:auto">×</button></div>

      <input id="ntCat" placeholder="Category (optional) — e.g. Technique" style="${F}" value="${esc(ex?.category || '')}">` : ''}

    ${kind === 'program' ? `<input id="ntWeeks" type="number" min="1" max="52" placeholder="Weeks"
      value="${ex?.weeks || 6}" style="${F};width:120px">` : ''}

      <button class="btn" id="ntSave" style="flex:1">${ex ? 'Save' : 'Create'}</button></div>`);

    const title = $('#ntTitle').value.trim();

    $('#ntSave').disabled = true;

      toast(ex ? 'Saved' : `${label} created`); }
    catch { toast('Could not save'); $('#ntSave').disabled = false; }
  };
}

  const withNotes = recs.filter((r) => (r.note || '').trim());
  $('#screen').innerHTML = `<div class="content">
    <div class="greet"><div><h2>Lesson notes</h2><p>Written after a lesson. Each student sees only their own.</p></div>
      <button class="btn" id="newNote"${students.length ? '' : ' disabled title="Connect a student first"'}>Write a note</button></div>
    ${noStudentsNotice('Notes are written against a student, so you’ll need one first.')}
    <div class="cols"><div class="stack">
      <section class="card"><header><h3>Recent notes</h3><span class="meta">${withNotes.length}</span></header>
      ${withNotes.length ? withNotes.map((r) => `
        <div class="prow" style="align-items:flex-start">
          <div class="pl">
            <div class="pt">${esc(r.studentName || 'Student')} <span class="hint" style="font-weight:400">· ${esc(fmtDay(r.date || ''))}</span></div>
            <div style="color:var(--ink-2);font-size:13px;margin-top:5px;line-height:1.6">${esc(r.note)}</div>
            ${r.status ? `<span class="pill ${r.status === 'present' ? 'ok' : r.status === 'late' ? 'warn' : 'bad'}" style="margin-top:8px">${esc(r.status)}</span>` : ''}
            ${r.mark ? `<span style="margin-left:8px;color:var(--warn)">${'★'.repeat(+r.mark)}</span>` : ''}
          </div>
          <button class="btn sm ghost" data-edit="${esc(r.key)}">Edit</button>
        </div>`).join('')
      : emptyState('No notes yet', 'Write one after your next lesson — it lands in the student’s app straight away.')}
      </section>
    </div><div class="stack">
      <section class="card"><header><h3>Lessons without a note</h3></header>
        ${(() => {
          const missing = recs.filter((r) => !(r.note || '').trim());
          const past = pastLessonsWithoutRecord();
          const all = [...missing.map((m) => ({ name: m.studentName, date: m.date, key: m.key })), ...past];
          return all.length ? all.slice(0, 8).map((m) => `
            <div class="prow"><div class="pl"><div class="pt">${esc(m.name || 'Student')}</div>
              <div class="ps">${esc(fmtDay(m.date))}</div></div>
              <button class="btn sm ghost" data-write="${esc(m.key)}">Write</button></div>`).join('')
            : '<p class="hint" style="margin:0">Every lesson has a note. Nice.</p>';
        })()}
      </section>
    </div></div></div>`;

  $('#newNote').onclick = () => noteModal(null);
}
// Lessons in the past 30 days that have no attendance record at all.
function pastLessonsWithoutRecord() {
  const att = me.attendance || {}, out = [];
  const today = dayKey(new Date());
  for (let i = 1; i <= 30; i++) {
    const ds = dayKey(addDays(new Date(), -i));
    lessonsOn(ds).forEach((l) => {
      const k = `${l.id}__${ds}`;
      if (!att[k]) out.push({ name: l.studentName, date: ds, key: k, lesson: l });
    });
  }
  return out.filter((x) => x.date <= today);
}
function noteModal(key) {
  const att = me.attendance || {};
  const rec = key ? att[key] : null;
  const opts = students.map((s) => `<option value="${s.uid}">${esc(displayName(s))}</option>`).join('');
  modal(`<h3>${rec ? 'Edit note' : 'Write a lesson note'}</h3>
    ${rec ? `<p class="hint" style="margin:-8px 0 16px">${esc(rec.studentName || '')} · ${esc(fmtDay(rec.date || ''))}</p>` : `
    <div class="field"><label>Student</label><select id="nStu">${opts}</select></div>
    <div class="field"><label>Date</label><input id="nDate" type="date" value="${dayKey(new Date())}"></div>`}
    <div class="field"><label>Attendance</label><div class="seg" id="nStatus">
      ${['present','late','absent'].map((s) => `<button data-v="${s}" aria-pressed="${rec?.status === s}">${s[0].toUpperCase() + s.slice(1)}</button>`).join('')}
    </div></div>
    <div class="field"><label>How did it go?</label><div class="seg" id="nMark" data-stars="1">
      ${[1,2,3,4,5].map(n => `<button data-star="${n}" aria-pressed="${(rec?.mark || 0) >= n}"
        style="font-size:19px;padding:4px 6px;line-height:1;background:none;border:0;color:${(rec?.mark || 0) >= n
          ? 'var(--warn)' : 'var(--line)'}">★</button>`).join('')}</div></div>
    <div class="field"><label>Note</label><textarea id="nNote" rows="5" placeholder="What you covered, what to practise…">${esc(rec?.note || '')}</textarea></div>
    <div class="acts"><button class="btn ghost" data-close>Cancel</button><button class="btn" id="nSave">Save note</button></div>`);

  let status = rec?.status || '', mark = rec?.mark || '';
  const seg = (id, set) => {
    const host = $('#' + id);
    host.addEventListener('click', (e) => {
      const b = e.target.closest('[data-v]'); if (!b) return;
      const v = b.getAttribute('data-v');
      const now = set(b.getAttribute('aria-pressed') === 'true' ? '' : v);
      [...host.children].forEach((x) => x.setAttribute('aria-pressed', String(x.getAttribute('data-v') === now)));
    });
  };
  seg('nStatus', (v) => (status = v));
  starPick('#nMark', (v) => { mark = v; });

  $('#nSave').onclick = async () => {
    const note = $('#nNote').value.trim();
    let k = key, studentUid, studentName, date;
    if (rec) { studentUid = rec.studentUid; studentName = rec.studentName; date = rec.date; }
    else {
      studentUid = $('#nStu').value;
      const s = byUid(studentUid);
      studentName = s ? displayName(s) : 'Student';
      date = $('#nDate').value;
      if (!date) { toast('Pick a date'); return; }
      k = `manual${Date.parse(date)}__${date}`;
    }
    if (!note && !status && !mark) { toast('Add a note, or a status'); return; }
    const next = { ...(me.attendance || {}) };
    next[k] = { ...(next[k] || {}), studentUid, studentName, date, status, mark, note };
    $('#nSave').disabled = true;
    try { await saveMe({ attendance: next }); await refreshMe(); closeModal(); viewNotes(); toast('Note saved'); }
    catch { toast('Could not save'); $('#nSave').disabled = false; }
  };
}

// ── 3. CALENDAR ───────────────────────────────────────────────────────────
const lessonsAll = () => (Array.isArray(me.lessons) ? me.lessons : []);
// A lesson shows on its own date, and every following same-weekday if weekly.
function lessonsOn(ds) {
  return lessonsAll().filter((l) => {
    if (!l.date) return false;
    if (l.date === ds) return true;
    if (l.repeat !== 'weekly' || ds < l.date) return false;
    return new Date(l.date + 'T00:00:00Z').getUTCDay() === new Date(ds + 'T00:00:00Z').getUTCDay();
  }).sort((a, b) => String(a.time || '').localeCompare(String(b.time || '')));
}
let weekOffset = 0, CALMODE = 'week';
const CAL_SPAN = { week: 7, fortnight: 14, month: 28 };
function viewCalendar() {
  const span = CAL_SPAN[CALMODE] || 7;
  // Step a whole period at a time — this was moving span/7 DAYS, so Week
  // advanced one day and Month four. Always anchored to a Monday.
  const monday = addDays(startOfWeek(new Date()), weekOffset * span);
  const days = Array.from({ length: span }, (_, i) => addDays(monday, i));
  const today = dayKey(new Date());
  const att = me.attendance || {};
  const count = days.reduce((a, d) => a + lessonsOn(dayKey(d)).length, 0);

  $('#screen').innerHTML = `<div class="content">
    <div class="greet"><div><h2>Calendar</h2>
      <p>${CALMODE === 'week' ? 'Week of ' + monday.toLocaleDateString(undefined, { day: 'numeric', month: 'long' })
        : monday.toLocaleDateString(undefined, { day: 'numeric', month: 'short' }) + ' – ' +
          addDays(monday, span - 1).toLocaleDateString(undefined, { day: 'numeric', month: 'short' })}
        · ${count} lesson${count === 1 ? '' : 's'}</p></div>
      <div style="margin-left:auto;display:flex;gap:8px">
        <button class="btn ghost sm" id="prevW">← Previous</button>
        <div style="display:flex;gap:8px">${[['week','Week'],['fortnight','Fortnight'],['month','Month']]
          .map(([k, l]) => `<button class="btn ghost sm" data-calmode="${k}"${CALMODE === k
            ? ' style="border-color:var(--primary);color:var(--ink)"' : ''}>${l}</button>`).join('')}</div>
        <button class="btn ghost sm" id="nextW">Next →</button>
        <button class="btn" id="addLesson"${students.length ? '' : ' disabled title="Connect a student first"'}>Add lesson</button>
      </div></div>
    ${noStudentsNotice('You can’t book a lesson until a student has joined.')}
    <section class="card"><div class="cal">
      ${days.slice(0, 7).map((d) => `<div class="hd">${DOW[(d.getDay() + 6) % 7]}</div>`).join('')}
      ${days.map((d) => {
        const ds = dayKey(d);
        return `<div class="cell ${ds === today ? 'today' : ''}">
          <div class="hint" style="font-family:var(--round);font-weight:600">${d.getDate()}</div>
          ${lessonsOn(ds).map((l) => {
          const rec = att[`${l.id}__${ds}`] || {};
          return `<button class="ev ${rec.status ? 'att-' + rec.status : ''}" data-lesson="${esc(l.id)}" data-date="${ds}">
            <b>${esc(l.studentName || 'Student')}</b><span class="tm">${esc(l.time || '')}</span>
            ${rec.status ? `<span class="tm"> · ${esc(rec.status)}</span>` : ''}</button>`;
        }).join('')}</div>`;
      }).join('')}
    </div>
    <p class="hint" style="margin:14px 0 0">Click a lesson to mark attendance, write a note or cancel it.</p></section>
  </div>`;

  document.querySelectorAll('[data-calmode]').forEach(b => b.onclick = () => {
    CALMODE = b.getAttribute('data-calmode'); weekOffset = 0; viewCalendar();
  });
  $('#prevW').onclick = () => { weekOffset--; viewCalendar(); };
  $('#nextW').onclick = () => { weekOffset++; viewCalendar(); };
  $('#addLesson').onclick = lessonModal;
}
function lessonModal() {
  if (!students.length) { toast('Add a student first'); return; }
  modal(`<h3>Book a lesson</h3>
    <div class="field"><label>Student</label><select id="lStu">${students.map((s) => `<option value="${s.uid}">${esc(displayName(s))}</option>`).join('')}</select></div>
    <div class="field"><label>Date</label><input id="lDate" type="date" value="${dayKey(new Date())}"></div>
    <div class="field"><label>Time</label><input id="lTime" type="time" value="16:30"></div>
    <div class="field"><label>Note (optional)</label><input id="lNote" placeholder="What you plan to cover"></div>
    <div class="field"><label>Repeat</label><div class="seg" id="lRep">
      <button data-v="none" aria-pressed="true">One off</button><button data-v="weekly" aria-pressed="false">Every week</button></div></div>
    <div class="acts"><button class="btn ghost" data-close>Cancel</button><button class="btn" id="lSave">Book it</button></div>`);
  let repeat = 'none';
  $('#lRep').addEventListener('click', (e) => {
    const b = e.target.closest('[data-v]'); if (!b) return;
    repeat = b.getAttribute('data-v');
    [...$('#lRep').children].forEach((x) => x.setAttribute('aria-pressed', String(x.getAttribute('data-v') === repeat)));
  });
  $('#lSave').onclick = async () => {
    const uid = $('#lStu').value, s = byUid(uid);
    const date = $('#lDate').value, time = $('#lTime').value;
    if (!date || !time) { toast('Pick a date and a time'); return; }
    const lesson = { id: Date.now().toString(), studentUid: uid, studentName: s ? displayName(s) : 'Student', date, time, note: $('#lNote').value.trim(), repeat };
    $('#lSave').disabled = true;
    try { await saveMe({ lessons: [...lessonsAll(), lesson] }); await refreshMe(); closeModal(); viewCalendar(); toast('Lesson booked'); }
    catch { toast('Could not save'); $('#lSave').disabled = false; }
  };
}
function occurrenceModal(lessonId, ds) {
  const l = lessonsAll().find((x) => x.id === lessonId); if (!l) return;
  const key = `${lessonId}__${ds}`;
  const rec = (me.attendance || {})[key] || {};
  modal(`<h3>${esc(l.studentName || 'Lesson')}</h3>
    <p class="hint" style="margin:-8px 0 18px">${esc(fmtDay(ds))} at ${esc(l.time || '')}${l.repeat === 'weekly' ? ' · repeats weekly' : ''}${l.note ? ' · ' + esc(l.note) : ''}</p>
    <div class="field"><label>Attendance</label><div class="seg" id="oStatus">
      ${['present','late','absent'].map((s) => `<button data-v="${s}" aria-pressed="${rec.status === s}">${s[0].toUpperCase() + s.slice(1)}</button>`).join('')}</div></div>
    <div class="field"><label>How did it go?</label><div class="seg" id="oMark" data-stars="1">
      ${[1,2,3,4,5].map(n => `<button data-star="${n}" aria-pressed="${(rec.mark || 0) >= n}"
        style="font-size:19px;padding:4px 6px;line-height:1;background:none;border:0;color:${(rec.mark || 0) >= n
          ? 'var(--warn)' : 'var(--line)'}">★</button>`).join('')}</div></div>
    <div class="field"><label>Lesson note</label><textarea id="oNote" rows="4" placeholder="What you covered, what to practise…">${esc(rec.note || '')}</textarea></div>
    <div class="acts"><button class="btn ghost" id="oDel">Cancel lesson</button><button class="btn" id="oSave">Save</button></div>`);
  let status = rec.status || '', mark = rec.mark || '';
  const seg = (id, set) => $('#' + id).addEventListener('click', (e) => {
    const b = e.target.closest('[data-v]'); if (!b) return;
    const v = set(b.getAttribute('aria-pressed') === 'true' ? '' : b.getAttribute('data-v'));
    [...$('#' + id).children].forEach((x) => x.setAttribute('aria-pressed', String(x.getAttribute('data-v') === v)));
  });
  seg('oStatus', (v) => (status = v));
  starPick('#oMark', (v) => { mark = v; });
  $('#oSave').onclick = async () => {
    const next = { ...(me.attendance || {}) };
    const note = $('#oNote').value.trim();
    if (!status && !mark && !note) delete next[key];
    else next[key] = { ...rec, studentUid: l.studentUid, studentName: l.studentName, date: ds, status, mark, note };
    $('#oSave').disabled = true;
    try { await saveMe({ attendance: next }); await refreshMe(); closeModal(); viewCalendar(); toast('Saved'); }
    catch { toast('Could not save'); $('#oSave').disabled = false; }
  };
  $('#oDel').onclick = async () => {
    if (!confirm(l.repeat === 'weekly'
      ? 'Cancel this weekly lesson and all its future occurrences?'
      : 'Cancel this lesson?')) return;
    try { await saveMe({ lessons: lessonsAll().filter((x) => x.id !== lessonId) }); await refreshMe(); closeModal(); viewCalendar(); toast('Lesson cancelled'); }
    catch { toast('Could not save'); }
  };
}

// ── 4. PARENT REPORTS ─────────────────────────────────────────────────────
const CADENCE = [['off','Off'],['weekly','Weekly'],['fortnightly','Fortnightly'],['monthly','Monthly']];
function viewReports() {
  const emails = me.parentEmails && typeof me.parentEmails === 'object' ? me.parentEmails : {};
  const cadence = me.reportCadence || 'off';
  const withEmail = students.filter((s) => emails[s.uid]).length;

  $('#screen').innerHTML = `<div class="content">
    <div class="greet"><div><h2>Parent reports</h2>
      <p>A weekly summary of practice, streak, tasks and attendance — emailed to parents.</p></div>
      <button class="btn" id="sendNow"${withEmail ? '' : ' disabled title="Add at least one parent email first"'}>Send this week now</button></div>
    ${noStudentsNotice('Parent reports are built per student, so you’ll need one first.')}
    <div class="cols"><div class="stack">
      <section class="card"><header><h3>Parent contacts</h3><span class="meta">${withEmail} of ${students.length}</span></header>
        ${students.length ? `<div class="rows" id="contacts">${students.map((s) => `
          <div class="prow"><div class="pl"><div class="pt">${esc(displayName(s))}</div>
            <div class="ps">${esc(s.instrument || '')}${s.level ? ' · ' + esc(s.level) : ''}</div></div>
            <input data-email="${s.uid}" type="email" placeholder="parent@example.com"
              value="${esc(emails[s.uid] || '')}" style="max-width:250px"></div>`).join('')}</div>
          <button class="btn" id="saveContacts" style="margin-top:16px">Save contacts</button>`
        : emptyState('No students yet', 'Parent contacts appear once students join.')}
      </section>
    </div><div class="stack">
      <section class="card"><header><h3>Automatic reports</h3></header>
        <p class="hint" style="margin:0 0 14px">Sends Sundays at 5pm. Off by default so nothing goes out by accident.</p>
        <div class="seg" id="cadence">${CADENCE.map(([v, l]) =>
          `<button data-v="${v}" aria-pressed="${cadence === v}">${l}</button>`).join('')}</div>
        ${me.lastAutoReportAt ? `<p class="hint" style="margin:14px 0 0">Last sent ${esc(agoLabel(me.lastAutoReportAt).toLowerCase())}${me.lastAutoReportCount ? ` · ${me.lastAutoReportCount} report${me.lastAutoReportCount === 1 ? '' : 's'}` : ''}.</p>` : ''}
      </section>
      <section class="card"><header><h3>Send a test</h3></header>
        <p class="hint" style="margin:0 0 12px">Sends one report to an address of your choice so you can see exactly what a parent gets.</p>
        <input id="testEmail" type="email" placeholder="you@example.com" value="${esc(me.email || '')}">
        <button class="btn ghost wide" id="sendTest" style="margin-top:10px">Send test report</button>
      </section>
      <section class="card"><header><h3>What a parent sees</h3></header>
        <p class="hint" style="margin:0">Minutes practised each day, current streak, tasks completed, attendance and your latest lesson note. Nothing else — never chat, never their journal.</p>
      </section>
    </div></div></div>`;

  const sc = $('#saveContacts');
  if (sc) sc.onclick = async () => {
    const cleaned = {};
    document.querySelectorAll('[data-email]').forEach((i) => {
      const v = i.value.trim();
      if (v) cleaned[i.getAttribute('data-email')] = v;
    });
    sc.disabled = true;
    try { await saveMe({ parentEmails: cleaned }); await refreshMe(); toast('Contacts saved'); }
    catch { toast('Could not save'); }
    finally { sc.disabled = false; }
  };
  $('#cadence').addEventListener('click', async (e) => {
    const b = e.target.closest('[data-v]'); if (!b) return;
    const v = b.getAttribute('data-v');
    [...$('#cadence').children].forEach((x) => x.setAttribute('aria-pressed', String(x.getAttribute('data-v') === v)));
    try { await saveMe({ reportCadence: v }); await refreshMe(); toast(v === 'off' ? 'Automatic reports off' : 'Reports set to ' + v); }
    catch { toast('Could not save'); }
  });
  $('#sendNow').onclick = () => sendReports({});
  $('#sendTest').onclick = () => {
    const to = $('#testEmail').value.trim();
    if (!to) { toast('Enter an email address'); return; }
    sendReports({ testEmail: to });
  };
}
async function sendReports(args) {
  const btn = args.testEmail ? $('#sendTest') : $('#sendNow');
  const label = btn.textContent;
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Sending…';
  try {
    const fn = httpsCallable(fns, 'sendParentReportsNow');
    const res = await fn(args);
    const n = res?.data?.sent ?? res?.data?.count;
    toast(args.testEmail ? 'Test report sent' : `Sent${typeof n === 'number' ? ' ' + n + ' report' + (n === 1 ? '' : 's') : ''}`);
    await refreshMe();
  } catch (e) {
    toast(e?.message ? 'Failed: ' + e.message : 'Could not send');
  } finally { btn.disabled = false; btn.textContent = label; }
}
</script>
</body>
</html>
