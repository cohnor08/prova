<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prova</title>
<link rel="icon" href="/img/icon-192.png">
<style>
  :root{
    color-scheme:dark;
    --page:#101318;--ground:#171A21;--card:#212630;--raised:#2A303C;--line:#333B4A;
    --ink:#F4F6FA;--ink-2:#A8B2C4;--ink-3:#8A94A8;--primary:#2A99DB;--primary-dk:#1E7CB5;
    --teal:#1D93A1;--good:#6EE7B7;--warn:#B8894A;--bad:#F58B8B;--on-primary:#fff;
    --r-sm:8px;--r-md:12px;--r-lg:18px;
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Helvetica,Arial,sans-serif;
    --round:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;
    --serif:Georgia,"Iowan Old Style",serif;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.22);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
  h1,h2,h3{margin:0;text-wrap:balance}
  button,input{font:inherit;color:inherit}
  .hidden{display:none!important}
  :focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:4px}
  .fig{font-family:var(--round);font-weight:600;font-variant-numeric:tabular-nums}

  .login{min-height:100vh;display:grid;place-items:center;padding:24px}
  .loginbox{width:min(400px,100%);background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:30px;box-shadow:var(--shadow)}
  .loginbox .word{font-family:var(--serif);font-size:21px;letter-spacing:3.5px}
  .loginbox p{color:var(--ink-3);font-size:13px;margin:6px 0 22px}
  label{display:block;font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-3);margin:0 0 6px}
  input{width:100%;background:var(--raised);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px}
  input:focus{border-color:var(--primary);outline:none}
  input::placeholder{color:var(--ink-3)}
  /* Chrome paints saved-password fields pale blue and ignores background —
     only an inset shadow the size of the box overrides it. */
  input:-webkit-autofill,
  input:-webkit-autofill:hover,
  input:-webkit-autofill:focus,
  input:-webkit-autofill:active{
    -webkit-text-fill-color:var(--ink);
    -webkit-box-shadow:0 0 0 1000px var(--raised) inset;
    box-shadow:0 0 0 1000px var(--raised) inset;
    caret-color:var(--ink);
    transition:background-color 9999s ease-out 0s;
  }
  select{background:var(--raised);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;color:var(--ink)}
  textarea{background:var(--raised);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;color:var(--ink)}
  input[type=number]::-webkit-inner-spin-button{opacity:.35}
  .field{margin-bottom:15px}
  .err{color:var(--bad);font-size:13px;min-height:19px;margin-top:4px}
  .rolebtn{display:block;width:100%;text-align:left;background:var(--raised);border:1px solid var(--line);
    border-radius:var(--r-md);padding:14px 16px;margin-bottom:10px;cursor:pointer}
  .rolebtn:hover{border-color:var(--primary)}
  .rolebtn b{display:block;font-size:14.5px;font-weight:650}
  .rolebtn span{display:block;font-size:12.5px;color:var(--ink-3);margin-top:2px}
  .linkbtn{width:100%;background:none;border:0;color:var(--ink-3);font-size:13px;cursor:pointer;padding:10px 0;text-align:center}
  .linkbtn b{color:var(--primary)}
  .linkbtn:hover{color:var(--ink)}

  .btn{border:0;cursor:pointer;font-weight:650;background:var(--primary);color:var(--on-primary);border-radius:var(--r-sm);padding:11px 20px}
  .btn:hover{background:var(--primary-dk)}
  .btn[disabled]{opacity:.5;cursor:default}
  .btn.ghost{background:transparent;color:var(--ink-2);border:1px solid var(--line)}
  .btn.sm{padding:7px 13px;font-size:13px}
  .btn.wide{width:100%}

  .shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh;background:var(--ground)}
  .rail{border-right:1px solid var(--line);background:var(--page);display:flex;flex-direction:column;padding:20px 13px;gap:22px}
  .brand{display:flex;align-items:center;gap:11px;padding:0 8px}
  .brand img{width:30px;height:30px;border-radius:8px}
  .brand .word{font-family:var(--serif);font-size:18px;letter-spacing:3.5px}
  .nav{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:var(--r-sm);color:var(--ink-2);font-weight:500;cursor:pointer;background:none;border:0;width:100%;text-align:left}
  .nav svg{width:17px;height:17px;flex:none;opacity:.85}
  .nav:hover{background:var(--card);color:var(--ink)}
  .nav[aria-current="page"]{background:var(--card);color:var(--ink);font-weight:650;box-shadow:inset 2px 0 0 var(--primary)}
  .eyebrow{font-size:10.5px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink-3);padding:0 10px 7px}
  .ask{margin-top:auto;text-align:left;width:100%;cursor:pointer;border:0;border-radius:var(--r-md);
    padding:12px 14px;background:linear-gradient(150deg,var(--teal),var(--primary));color:#fff}
  .ask strong{display:block;font-size:13.5px}
  .ask span{display:block;font-size:11.5px;opacity:.85}
  .who{display:flex;align-items:center;gap:10px;padding:12px 8px 0;border-top:1px solid var(--line)}
  .avatar{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:11.5px;font-weight:700;background:var(--raised);color:var(--ink-2);font-family:var(--round)}
  .who .nm{font-size:13px;font-weight:600;line-height:1.25;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .who .rl{font-size:11.5px;color:var(--ink-3)}

  .top{display:flex;align-items:center;gap:16px;padding:0 26px;height:64px;border-bottom:1px solid var(--line);background:var(--ground);position:sticky;top:0;z-index:5}
  .top h1{font-size:16px;font-weight:650}
  .chips{margin-left:auto;display:flex;gap:8px}
  .chip{display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600}
  .chip .lab{color:var(--ink-3);font-weight:500}
  .chip .v{font-family:var(--round);font-variant-numeric:tabular-nums}

  .content{padding:26px;display:flex;flex-direction:column;gap:22px}
  .greet h2{font-size:24px;font-weight:640;letter-spacing:-.3px}
  .greet p{margin:3px 0 0;color:var(--ink-3);font-size:13.5px}
  .cols{display:grid;grid-template-columns:minmax(0,2.15fr) minmax(0,1fr);gap:22px;align-items:start}
  .stack{display:flex;flex-direction:column;gap:22px;min-width:0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow)}
  .card>header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .card h3{font-size:14.5px;font-weight:650}
  .card header .meta{margin-left:auto;font-size:12.5px;color:var(--ink-3);font-family:var(--round)}
  .hint{color:var(--ink-3);font-size:12.5px}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;box-shadow:var(--shadow)}
  .stat .k{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-3)}
  .stat .v{font-family:var(--round);font-weight:600;font-size:28px;line-height:1.15;font-variant-numeric:tabular-nums}
  .stat .v small{font-size:12.5px;color:var(--ink-3);font-weight:600;margin-left:4px}

  .planhead{padding:20px;border-radius:var(--r-lg);background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
  .planhead .phrow{display:flex}
  .planhead .phstat{flex:1;text-align:center;position:relative}
  .planhead .phstat+.phstat::before{content:'';position:absolute;left:0;top:6px;bottom:6px;width:1px;background:var(--line)}
  .planhead .phn{font-family:var(--round);font-weight:600;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
  .planhead .phsub2{font-size:15px;color:var(--ink-3)}
  .planhead .phk{font-size:10.5px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:var(--ink-3);margin-top:6px}

  .trow{border-top:1px solid var(--line)}
  .trow:first-child{border-top:0}
  .thead2{display:flex;align-items:center;gap:11px;padding:12px 0;cursor:pointer;min-width:0}
  .chev{width:15px;height:15px;flex:none;color:var(--ink-3);transition:transform .18s}
  .trow.open .chev{transform:rotate(90deg)}
  .tbody2{padding:0 0 14px 26px;display:none}
  .trow.open .tbody2{display:block}
  .tdesc{color:var(--ink-2);font-size:13px;line-height:1.6;white-space:pre-wrap;margin:0 0 12px}
  .tick{width:20px;height:20px;border-radius:50%;flex:none;border:1.5px solid var(--line);display:grid;place-items:center}
  .tick.on{background:var(--good);border-color:var(--good)}
  .ttl{font-weight:600;font-size:13.5px}
  .ttl.done{color:var(--ink-3);text-decoration:line-through}
  .tsub{font-size:12px;color:var(--ink-3)}
  .dur{font-size:12.5px;color:var(--ink-2);font-family:var(--round);font-weight:600;flex:none}
  .pill{font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:3px 8px;border-radius:999px;flex:none}
  /* Attendance, same colour language as the teacher's calendar. */
  .pill.att-present{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
  .pill.att-late{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
  .pill.att-absent{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
  .pill.set{background:color-mix(in srgb,var(--teal) 20%,transparent);color:var(--teal)}
  .showmore{width:100%;background:none;border:0;border-top:1px solid var(--line);color:var(--ink-3);font-size:12.5px;font-weight:650;padding:12px 0 0;cursor:pointer}

  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40}
  .modal{position:fixed;z-index:41;top:50%;left:50%;transform:translate(-50%,-50%);width:min(460px,94vw);background:var(--ground);border:1px solid var(--line);border-radius:22px;padding:26px;text-align:center;box-shadow:var(--shadow)}
  .modal .lab{font-size:11px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:var(--ink-3)}
  .clock{font-family:var(--round);font-weight:600;font-size:44px;font-variant-numeric:tabular-nums;line-height:1}
  .x{background:none;border:0;color:var(--ink-3);cursor:pointer;font-size:20px;padding:4px 8px}

  .celeb-root{position:fixed;inset:0;display:grid;place-items:center;z-index:9999;pointer-events:none}
  .celeb-card{display:flex;flex-direction:column;align-items:center;background:var(--raised);border-radius:28px;padding:26px 34px;border:1px solid color-mix(in srgb,var(--primary) 18%,transparent);box-shadow:0 12px 24px rgba(0,0,0,.35);animation:cIn .42s cubic-bezier(.2,1.5,.4,1) both}
  .celeb-root.out .celeb-card{animation:cOut .24s ease forwards}
  @keyframes cIn{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
  @keyframes cOut{to{opacity:0;transform:scale(.92)}}
  .celeb-ring{position:absolute;width:76px;height:76px;border-radius:38px;background:var(--teal);animation:cRing .72s cubic-bezier(.22,.61,.36,1) forwards}
  @keyframes cRing{0%{opacity:.5;transform:scale(.4)}60%{opacity:.12}100%{opacity:0;transform:scale(2.4)}}
  .celeb-bw{position:relative;display:grid;place-items:center;margin-bottom:14px}
  .celeb-badge{width:76px;height:76px;border-radius:38px;display:grid;place-items:center;font-size:38px;background:color-mix(in srgb,var(--teal) 13%,transparent);border:1px solid color-mix(in srgb,var(--teal) 33%,transparent)}
  .celeb-title{font-size:19px;font-weight:800;margin-bottom:4px}
  .celeb-pts{color:var(--teal);font-family:var(--round);font-size:40px;font-weight:800;line-height:1.1}
  .celeb-sub{color:var(--ink-3);font-size:13px;margin-top:2px}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:11px 22px;box-shadow:var(--shadow);opacity:0;transition:.22s;z-index:60;font-size:13.5px;font-weight:600}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .rows{display:flex;flex-direction:column}
  .prow{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line)}
  .prow:first-child{border-top:0;padding-top:0}
  .prow .pl{flex:1;min-width:0}
  .prow .pt{font-weight:600;font-size:13.5px}
  .prow .ps{font-size:12px;color:var(--ink-3)}
  a.btn{text-decoration:none;display:inline-block}
  .cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
  .cal .hd{background:var(--raised);padding:9px 8px;text-align:center;font-size:11px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--ink-3)}
  .cal .hd b{display:block;font-family:var(--round);font-size:15px;color:var(--ink);letter-spacing:0}
  .cal .cell{background:var(--card);padding:9px 8px;min-height:120px;display:flex;flex-direction:column;gap:6px}
  .cal .cell.today{background:color-mix(in srgb,var(--primary) 7%,var(--card))}
  .ev{border-radius:7px;padding:7px 9px;font-size:11.5px;line-height:1.35;text-align:left;border:0;border-left:2px solid;width:100%}
  .ev b{display:block;font-weight:650} .ev .tm{font-family:var(--round);opacity:.85}
  .ev.lesson{background:color-mix(in srgb,var(--primary) 18%,transparent);color:var(--primary);border-left-color:var(--primary)}
  .ev.gig{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn);border-left-color:var(--warn);cursor:pointer}
  .ev.task{background:color-mix(in srgb,var(--teal) 18%,transparent);color:var(--teal);border-left-color:var(--teal);cursor:pointer}
  .tog{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
  .tog button{border:0;background:transparent;color:var(--ink-3);font-size:12.5px;font-weight:600;padding:5px 13px;border-radius:999px;cursor:pointer}
  .tog button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
  /* Segmented control — sized to sit level with the small buttons beside it,
     and quiet: the active segment lifts rather than filling with accent. */
  .segview{display:inline-flex;background:var(--raised);border:1px solid var(--line);
    border-radius:var(--r-sm);padding:2px;gap:2px;flex:none;align-self:center}
  .segview button{border:0;background:transparent;color:var(--ink-3);font:inherit;font-size:12.5px;
    font-weight:600;padding:6px 12px;border-radius:6px;cursor:pointer;line-height:1.2}
  .segview button:hover{color:var(--ink)}
  .segview button[aria-pressed="true"]{background:var(--card);color:var(--ink);
    box-shadow:0 1px 2px rgba(0,0,0,.25)}
  .empty{text-align:center;padding:30px 20px;color:var(--ink-3)}
  .opt{background:var(--raised);border:1px solid var(--line);border-radius:var(--r-md);padding:13px 16px;
    text-align:left;cursor:pointer;font-size:13.5px;font-weight:550;color:inherit}
  .opt:hover{border-color:var(--primary)}
  .opt.right{border-color:var(--good);color:var(--good)}
  .opt.wrong{border-color:var(--bad);color:var(--bad)}

  /* ── Games ─────────────────────────────────────────────────────────
     The setup screen every game opens on. The phone centres a big hero;
     here it sits in the normal card grid so it belongs to the web app. */
  .gmenu{display:flex;flex-direction:column;gap:18px;align-items:flex-start}
  .gmedal{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;flex:none;
    background:color-mix(in srgb,var(--primary) 15%,transparent);
    border:1.5px solid color-mix(in srgb,var(--primary) 55%,transparent);color:var(--primary)}
  .gmedal svg{width:26px;height:26px}
  .gmenu h2{font-size:21px;font-weight:640;letter-spacing:-.2px}
  .gmenu>p{margin:-10px 0 0;color:var(--ink-2);font-size:13.5px;max-width:52ch}
  .gsetup{display:flex;flex-direction:column;gap:18px;width:100%}
  .gchips{display:flex;gap:8px;flex-wrap:wrap}
  .gchip{background:var(--raised);border:1px solid var(--line);border-radius:999px;padding:8px 16px;
    font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer}
  .gchip:hover{border-color:var(--primary);color:var(--ink)}
  .gchip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
  .gscore{display:flex;align-items:baseline;gap:8px;font-size:15px;color:var(--ink-3)}
  .gscore .fig{font-size:44px;line-height:1;color:var(--ink)}
  .gstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:14px;width:100%;
    border-top:1px solid var(--line);padding-top:16px}
  .gstats .k{font-size:10.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-3)}
  .gstats .v{font-size:19px;margin-top:2px}

  /* The tap pad. It has to be big, obviously hittable, and give feedback
     without a re-render — the ring is animated straight off rAF. */
  .rhpad{position:relative;width:100%;min-height:290px;border:1px dashed var(--line);
    background:var(--raised);border-radius:var(--r-lg);cursor:pointer;display:grid;
    place-items:center;gap:0;user-select:none;-webkit-user-select:none;touch-action:manipulation}
  .rhpad:active{border-color:var(--primary)}
  .rhring{position:absolute;width:170px;height:170px;border-radius:50%;
    border:2px solid color-mix(in srgb,var(--primary) 70%,transparent);
    background:color-mix(in srgb,var(--primary) 10%,transparent);will-change:transform,opacity}
  .rhfeed{position:relative;font-family:var(--round);font-weight:650;font-size:27px;color:var(--ink-2)}
  .rhhint{position:absolute;bottom:16px;font-size:12px;color:var(--ink-3)}
  @media (prefers-reduced-motion:reduce){.rhring{transition:none!important}}
  .pill{font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:3px 8px;border-radius:999px}
  .pill.set{background:color-mix(in srgb,var(--teal) 20%,transparent);color:var(--teal)}
  .pill.warn{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn)}
  .msg{display:grid;grid-template-columns:270px minmax(0,1fr);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--card);box-shadow:var(--shadow);height:600px}
  .convs{border-right:1px solid var(--line);overflow-y:auto;background:var(--page)}
  .conv{display:flex;gap:11px;padding:13px 14px;border:0;border-bottom:1px solid var(--line);cursor:pointer;width:100%;text-align:left;background:none;color:inherit;align-items:center}
  .conv:hover{background:var(--card)}
  .conv[aria-selected="true"]{background:var(--card);box-shadow:inset 2px 0 0 var(--primary)}
  .conv .cn{font-size:13.5px;font-weight:650;display:block}
  .conv .cp{font-size:12px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;max-width:170px}
  .thread{display:flex;flex-direction:column;min-width:0}
  .thead{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px}
  .thead .tn{font-weight:650;font-size:14px} .thead .ts{font-size:12px;color:var(--ink-3)}
  .bubbles{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:11px}
  .bub{max-width:74%;padding:10px 14px;border-radius:16px;font-size:13.5px;line-height:1.5}
  .bub.them{background:var(--raised);border-bottom-left-radius:5px;align-self:flex-start}
  .bub.me{background:var(--primary);color:var(--on-primary);border-bottom-right-radius:5px;align-self:flex-end}
  .composer{border-top:1px solid var(--line);padding:12px 14px;display:flex;gap:10px;align-items:center}
  .composer input{flex:1;background:var(--raised);border:1px solid var(--line);border-radius:999px;padding:9px 15px}

  @keyframes sp{to{transform:rotate(360deg)}}
  /* Draggable: touch-action none so a finger drag moves the dock instead of
     scrolling the page behind it. */
  .metro{position:fixed;right:22px;bottom:22px;z-index:30;display:flex;align-items:center;gap:12px;
    cursor:grab;touch-action:none;user-select:none;
    background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 14px 9px 12px;box-shadow:var(--shadow)}
  .metro.dragging{cursor:grabbing;box-shadow:0 10px 32px rgba(0,0,0,.45)}
  .metro{display:none}
  .metro.ready{display:flex}

<body>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut, deleteUser }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFunctions, httpsCallable } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js';
import { CATEGORIES as THEORY_CATEGORIES, makeTheoryRound } from '/shared/theory.js';
import { getFirestore, doc, getDoc, updateDoc, setDoc, increment, deleteDoc, collection, getDocs,
  addDoc, serverTimestamp, onSnapshot, query, orderBy, limit, where, arrayUnion }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const app = initializeApp({
  apiKey: 'AIzaSyAP7411t8bn81DoCtJI7ajy30UGaPdaRNU',
  authDomain: 'prova-583c9.firebaseapp.com',
  projectId: 'prova-583c9',
});
const auth = getAuth(app), db = getFirestore(app), fns = getFunctions(app);
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const toast = (m) => { const t = $('#toast'); t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2400); };

// ── The app's own rules, copied verbatim so the numbers match ─────────────
// src/lib/score.js
const POINTS_PER_MIN = 2, TASK_BASE = 5, TEACHER_TASK_MULTIPLIER = 3;
const TASK_DIFFICULTY = { warmup:1.0, theory:1.1, ear_training:1.2, repertoire:1.2, technique:1.3, improvisation:1.4 };
const taskPoints = (s = {}) => Math.round((s.duration || 0) * POINTS_PER_MIN * (TASK_DIFFICULTY[s.category] || 1.1)) + TASK_BASE;
const teacherTaskPoints = (sec) => Math.round((Math.max(0, sec) / 60) * POINTS_PER_MIN * TEACHER_TASK_MULTIPLIER);
// src/lib/displayName.js
const displayName = (u) => (u?.username?.trim()) || (u?.name?.trim()) || (u?.email ? u.email.split('@')[0] : 'there');
const initials = (n) => n.split(/\s+/).slice(0,2).map(w => w[0]).join('').toUpperCase();
// src/lib/practiceLog.js uses a UTC date key; sessionProgress uses toDateString()
const dayKey = () => new Date().toISOString().split('T')[0];
const todayKey = () => new Date().toDateString();
const DAYS = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
const TODAY_NAME = DAYS[new Date().getDay()];

let me = null, uid = null, sessions = [], screen = 'today';
// ?game=<id> opens one game on its own. It is how a teacher reaches the games
// from Studio, and it works for any account — nothing here is role-gated.
const GAME_IDS = ['ear', 'fret', 'rhythm', 'theory'];
const GAME_PARAM = (() => {
  const g = new URLSearchParams(location.search).get('game');
  return GAME_IDS.includes(g) ? g : null;
})();

// ── auth ─────────────────────────────────────────────────────────────────
// Welcome → sign in, or Welcome → pick a role → sign up. Straight to a login
// box was a shortcut; the app asks who you are first, so this does too.
const panes = ['welcome','signin','signup'];
const show = (id) => panes.forEach(p => $('#' + p).classList.toggle('hidden', p !== id));
let SIGNUP_ROLE = 'student', SIGNUP_INST = 'Guitar';
document.querySelectorAll('[data-role]').forEach(b => b.onclick = () => {
  SIGNUP_ROLE = b.getAttribute('data-role');
  $('#suRole').textContent = SIGNUP_ROLE === 'teacher' ? 'teacher' : SIGNUP_ROLE === 'personal' ? 'personal' : 'student';
  $('#suInstWrap').classList.toggle('hidden', SIGNUP_ROLE === 'teacher');
  show('signup');
});
$('#toLogin').onclick = () => show('signin');
document.querySelectorAll('[data-back]').forEach(b => b.onclick = () => show('welcome'));
document.querySelectorAll('[data-inst]').forEach(b => b.onclick = () => {
  SIGNUP_INST = b.getAttribute('data-inst');
  document.querySelectorAll('[data-inst]').forEach(x => x.setAttribute('style',
    'flex:1' + (x === b ? ';border-color:var(--primary);color:var(--ink)' : '')));
});

$('#loginBtn').onclick = async () => {
  $('#loginErr').textContent = ''; $('#loginBtn').disabled = true;
  try { await signInWithEmailAndPassword(auth, $('#em').value.trim(), $('#pw').value); }
  catch { $('#loginErr').textContent = 'Sign-in failed — check your email and password.'; }
  finally { $('#loginBtn').disabled = false; }
};
$('#pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#loginBtn').click(); });

$('#suBtn').onclick = async () => {
  const nm = $('#suName').value.trim(), em = $('#suEm').value.trim(), pw = $('#suPw').value;
  $('#suErr').textContent = '';
  if (!nm || !em || pw.length < 6) { $('#suErr').textContent = 'Name, email, and a password of at least 6 characters.'; return; }
  $('#suBtn').disabled = true;
  try {
    const cred = await createUserWithEmailAndPassword(auth, em, pw);
    // The same fields the app's onboarding writes first — the rest (level,
    // goals, the generated plan) is finished on the phone.
    await setDoc(doc(db, 'users', cred.user.uid), {
      email: em, username: nm, role: SIGNUP_ROLE, createdAt: new Date().toISOString(),
      onboardingComplete: false, streak: 0, provaScore: 0, totalMinutes: 0,
      ...(SIGNUP_ROLE === 'teacher' ? {} : { instrument: SIGNUP_INST }),
    }, { merge: true });
  } catch (e) {
    $('#suErr').textContent = /email-already-in-use/.test(e?.code || '')
      ? 'That email already has an account — log in instead.'
      : /weak-password/.test(e?.code || '') ? 'Pick a longer password.'
      : 'Could not create the account. Try again.';
    $('#suBtn').disabled = false;
  }
};
$('#signout').onclick = confirmSignOut;
function confirmSignOut() {
  $('#overlays').innerHTML = `<div class="scrim" data-close></div><div class="modal">
    <h3 style="font-size:18px;margin-bottom:10px">Sign out?</h3>
    <p class="hint" style="margin:0">You'll need your email and password to get back in.</p>
    <div style="display:flex;gap:10px;margin-top:22px">
      <button class="btn ghost" data-close style="flex:1">Cancel</button>
      <button class="btn" id="soYes" style="flex:1">Sign out</button></div></div>`;
  $('#soYes').onclick = async () => {
    $('#overlays').innerHTML = '';
    await signOut(auth);
    try { Object.keys(localStorage).filter(k => k.startsWith('prova:')).forEach(k => localStorage.removeItem(k)); } catch {}
    ['#em', '#pw', '#suEm', '#suPw', '#suName'].forEach(sel => { const el = $(sel); if (el) el.value = ''; });
  };
}

// Nothing is shown until Firebase has resolved the session — otherwise a
// signed-in visitor sees the welcome screen flash before their account
// loads. Same reason the app holds `loading` in useAuth (PR #67).
onAuthStateChanged(auth, async (user) => {
  if (!user) {
    $('#splash').classList.add('hidden');
    $('#login').classList.remove('hidden'); $('#app').classList.add('hidden');
    document.getElementById('metro').classList.remove('ready');
    if (metroInt) { METRO.playing = false; metroStop(); }
    show('welcome');
    return;
  }
  uid = user.uid;
  // Role decides the whole experience, exactly as it does in the app — a
  // teacher signing in here was getting the student screen with an empty
  // plan. Studio is the teacher surface.
  try {
    const snap = await getDoc(doc(db, 'users', user.uid));
    // Teachers get the four games too — the phone puts them under the teacher
    // Resources tab. Rather than build the whole games engine a second time in
    // Studio, Studio links here with ?game=, and that one case skips the
    // redirect and opens the game on its own.
    if ((snap.data() || {}).role === 'teacher' && !GAME_PARAM) {
      $('#splash').innerHTML = `<div style="text-align:center">
        <img src="/img/icon-192.png" alt="" style="width:64px;height:64px;border-radius:17px">
        <div style="font-family:var(--serif);font-size:20px;letter-spacing:3.5px;margin-top:14px">PROVA</div>
        <div style="color:var(--ink-3);font-size:13px;margin-top:12px">Teacher account — opening Studio…</div></div>`;
      location.replace('/studio/');
      return;
    }
  } catch { /* fall through to the student view */ }
  loadPrior();
  try { await load(); await loadHistory(); }
  catch { $('#splash').classList.add('hidden'); $('#login').classList.remove('hidden'); show('welcome'); return; }
  $('#splash').classList.add('hidden');
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  renderNav();
  go(GAME_PARAM || 'today');
  document.getElementById('metro').classList.add('ready');
});
// If Firebase never answers (offline, blocked), don't sit on the splash.
setTimeout(() => {
  if (!$('#splash').classList.contains('hidden') && !auth.currentUser) {
    $('#splash').classList.add('hidden'); $('#login').classList.remove('hidden'); show('welcome');
  }
}, 8000);

async function load() {
  me = (await getDoc(doc(db, 'users', uid))).data() || {};
  sessions = me.practicePlan?.weeklyPlan?.[TODAY_NAME]?.sessions || [];
  const nm = displayName(me);
  $('#meNm').textContent = nm; $('#meAv').textContent = initials(nm) || '?';
  $('#meRl').textContent = [me.instrument, me.level].filter(Boolean).join(' · ');
  $('#chipStreak').textContent = me.streak || 0;
  $('#chipScore').textContent = (me.provaScore || 0).toLocaleString();
  const th = me.theme || {};
  applyTheme(th.mode || 'sky', th.accent || 'blue');
}
const doneIds = () => (me.sessionProgress?.date === todayKey() ? (me.sessionProgress.ids || []) : []);
const assigned = () => Array.isArray(me.assignedTasks) ? me.assignedTasks : [];

// ── nav ──────────────────────────────────────────────────────────────────
const ICON = { home:'<path d="M3 9l9-6 9 6v10a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>' };
const svg = (p) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">${p}</svg>`;
const NAV = [
  { g: 'Practice' },
  { id: 'today',    t: 'Today',    i: '<path d="M3 9l9-6 9 6v10a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>' },
  { id: 'practice', t: 'Practice', i: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>' },
  { id: 'songs',    t: 'Songs',    i: '<path d="M9 18V5l10-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/>' },
  { id: 'schedule', t: 'Schedule', i: '<path d="M8 3v4M16 3v4M4 8h16M5 5h14v15H5z"/>' },
  { id: 'calendar', t: 'Calendar', i: '<path d="M8 3v4M16 3v4M4 9h16M5 5h14v15H5z"/><circle cx="12" cy="14" r="1.6"/>' },
  { id: 'lessonnotes', t: 'Lesson notes', i: '<path d="M7 3h10a2 2 0 012 2v14a2 2 0 01-2 2H7a2 2 0 01-2-2V5a2 2 0 012-2z"/><path d="M9 8h6M9 12h6M9 16h3"/>' },
  { g: 'Track' },
  { id: 'progress', t: 'Progress', i: '<path d="M4 19V9m5 10V5m5 14v-7m5 7V8"/>' },
  { id: 'leaderboard', t: 'Leaderboard', i: '<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 01-10 0z"/><path d="M17 5h3v2a3 3 0 01-3 3M7 5H4v2a3 3 0 003 3"/>' },
  { id: 'skilltree', t: 'Skill tree', i: '<path d="M12 3v7M12 14v7M6 10h12M6 10v4M18 10v4"/>' },
  { id: 'journal',  t: 'Journal',  i: '<path d="M4 20h4L19 9a2.8 2.8 0 10-4-4L4 16z"/>' },
  { g: 'Studio' },
  { id: 'messages', t: 'Messages', i: '<path d="M21 12a8 8 0 01-8 8H4l2-3a8 8 0 1115-5z"/>' },
  { id: 'notifications', t: 'Notifications', i: '<path d="M6 9a6 6 0 1112 0c0 5 2 6 2 6H4s2-1 2-6"/><path d="M10 20a2 2 0 004 0"/>' },
  { id: 'profile',  t: 'Profile',  i: '<circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0114 0"/>' },
];
const TITLES = { today:'Today', practice:'Practice', songs:'Songs', schedule:'Schedule',
  progress:'Progress', journal:'Journal', profile:'Profile', messages:'Messages',
  calendar:'Calendar', lessonnotes:'Lesson notes', leaderboard:'Leaderboard', notifications:'Notifications', skilltree:'Skill tree', theory:'Theory quiz', gig:'Performance mode', chords:'Chords & scales', library:'Lesson library', ear:'Ear training', fret:'Fretboard game', rhythm:'Rhythm tapper', ask:'Ask Prova' };
const PARENT = { chords:'practice', library:'practice', ear:'practice', fret:'practice',
  ask:'practice', theory:'practice', rhythm:'practice', gig:'calendar' };
// Built lazily: PI is declared further down, so reading it at this point in
// module evaluation would throw before the app ever boots.
const gameNav = () => [
  { g: 'Practice games' },
  { id: 'ear',    t: 'Ear training',   i: PI.ear },
  { id: 'fret',   t: 'Fretboard game', i: PI.music },
  { id: 'rhythm', t: 'Rhythm tapper',  i: PI.metro },
  { id: 'theory', t: 'Theory quiz',    i: PI.layers },
];
function renderNav() {
  // Arriving with ?game= means "just the games" — a teacher has no student
  // Today or plan to show, so the student nav would only mislead.
  const items = GAME_PARAM ? gameNav() : NAV;
  $('#nav').innerHTML = items.map((x) => x.g
    ? `<div class="eyebrow">${x.g}</div>`
    : `<button class="nav" data-go="${x.id}"${x.id === screen || PARENT[screen] === x.id ? ' aria-current="page"' : ''}>${svg(x.i)}<span>${x.t}</span></button>`
  ).join('') + (GAME_PARAM
    ? `<a class="nav" href="/studio/" style="margin-top:10px;text-decoration:none">${
        svg('<path d="M15 18l-6-6 6-6"/>')}<span>Back to Studio</span></a>`
    : '');
}
$('#app').addEventListener('click', (e) => { const b = e.target.closest('[data-go]'); if (b) go(b.getAttribute('data-go')); });
// Every screen's renderer in one place. Expanding a row must repaint the
// screen you are ON — calling render() directly painted Today over whatever
// tab you were looking at.
const VIEWS = { today: render, practice: viewPractice, songs: viewSongs, schedule: viewSchedule,
  progress: viewProgress, journal: viewJournal, profile: viewProfile, messages: viewMessages,
  chords: viewChords, library: viewLibrary, ear: viewEar, fret: viewFret, ask: viewAsk,
  calendar: viewCalendar, lessonnotes: viewLessonNotes, leaderboard: viewLeaderboard, notifications: viewNotifications, rhythm: viewRhythm,
  skilltree: viewSkillTree, theory: viewTheory, gig: viewGig };
const rerender = () => (VIEWS[screen] || render)();
function go(id) {
  // Leaving a game abandons the round, exactly as the phone does on blur.
  // Without this the rhythm click track keeps playing over the next screen.
  if (screen === 'rhythm' && id !== 'rhythm') abandonRhythm();
  screen = id;
  $('#pageTitle').textContent = TITLES[id] || '';
  renderNav();
  (VIEWS[id] || render)();
  window.scrollTo({ top: 0 });
}

// ── celebration, ported from src/components/Celebration.js ───────────────
const PRAISE = ['Nice work!','Boom!','Great job!','Love it!','Keep going!','On fire!'];
let celebN = 0;
function celebrate({ points = 0, title, subtitle, emoji = '🎸' } = {}) {
  const pts = Math.max(0, Math.round(points));
  const host = document.createElement('div');
  host.className = 'celeb-root';
  host.innerHTML = `<div class="celeb-card"><div class="celeb-bw"><div class="celeb-ring"></div>
    <div class="celeb-badge">${emoji}</div></div>
    <div class="celeb-title">${esc(title || PRAISE[celebN++ % PRAISE.length])}</div>
    ${pts ? `<div class="celeb-pts">+<span class="celeb-n">0</span><span style="color:var(--ink-2);font-size:16px"> pts</span></div>` : ''}
    ${subtitle ? `<div class="celeb-sub">${esc(subtitle)}</div>` : ''}</div>`;
  document.body.appendChild(host);
  if (pts) {
    const n = host.querySelector('.celeb-n'), t0 = performance.now() + 140;
    const run = () => { const e = performance.now() - t0;
      if (e < 0) return requestAnimationFrame(run);
      const k = Math.min(1, e / 600);
      n.textContent = Math.round((1 - (1 - k) ** 2) * pts);
      if (k < 1) requestAnimationFrame(run); };
    requestAnimationFrame(run);
    setTimeout(() => { if (n) n.textContent = pts; }, 780);
  }
  setTimeout(() => { host.classList.add('out'); setTimeout(() => host.remove(), 260); }, pts ? 1550 : 1150);
}

const OPEN = {}; const SHOWALL = {};
function rows(list, kind, limit) {
  const shown = SHOWALL[kind] ? list : list.slice(0, limit);

document.addEventListener('click', (e) => {
  if (e.target.closest('#overlays')) return;
  let t;
  if ((t = e.target.closest('[data-open]'))) {
    const y = window.scrollY, k = t.getAttribute('data-open');
    OPEN[k] = !OPEN[k]; rerender(); window.scrollTo(0, y); return;
  }
  if ((t = e.target.closest('[data-showall]'))) {
    const y = window.scrollY, k = t.getAttribute('data-showall');
    SHOWALL[k] = !SHOWALL[k]; rerender(); window.scrollTo(0, y); return;
  }
  if ((t = e.target.closest('[data-play]'))) {
    const v = t.getAttribute('data-play');
    if (v === 'next') {
      const last = recallLast();                    // resume exactly where they stopped
      if (last) return openPlayer(last.kind, last.i);
      const q = queue();
      if (!q.length) { toast('Everything is done for today'); return; }
      openPlayer(q[0].kind, q[0].i);
    } else { const [kind, i] = v.split(':'); openPlayer(kind, +i); }
  }
});

inger shapes), 4 down-strums each at 80 BPM. Palm-mute between shifts.","y":"power chord exercise beginner guitar"},{"x":"Palm-muting control: chug the low E with the side of your strumming palm, then lift for an open ring. 2 min.","y":"palm muting power chords lesson"}]},{"t":"7th chords","c":"Chords","l":"Intermediate","i":"Both","s":"Four-note chords (maj7, m7, dom7) that add colour and drive blues, jazz and funk.","k":[{"x":"Compare A7, Amaj7, Am7 back to back — hear how the 7th changes the mood. 4 strums each.","y":"major 7 minor 7 dominant 7 chords explained"},{"x":"Play a 12-bar blues in A using A7, D7, E7. Keep steady quarter-note strums.","y":"12 bar blues A7 D7 E7 rhythm guitar"}]},{"t":"Minor pentatonic scale","c":"Scales","l":"Novice","i":"Both","s":"The five-note scale behind most rock and blues solos. Box 1 is the launchpad.","k":[{"x":"A minor pentatonic box 1 at the 5th fret. Ascend and descend with strict alternate picking at 70 BPM, no buzzing.","y":"a minor pentatonic box 1 slow alternate picking"},{"x":"Once clean, push to 90 BPM. Then noodle freely over a backing track in Am — make it musical, not just up-and-down.","y":"Am backing track minor pentatonic jam"}]},{"t":"Major scale","c":"Scales","l":"Intermediate","i":"Both","s":"The parent scale of Western music — learn it and the modes/keys open up.","k":[{"x":"C major scale, one position (open or 5th fret). Play it ascending/descending saying the note names aloud.","y":"major scale guitar one position note names"},{"x":"Practice the same shape in 3 keys by sliding it up the neck (G, A, C). 80 BPM, even notes.","y":"movable major scale shape guitar"}]},{"t":"Modes (Dorian, Mixolydian…)","c":"Scales","l":"Advanced","i":"Both","s":"Re-centring the major scale on different notes for distinct flavours.","k":[{"x":"D Dorian: play C major but treat D as home. Vamp on a Dm7 and target the natural 6th (B) to hear the colour.","y":"dorian mode explained guitar"},{"x":"G Mixolydian over a G7 vamp — emphasise the flat 7 (F natural). The classic dominant/rock sound.","y":"mixolydian mode lick guitar"}]},{"t":"Alternate picking","c":"Technique","l":"Intermediate","i":"Guitar","s":"Strict down-up-down-up picking — the foundation of clean speed.","k":[{"x":"Single string, 4 notes per fret (1-2-3-4) on the low E. Strict down-up at 80 BPM with a metronome. 4 min.","y":"alternate picking exercise beginner 1234"},{"x":"Only raise the BPM when it is perfectly clean. Watch the pick travels the same tiny distance each stroke.","y":"alternate picking technique tips economy of motion"}]},{"t":"Legato (hammer-ons & pull-offs)","c":"Technique","l":"Advanced","i":"Guitar","s":"Smooth, picked-once phrases using fretting-hand strength.","k":[{"x":"Pick once, then hammer 5-7-9 and pull off 9-7-5 on the G string. Even volume across all notes. 70 BPM.","y":"legato exercise hammer on pull off guitar"},{"x":"Trill drill: hammer/pull between two notes (e.g. 5↔7) for 30s per finger pair to build endurance.","y":"trill exercise finger strength guitar"}]},{"t":"Fingerstyle / fingerpicking","c":"Technique","l":"Intermediate","i":"Both","s":"Plucking strings with individual fingers for arpeggios and independent bass lines.","k":[{"x":"Thumb plays the root on each beat; index/middle/ring pluck strings 3-2-1 in a steady pattern over an Am chord.","y":"fingerpicking pattern beginner PIMA"},{"x":"Travis picking: alternating thumb bass under a melody. Start dead slow over C and G.","y":"travis picking lesson slow"}]},{"t":"Slap & pop","c":"Technique","l":"Advanced","i":"Bass","s":"Percussive funk technique — thumb slaps the low strings, fingers pop the high ones.","k":[{"x":"Thumb-slap the open E on beats 1 & 3, pop the open G on 2 & 4. Keep it loose from the wrist. 70 BPM.","y":"slap bass for beginners thumb pop"},{"x":"Add a fretted octave: slap root, pop the octave. Mute unused strings with your fretting hand.","y":"slap bass octave exercise funk"}]},{"t":"Finger independence & warm-ups","c":"Technique","l":"Beginner","i":"Both","s":"Dexterity drills that wake up the fretting hand and prevent injury.","k":[{"x":"Spider walk: frets 1-2-3-4 (index-middle-ring-pinky), one note per click at 60 BPM, across all strings and back.","y":"spider walk warm up exercise"},{"x":"Keep fingers hovering close to the strings — lifting them high is the biggest hidden speed killer.","y":"finger economy of motion guitar"}]},{"t":"Notes on the fretboard","c":"Theory","l":"Novice","i":"Both","s":"Knowing where every note is — the map that makes everything else easier.","k":[{"x":"Learn the natural notes on the low E and A strings first. Name them out loud up to the 12th fret.","y":"memorize fretboard notes E and A string"},{"x":"Octave shapes: from any note on the E string, the same note is 2 frets up / 2 strings over. Use it to find notes fast.","y":"octave shapes fretboard navigation"}]},{"t":"Intervals","c":"Theory","l":"Intermediate","i":"Both","s":"The distance between two notes — the building blocks of chords and melody.","k":[{"x":"On one string, play a root then a note 2 frets up (major 2nd), 4 (major 3rd), 5 (perfect 4th), 7 (perfect 5th). Hear each.","y":"intervals explained guitar ear"},{"x":"Find the same intervals across two strings (shapes). Major 3rd and perfect 5th first — they build major chords.","y":"interval shapes guitar chords"}]},{"t":"How chords are built","c":"Theory","l":"Intermediate","i":"Both","s":"Triads = root + 3rd + 5th. Understand this and you can build any chord.","k":[{"x":"Build a C major triad: C (root), E (major 3rd), G (5th). Find those three notes anywhere and you have C.","y":"how chords are built triads"},{"x":"Make it minor by flattening the 3rd (E→Eb). Play C then Cm and hear the one-note difference.","y":"major vs minor triad theory"}]},{"t":"Keys & chord progressions","c":"Theory","l":"Advanced","i":"Both","s":"Why certain chords sound good together — the numbers (I–IV–V) behind songs.","k":[{"x":"In the key of G, the chords are G(I) Am(ii) Bm(iii) C(IV) D(V) Em(vi). Play a I–IV–V–I: G–C–D–G.","y":"I IV V chord progression explained"},{"x":"Play the I–V–vi–IV pop progression in G (G–D–Em–C) — you’ll recognise it from a hundred songs.","y":"four chord song progression G D Em C"}]},{"t":"Strumming patterns","c":"Rhythm","l":"Beginner","i":"Guitar","s":"Turning chords into a groove with consistent down/up motion.","k":[{"x":"Keep your strumming hand always moving down-up like a pendulum; only touch the strings when needed. D-DU-UDU.","y":"strumming pattern DDU UDU beginner"},{"x":"Count \"1-and-2-and-3-and-4-and\" out loud while strumming one chord. Timing problems vanish once you vocalise.","y":"count strumming rhythm out loud"}]},{"t":"Timing & subdivisions","c":"Rhythm","l":"Intermediate","i":"Both","s":"Playing exactly in time and feeling the beat split into halves/quarters.","k":[{"x":"With a metronome at 70 BPM, play one note on each click (quarters), then 2 per click (8ths), then 4 (16ths). Stay locked.","y":"subdivision exercise metronome quarter eighth sixteenth"},{"x":"Put the click on beats 2 & 4 only (like a snare). Keep your groove steady against it.","y":"metronome on 2 and 4 practice"}]},{"t":"Locking with the drums (bass)","c":"Rhythm","l":"Intermediate","i":"Bass","s":"The bass job: lock the root notes to the kick drum and hold the pocket.","k":[{"x":"Play root notes on each beat, matching a simple kick pattern. Keep note lengths even — consistency over flash.","y":"bass locking with kick drum groove"},{"x":"Add a walk-up to the next chord on beat 4 (passing note). Keep it smooth and in time.","y":"walking bass passing notes beginner"}]},{"t":"Recognising intervals by ear","c":"Ear Training","l":"Intermediate","i":"Both","s":"Hearing the distance between notes so you can play what you imagine.","k":[{"x":"Use song hooks: a perfect 4th = \"Here Comes the Bride\"; a perfect 5th = \"Star Wars\". Hum then find them on the neck.","y":"interval ear training song references"},{"x":"Play a random note, then sing a major 3rd above it, then check on the fretboard. 5 minutes daily.","y":"ear training intervals practice guitar"}]},{"t":"Figuring out songs by ear","c":"Ear Training","l":"Advanced","i":"Both","s":"Working out riffs and chords without tabs — the most useful real-world skill.","k":[{"x":"Pick a simple riff. Find the first note by trial, then move by ear (up/down, big/small jumps). Loop a few seconds at a time.","y":"how to learn songs by ear beginner"},{"x":"For chords, find the bass note first (it’s usually the root), then test major vs minor over it.","y":"find chords by ear bass note root"}]},{"t":"Great first songs (guitar)","c":"Songs","l":"Beginner","i":"Guitar","s":"Real songs you can play with just a few open chords or a simple riff.","k":[{"x":"Horse With No Name (America): two chords. Knockin’ on Heaven’s Door (Dylan): G–D–Am–C.","y":"easy 2 chord songs guitar"},{"x":"Smoke on the Water riff (Deep Purple): four notes on two strings — a first riff win.","y":"smoke on the water riff lesson"}]},{"t":"Great first songs (bass)","c":"Songs","l":"Beginner","i":"Bass","s":"Iconic bass lines that are simple enough to nail early.","k":[{"x":"Seven Nation Army (White Stripes): one finger, unforgettable. Another One Bites the Dust (Queen): the groove of all grooves.","y":"easy bass songs for beginners"},{"x":"With or Without You (U2): four steady notes that teach you to lock the pocket.","y":"with or without you bass lesson"}]},{"t":"Amp & EQ basics","c":"Gear & Tone","l":"Novice","i":"Both","s":"What the knobs do, so you can dial a usable sound fast.","k":[{"x":"Start every knob at 12 o’clock. Gain = grit/distortion. Bass/Mid/Treble shape the tone — sweep each to hear its job.","y":"guitar amp eq settings explained beginner"},{"x":"Mids are where guitar/bass live in a band mix — don’t scoop them to zero or you disappear.","y":"why mids matter guitar tone"}]},{"t":"Changing & caring for strings","c":"Gear & Tone","l":"Beginner","i":"Both","s":"Fresh strings = better tone and tuning. A core maintenance skill.","k":[{"x":"Change one string at a time to keep neck tension. Leave 2–3 winds around the post, wound downward, for tuning stability.","y":"how to restring a guitar properly"},{"x":"Stretch new strings by gently pulling them, then re-tune — repeat until they hold pitch.","y":"stretch new guitar strings stay in tune"}]},{"t":"Sweep picking arpeggios","c":"Technique","l":"Elite","i":"Guitar","s":"One fluid pick stroke across strings to rip through arpeggios at speed.","k":[{"x":"Three-string Am sweep (5th–12th frets): one continuous down-stroke up, one up-stroke down. Mute each note as you leave it. Start 50 BPM.","y":"sweep picking for beginners 3 string arpeggio"},{"x":"Once clean, extend to five-string shapes and add the rolling pinky on the top. Speed comes only after the muting is spotless.","y":"five string sweep picking exercise clean"}]},{"t":"Two-hand & 8-finger tapping","c":"Technique","l":"Elite","i":"Guitar","s":"Fretting notes with the picking hand for wide, fast intervallic runs.","k":[{"x":"Eruption-style: tap 12th fret with the picking-hand finger, pull off to fretted 5 and 8 on the B string. Even volume across all three. 70 BPM.","y":"eruption tapping lesson van halen"},{"x":"Build to 8-finger tapping: both hands tap independent patterns. Start with a simple repeating shape and a metronome.","y":"eight finger tapping exercise"}]},{"t":"Economy picking at speed","c":"Technique","l":"Elite","i":"Guitar","s":"Combining alternate and sweep motion for the most efficient fast runs.","k":[{"x":"Three-note-per-string scale runs where the string change uses a sweep (same-direction stroke), not an alternate. Frank Gambale style. 90 BPM, build up.","y":"economy picking exercise three note per string"},{"x":"Record yourself at the target tempo and listen for evenness — economy picking exposes any timing wobble.","y":"economy picking clean fast practice"}]},{"t":"Iconic shred solos","c":"Songs","l":"Elite","i":"Guitar","s":"Benchmark virtuoso solos — work them up slowly, phrase by phrase.","k":[{"x":"Tornado of Souls (Megadeth) solo: legato runs + wide bends + sweep bursts. Loop 4 bars at a time at half speed.","y":"tornado of souls solo lesson slow"},{"x":"Cliffs of Dover (Eric Johnson): hybrid picking, cascading pentatonics, pristine tone control.","y":"cliffs of dover solo lesson"},{"x":"Far Beyond the Sun (Malmsteen): neoclassical sweeps + harmonic minor runs. The sweep + tapping graduation piece.","y":"far beyond the sun lesson slow"}]},{"t":"Altered & extended jazz chords","c":"Chords","l":"Elite","i":"Guitar","s":"Rich 9/11/13 and altered dominants, voice-led through a progression.","k":[{"x":"Play a ii–V–I in C with extensions: Dm9 → G7#9 → Cmaj9. Keep common tones, move only what must move (voice leading).","y":"jazz chord voicings ii V I extensions guitar"},{"x":"Comp through a jazz blues in F using rootless 13th and altered voicings, only the top 4 strings.","y":"jazz blues comping rootless voicings guitar"}]},{"t":"Melodic minor modes & superlocrian","c":"Scales","l":"Elite","i":"Both","s":"The advanced colour palette for soloing over altered dominants and modern jazz.","k":[{"x":"Superlocrian (7th mode of melodic minor) over a G7alt: it spells every alteration (b9 #9 b5 #5). Resolve it to Cm. 80 BPM.","y":"altered scale superlocrian lesson"},{"x":"Lydian dominant (4th mode) over a static dom7#11 vamp — the bright fusion sound. Target the #11.","y":"lydian dominant scale lesson"}]},{"t":"Reharmonization & negative harmony","c":"Theory","l":"Elite","i":"Both","s":"Reshaping a chord progression with substitutions and modern harmonic theory.","k":[{"x":"Tritone subs: replace each V7 with the dom7 a tritone away (G7 → Db7). Apply across a ii–V–I and hear the chromatic bass.","y":"tritone substitution explained"},{"x":"Negative harmony: mirror a progression around the tonic axis and compare the reharmonized version to the original.","y":"negative harmony explained simply"}]},{"t":"Double-thumb & Wooten technique","c":"Technique","l":"Elite","i":"Bass","s":"Victor Wooten’s thumb-as-a-pick approach for blistering slap lines.","k":[{"x":"Double thumb: down-stroke then up-stroke with the side of the thumb, like a pick. Even 16ths on one note at 80 BPM.","y":"double thumb technique victor wooten lesson"},{"x":"Open-hammer-pluck: open string, hammer a fret, pluck the octave — combine with double thumb for a rolling groove.","y":"open hammer pluck wooten lesson"}]},{"t":"Fretless & Jaco-style fingerstyle","c":"Technique","l":"Elite","i":"Bass","s":"Singing fretless lines, precise intonation, and Jaco Pastorius vocabulary.","k":[{"x":"Intonation drill: play a melody on fretless against a drone, adjusting each note until the beating disappears. Use your ear, not fret markers.","y":"fretless bass intonation exercise"},{"x":"Learn the head to Donna Lee (Jaco) — bebop sixteenths that demand clean right-hand fingerstyle and left-hand accuracy.","y":"donna lee bass lesson jaco"}]},{"t":"Virtuoso bass benchmarks","c":"Songs","l":"Elite","i":"Bass","s":"The bass lines that separate advanced players from elite ones.","k":[{"x":"Teen Town (Weather Report / Jaco) at full speed — fast sixteenth-note lines across the whole neck. Loop a bar at a time.","y":"teen town bass lesson slow"},{"x":"YYZ (Rush) — Geddy Lee’s precise, syncopated lines. Lock it tight to a click.","y":"yyz bass lesson rush"}]},{"t":"Improvising over fast changes","c":"Ear Training","l":"Advanced","i":"Both","s":"Soloing that follows the chords, not just one scale — the jazz core skill.","k":[{"x":"Guide-tone lines: over a ii–V–I, play only the 3rds and 7ths of each chord, connecting them smoothly. This is the skeleton of every great solo.","y":"guide tones soloing jazz lesson"},{"x":"Target chord tones on the downbeats over a slow ii–V–I loop; fill the gaps with scale/chromatic approach notes.","y":"targeting chord tones improvisation"}]},{"t":"Drop D power chords & riffs","c":"Chords","l":"Novice","i":"Guitar","s":"Tune the low E down to D so a whole power chord is one barred finger.","k":[{"x":"Tune low E down to D (match it to the open D string an octave below). One finger barres frets on strings 6-5-4 for a power chord — slide it around.","y":"drop d tuning power chords lesson"},{"x":"Write a riff: chug the open D (strings 6-5-4 muted) then jump to the 3rd and 5th frets. Palm-mute for tightness.","y":"drop d riff lesson beginner"}]},{"t":"Sus2, sus4 & add9 chords","c":"Chords","l":"Intermediate","i":"Guitar","s":"Swap the 3rd for a 2nd/4th (sus) or add a 9th for shimmer.","k":[{"x":"From open D: lift/add the pinky to get Dsus2 and Dsus4, alternating back to D. Hear the tension resolve.","y":"sus2 sus4 chords guitar lesson"},{"x":"Add an open high E or B to G and C shapes for add9 colour — great for ringing acoustic parts.","y":"add9 chords acoustic guitar"}]},{"t":"Triads on the top strings","c":"Chords","l":"Intermediate","i":"Guitar","s":"Small 3-note chord shapes up the neck for clean, modern voicings.","k":[{"x":"Learn C major triad in its 3 inversions on strings 1-2-3, then slide the shape up the neck to make F, G, etc.","y":"major triads top three strings guitar"},{"x":"Comp a I-IV-V using only triads, keeping them in the same neck area (voice leading) instead of jumping shapes.","y":"triad chords comping guitar lesson"}]},{"t":"Bass double stops & chords","c":"Chords","l":"Intermediate","i":"Bass","s":"Two notes at once on bass — octaves, 5ths and tasteful chord fills.","k":[{"x":"Play octaves: root on the E string + octave on the D string, two strings apart. Mute the string between with your fretting finger.","y":"bass octaves technique lesson"},{"x":"Add a 10th (root + major 3rd an octave up) as a chord fill at the end of a phrase.","y":"bass chords double stops lesson"}]},{"t":"Open & alternate tunings","c":"Chords","l":"Advanced","i":"Guitar","s":"Retune the strings so open strings form a chord — folk, blues & slide.","k":[{"x":"Open G (D-G-D-G-B-D): strum open for a G chord, then barre any fret for instant major chords. Try a Stones-style riff.","y":"open g tuning guitar lesson"},{"x":"DADGAD: explore the droney, modal sound with one-finger shapes. A staple of Celtic and modern fingerstyle.","y":"dadgad tuning beginner lesson"}]},{"t":"Major pentatonic scale","c":"Scales","l":"Novice","i":"Both","s":"The bright, happy cousin of the minor pentatonic — country and pop leads.","k":[{"x":"G major pentatonic is the same shape as E minor pentatonic, just centred differently. Play box 1 and resolve to G, not E.","y":"major pentatonic scale guitar box 1"},{"x":"Solo over a G major backing track, landing on G, B and D. Notice the cheerful, open feel vs minor.","y":"major pentatonic backing track jam"}]},{"t":"Blues scale","c":"Scales","l":"Intermediate","i":"Both","s":"Minor pentatonic + the \"blue note\" (♭5) for that crying blues sound.","k":[{"x":"A minor pentatonic box 1 with the added ♭5 (Eb) between the 4th and 5th. Slide into and out of the blue note — don’t sit on it.","y":"blues scale guitar box 1 blue note"},{"x":"Play a call-and-response blues lick over a 12-bar in A, using bends up to the blue note.","y":"blues licks beginner guitar a"}]},{"t":"Natural minor scale","c":"Scales","l":"Novice","i":"Both","s":"The full 7-note minor scale — darker than pentatonic, the basis of minor keys.","k":[{"x":"A natural minor (A B C D E F G) in one position. Play it slowly, saying note names, and hear its melancholy character vs major.","y":"natural minor scale guitar lesson"},{"x":"Compare A minor to A major (raise the 3rd, 6th, 7th) so you feel exactly which notes make it minor.","y":"major vs minor scale difference guitar"}]},{"t":"Major & minor arpeggios","c":"Scales","l":"Intermediate","i":"Both","s":"Playing a chord one note at a time — the strongest melodic outline for solos.","k":[{"x":"Play a C major arpeggio (C-E-G) across two octaves, then A minor (A-C-E). Strict alternate picking, 70 BPM.","y":"major minor arpeggios guitar exercise"},{"x":"Over a chord progression, play the matching arpeggio for each chord instead of one scale — instantly more musical.","y":"arpeggios over chords soloing lesson"}]},{"t":"Three-note-per-string scales","c":"Scales","l":"Advanced","i":"Guitar","s":"Even 3-notes-per-string fingerings that make fast scalar runs flow.","k":[{"x":"Play the G major scale 3-notes-per-string across all six strings. The even layout suits legato and fast picking. 80 BPM, build up.","y":"three note per string scales guitar"},{"x":"Practice the seven connected positions so you can run the scale anywhere on the neck.","y":"3nps major scale positions connect"}]},{"t":"Harmonic minor scale","c":"Scales","l":"Advanced","i":"Both","s":"Natural minor with a raised 7th — exotic, neoclassical, flamenco flavour.","k":[{"x":"A harmonic minor: A B C D E F G#. The gap between F and G# is the signature exotic sound. Play it over an E7→Am.","y":"harmonic minor scale guitar lesson"},{"x":"Write a neoclassical lick emphasising the raised 7th resolving to the root.","y":"harmonic minor lick neoclassical guitar"}]},{"t":"String bending & vibrato","c":"Technique","l":"Novice","i":"Guitar","s":"The two techniques that give a lead line its voice and emotion.","k":[{"x":"Bend the G string at the 7th fret UP a full tone — check it matches the 9th fret pitch exactly. Use 2-3 fingers for support.","y":"how to bend strings in tune guitar"},{"x":"Add vibrato: bend slightly up and release repeatedly from the wrist, even and controlled. Hold one note for 4 beats with vibrato.","y":"guitar vibrato technique lesson"}]},{"t":"Slides & glissando","c":"Technique","l":"Novice","i":"Guitar","s":"Connecting notes by sliding the fretting finger — smooth and vocal.","k":[{"x":"Pick a note at the 5th fret, slide up to the 7th without re-picking. Keep even pressure so the second note rings.","y":"guitar slides technique lesson"},{"x":"Use a slide into the first note of a phrase for a vocal, expressive entrance.","y":"slide into notes guitar lead"}]},{"t":"Palm muting","c":"Technique","l":"Novice","i":"Guitar","s":"Resting the picking-hand palm on the strings for a tight, percussive chug.","k":[{"x":"Rest the edge of your palm lightly where the strings meet the bridge. Pick the low E — aim for a muted \"chug\", not a dead thud.","y":"palm muting technique guitar lesson"},{"x":"Alternate 4 palm-muted chugs with 4 open rings on a power chord, controlling exactly when the mute is on.","y":"palm muting exercise rhythm guitar"}]},{"t":"Hybrid picking","c":"Technique","l":"Advanced","i":"Guitar","s":"Pick plus middle/ring fingers together — country twang and wide intervals.","k":[{"x":"Hold the pick normally; pluck the higher string with your middle finger at the same time. Play pick-on-D + finger-on-G as pairs.","y":"hybrid picking for beginners lesson"},{"x":"Play a country \"chicken pickin\" lick using the snap of the middle finger for the pop.","y":"chicken picking country guitar lesson"}]},{"t":"String skipping","c":"Technique","l":"Advanced","i":"Guitar","s":"Jumping over strings for wide, ear-catching intervals and arpeggios.","k":[{"x":"Play an A minor arpeggio skipping the B string each time (strings 4-2-... no, 4 then 1). Keep the skipped string muted. Slow and accurate first.","y":"string skipping exercise guitar"},{"x":"Build a lick that leaps between low and high strings — the gap creates a wider, more interesting line than scalar runs.","y":"string skipping licks lesson"}]},{"t":"Pinch (artificial) harmonics","c":"Technique","l":"Advanced","i":"Guitar","s":"The screaming \"squeal\" — catch the string with your thumb as you pick.","k":[{"x":"Choke up on the pick so only a tiny tip shows. Pick a fretted note and let your thumb graze the string right after — find the sweet spots over the pickups.","y":"pinch harmonics for beginners lesson"},{"x":"Add a bend + vibrato to a pinch harmonic for the classic squealing lead sound.","y":"pinch harmonic squeal technique"}]},{"t":"Two & three-finger plucking","c":"Technique","l":"Novice","i":"Bass","s":"Clean, even right-hand fingerstyle — the foundation of bass tone and speed.","k":[{"x":"Alternate index and middle fingers on the open E, one per beat, perfectly even in tone and volume. 80 BPM for 3 min.","y":"bass two finger technique lesson"},{"x":"Add the ring finger for a 3-finger roll to handle faster lines without tension.","y":"three finger bass technique lesson"}]},{"t":"Ghost notes & muting","c":"Technique","l":"Intermediate","i":"Both","s":"Muted, percussive \"dead\" notes that make a groove breathe and feel funky.","k":[{"x":"Lightly rest the fretting fingers (don’t press) and pick — you get a muted click. Work ghost notes between real notes in a simple groove.","y":"ghost notes bass groove lesson"},{"x":"Play a 16th-note funk pattern with ghost notes on the off-beats for that percussive feel.","y":"funk ghost notes guitar lesson"}]},{"t":"Building speed with a metronome","c":"Technique","l":"Intermediate","i":"Both","s":"The disciplined way to get faster without getting sloppy.","k":[{"x":"Pick any lick. Set the metronome where it’s perfectly clean. Play it 5x clean, bump +5 BPM, repeat. Drop back the moment it gets messy.","y":"how to build speed metronome guitar"},{"x":"Practice in bursts: play the phrase as fast-but-clean as possible, rest, repeat. Accuracy always beats raw speed.","y":"speed bursts practice guitar"}]},{"t":"Reading TAB & chord diagrams","c":"Theory","l":"Beginner","i":"Both","s":"How to read the two systems every online lesson and songbook uses.","k":[{"x":"TAB: 6 lines = 6 strings (lowest at the bottom), numbers = frets. Read a simple riff left to right and play it.","y":"how to read guitar tabs beginner"},{"x":"Chord diagrams: vertical = strings, horizontal = frets, dots = fingers, X = don’t play, O = open. Read and play a G chord from a diagram.","y":"how to read chord diagrams guitar"}]},{"t":"Rhythm notation & note values","c":"Theory","l":"Beginner","i":"Both","s":"Whole, half, quarter and eighth notes — how long each note lasts.","k":[{"x":"In 4/4: a whole note = 4 beats, half = 2, quarter = 1, eighth = ½. Clap each while counting \"1-2-3-4\".","y":"note values explained beginner music"},{"x":"Play one note on the guitar using each value over a 70 BPM click, counting out loud.","y":"counting rhythm guitar beginner"}]},{"t":"The CAGED system","c":"Theory","l":"Intermediate","i":"Guitar","s":"Five movable shapes that map every chord and scale across the whole neck.","k":[{"x":"Learn the 5 open shapes (C-A-G-E-D) and see how they connect up the neck to play one chord (e.g. C) in five places.","y":"caged system explained guitar"},{"x":"Play a C major scale linked through all five CAGED positions so you \"see\" the fretboard as connected shapes.","y":"caged scales fretboard lesson"}]},{"t":"Circle of fifths","c":"Theory","l":"Intermediate","i":"Both","s":"The map of all 12 keys — how they relate and which chords belong together.","k":[{"x":"Memorise the circle clockwise (C-G-D-A-E…), each a 5th up and adding one sharp. It tells you every key’s sharps/flats.","y":"circle of fifths explained simply"},{"x":"Use it to find a key’s I-IV-V: they sit next to each other on the circle. Try it for G.","y":"circle of fifths chord progressions"}]},{"t":"Capo & transposing","c":"Theory","l":"Novice","i":"Guitar","s":"Use a capo to change key while keeping easy open-chord shapes.","k":[{"x":"Put a capo on fret 2 and play a G shape — it now sounds as A. Each fret up moves the key up one semitone.","y":"how to use a capo guitar transpose"},{"x":"Find a comfortable key for a singer by moving the capo up/down while keeping the same shapes.","y":"capo transpose key for singing"}]},{"t":"Syncopation","c":"Rhythm","l":"Intermediate","i":"Both","s":"Accenting the off-beats — the secret behind funk, reggae and great grooves.","k":[{"x":"Count \"1-and-2-and\"; play only on the \"ands\" (the off-beats). It feels lopsided at first — that’s the point.","y":"syncopation rhythm guitar lesson"},{"x":"Play a chord stab on the \"and\" of beat 2 and 4 reggae-style, muting in between.","y":"reggae offbeat strumming lesson"}]},{"t":"Triplets & shuffle feel","c":"Rhythm","l":"Intermediate","i":"Both","s":"Dividing the beat into 3 — the bouncy feel under blues, swing and shuffles.","k":[{"x":"Count \"1-trip-let, 2-trip-let\" and play a note on each — three even notes per beat at 70 BPM.","y":"triplets rhythm exercise guitar"},{"x":"Play only the 1st and 3rd of each triplet for a shuffle/swing feel over a 12-bar blues.","y":"shuffle feel blues rhythm guitar"}]},{"t":"Odd time signatures","c":"Rhythm","l":"Advanced","i":"Both","s":"Playing in 5, 7 and beyond — the prog/math-rock challenge.","k":[{"x":"Count a bar of 7/8 as \"1-2-3, 1-2, 1-2\" and play a riff that lands with that grouping. Tap your foot on each \"1\".","y":"7/8 time signature explained riff"},{"x":"Loop a riff in 5/4 (like Take Five) until the odd count feels natural.","y":"5/4 time signature lesson guitar"}]},{"t":"Funk 16th-note strumming","c":"Rhythm","l":"Advanced","i":"Guitar","s":"Tight, percussive 16th-note rhythm playing — the Nile Rodgers school.","k":[{"x":"Keep your hand moving in constant 16ths (down-up-down-up). Only let chosen strums hit the strings; mute the rest. Start at 70 BPM.","y":"funk rhythm guitar 16th notes lesson"},{"x":"Use a tight 9th chord and add scratchy muted strums between the hits for groove.","y":"nile rodgers funk rhythm lesson"}]},{"t":"Hearing major vs minor","c":"Ear Training","l":"Novice","i":"Both","s":"The first ear-training win: instantly telling happy (major) from sad (minor).","k":[{"x":"Play C then Cm back to back, eyes closed, and feel the mood flip. Have someone (or an app) play one at random — name it.","y":"major vs minor chord ear training"},{"x":"Listen to songs and guess major or minor before checking — you’ll be right more than you expect.","y":"identify major minor by ear songs"}]},{"t":"Tuning by ear","c":"Ear Training","l":"Beginner","i":"Both","s":"Tune the guitar to itself using the 5th-fret method — no app needed.","k":[{"x":"5th-fret method: fret the low E at 5 (an A) and match the open A string to it. Repeat across (the G string uses the 4th fret).","y":"tune guitar by ear 5th fret method"},{"x":"Listen for the \"beating\" (wobble) between two notes — it slows and disappears as they come into tune.","y":"tuning by ear beats explained"}]},{"t":"Transcribing a bassline","c":"Ear Training","l":"Advanced","i":"Bass","s":"Working out a real bassline by ear — the skill that makes you a pro.","k":[{"x":"Pick a groove-based song. Find the root of each chord first, then fill in the connecting notes a few seconds at a time.","y":"how to transcribe bass by ear"},{"x":"Write out (or memorise) the line, then play along with the record to check timing and feel.","y":"learn bass lines by ear lesson"}]},{"t":"Campfire acoustic songs","c":"Songs","l":"Novice","i":"Guitar","s":"Crowd-pleasers built from a handful of open chords and a steady strum.","k":[{"x":"Wonderwall-style G-Em-C-D and Wagon Wheel (G-D-Em-C) — same four chords, dozens of songs. Loop the changes in time.","y":"easy 4 chord acoustic songs guitar"},{"x":"Three Little Birds (Bob Marley): A-D-E with an upbeat strum — practice switching cleanly.","y":"three little birds guitar lesson"}]},{"t":"Essential rock riffs","c":"Songs","l":"Intermediate","i":"Guitar","s":"The riffs every rock guitarist should have under their fingers.","k":[{"x":"Seven Nation Army, Back in Black (AC/DC), and Sunshine of Your Love (Cream) — single-note + power-chord riffs.","y":"essential rock riffs guitar lesson"},{"x":"Day Tripper (Beatles): a precise single-note riff that builds picking accuracy.","y":"day tripper riff guitar lesson"}]},{"t":"Advanced guitar workouts","c":"Songs","l":"Advanced","i":"Guitar","s":"Demanding songs that level up technique, timing and stamina.","k":[{"x":  lesson"},{"x":"Intonation: check the 12th-fret harmonic vs fretted note; move the saddle to make them match so it plays in tune up the neck.","y":"how to set guitar intonation"}]},{"t":"Shaping your bass tone","c":"Gear & Tone","l":"Intermediate","i":"Bass","s":"Pickup selection, EQ and right-hand position to dial in your bass sound.","k":[{"x":"Roll between neck and bridge pickups and hear fat vs punchy. Then sweep the tone knob to tame or add bite.","y":"bass tone pickups eq explained"},{"x":"Pluck near the neck for warmth, near the bridge for growl — your right-hand position is half your tone.","y":"bass right hand position tone"}]},{"t":"Using a looper pedal","c":"Gear & Tone","l":"Advanced","i":"Both","s":"Record a chord loop and solo over yourself — the ultimate practice tool.","k":[{"x":"Lay down a clean 4-bar chord loop, tapping in exact time so it loops seamlessly. Timing on the punch-in is everything.","y":"how to use a looper pedal beginner"},{"x":"Solo over your loop using the scale that fits — instant backing track for improv practice.","y":"practicing improvisation with a looper"}]}],"libCats":["Chords","Scales","Technique","Theory","Rhythm","Ear Training","Songs","Gear & Tone"],"libLevels":["Beginner","Novice","Intermediate","Advanced","Elite"],"badges":[{"id":"sess_1","icon":"musical-notes","tier":1,"title":"First Session","desc":"Complete your first practice session"},{"id":"sess_10","icon":"musical-notes","tier":2,"title":"Ten Deep","desc":"Complete 10 practice sessions"},{"id":"sess_30","icon":"musical-notes","tier":3,"title":"Thirty Strong","desc":"Complete 30 practice sessions"},{"id":"sess_100","icon":"musical-notes","tier":4,"title":"Centurion","desc":"Complete 100 practice sessions"},{"id":"streak_3","icon":"flame","tier":1,"title":"On a Roll","desc":"Practice 3 days in a row"},{"id":"streak_7","icon":"flame","tier":2,"title":"Locked In","desc":"Practice 7 days in a row"},{"id":"streak_14","icon":"flame","tier":2,"title":"Fortnight Fire","de let CH = { root: 'All', type: 'All' };
function chordSvg(c) {
  const W=92,H=112,L=15,T=24,SP=12.4,FR=18;
  const pos = c.f.filter(x => x > 0);
  const base = pos.length && Math.min(...pos) > 4 ? Math.min(...pos) : 1;
  let o = '';
  for (let i=0;i<6;i++) o += `<line x1="${L+i*SP}" y1="${T}" x2="${L+i*SP}" y2="${T+4*FR}" stroke="var(--ink-3)"/>`;
  for (let f=0;f<=4;f++) o += `<line x1="${L}" y1="${T+f*FR}" x2="${L+5*SP}" y2="${T+f*FR}" stroke="var(--ink-3)" stroke-width="${f===0&&base===1?3:1}"/>`;
  if (base>1) o += `<text x="${L-6}" y="${T+FR-5}" text-anchor="end" font-size="9" fill="var(--ink-3)">${base}</text>`;
  c.f.forEach((fr,i)=>{ const x=L+i*SP;
    if (fr===-1) o += `<path d="M${x-3.2} ${T-12}l6.4 6.4M${x+3.2} ${T-12}l-6.4 6.4" stroke="var(--ink-3)" stroke-width="1.5"/>`;
    else if (fr===0) o += `<circle cx="${x}" cy="${T-8}" r="3.4" fill="none" stroke="var(--ink-3)" stroke-width="1.5"/>`;
    else { const row=fr-base+1; if(row<1||row>4) return;
      o += `<circle cx="${x}" cy="${T+(row-.5)*FR}" r="5.5" fill="var(--primary)"/>`;
      if (c.fg[i]) o += `<text x="${x}" y="${T+(row-.5)*FR+3.2}" text-anchor="middle" font-size="8" fill="#fff" font-weight="700">${c.fg[i]}</text>`; }});
  return `<div style="background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center">
    <div style="font-weight:650;font-size:13px;margin-bottom:6px">${esc(c.n)}</div>
    <svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${o}</svg></div>`;
}
function viewChords() {
  const roots = ['All', ...new Set(APP.chords.map(c => c.r))];

  const chip = (k,v,on) => `<button class="btn sm ghost" data-ch="${k}" data-v="${esc(v)}"${on?' style="border-color:var(--primary);color:var(--ink)"':''}>${esc(v)}</button>`;
  $('#screen').innerHTML = `<div class="content">
    ${head('Chords &amp; scales', `${APP.chords.length} shapes · ${APP.scales.length} scales`)}
    <div style="display:flex;gap:8px;flex-wrap:wrap">${roots.map(r=>chip('root',r,CH.root===r)).join('')}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">${types.map(t=>chip('type',t,CH.type===t)).join('')}</div>
    ${card('Shapes', `${list.length} of ${APP.chords.length}`,
      list.length ? `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px">${list.map(chordSvg).join('')}</div>`
      : '<p class="hint" style="margin:0">Nothing matches those filters.</p>')}
    ${card('Scales', APP.scales.length, `<div class="hint">${APP.scales.map(x=>esc(x.name)).join(' · ')}</div>`)}
  </div>`;
}

              ${x.k && x.k.length ? `<div class="dur">${x.k.length} drill${x.k.length === 1 ? '' : 's'}</div>` : ''}</div>
            <div class="tbody2">
              ${x.s ? `<p class="tdesc">${esc(x.s)}</p>` : ''}
              ${(x.k || []).map((t, j) => `<div style="display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)">
                <span style="width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;
                  background:var(--raised);font-family:var(--round);font-weight:700;font-size:11px">${j + 1}</span>
                <div style="flex:1;min-width:0"><div style="font-size:13px;line-height:1.6;color:var(--ink-2)">${esc(t.x)}</div>
                  ${t.y ? `<button class="btn sm ghost" data-yt="${esc(t.y)}" data-yttitle="${esc(x.t)}" style="margin-top:8px">▶ Watch</button>` : ''}
                </div></div>`).join('')}
              ${!(x.k || []).length ? '<p class="hint" style="margin:0">No drills listed for this topic.</p>' : ''}
            </div></div>`;
        }).join('')
      : '<p class="hint" style="margin:0">Nothing matches.</p>')}
  </div>`;
}

let SONGQ = '';
function viewSongs() {
  const lib = Array.isArray(me.songLibrary) ? me.songLibrary : [];
  const sets = Array.isArray(me.setlists) ? me.setlists : [];
  const inst = me.instrument || 'guitar';
  // src/constants/songs.js builds these the same way.

  const apple = (t, a) => `https://music.apple.com/search?term=${encodeURIComponent(`${t} ${a || ''}`.trim())}`;

  const songRow = (x, i) => {
    const id = 'song' + i, open = OPEN[id];
    const steps = Array.isArray(x.steps) ? x.steps : [];
    const done = steps.filter(st => st.done).length;
    return `<div class="trow${open ? ' open' : ''}">
      <div class="thead2" data-open="${id}">
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 5l7 7-7 7"/></svg>

        <button class="btn sm ghost" data-preview="${esc(x.title)}|${esc(x.artist || '')}"
          title="30-second preview" style="flex:none">▶</button>
        ${steps.length ? `<div class="dur">${Math.round(done / steps.length * 100)}%</div>` : ''}</div>
      <div class="tbody2">
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:${steps.length ? '14px' : '0'}">
          <button class="btn sm ghost" data-yt="${esc(x.title)} ${esc(x.artist || '')} ${esc(inst)} tutorial" data-yttitle="${esc(x.title)}">▶ Watch a tutorial</button>
          <a class="btn sm ghost" target="_blank" rel="noopener" href="${spotify(x.title, x.artist)}">Listen on Spotify</a>

          ${steps.map((st, k) => `<div style="display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)">
            <div class="tick${st.done ? ' on' : ''}" style="margin-top:2px">${st.done
              ? '<svg viewBox="0 0 24 24" fill="none" stroke="var(--ground)" stroke-width="3.5" style="width:11px;height:11px"><path d="M20 6L9 17l-5-5"/></svg>' : ''}</div>
            <div style="flex:1;min-width:0"><div style="font-size:13.5px;font-weight:600${st.done ? ';color:var(--ink-3);text-decoration:line-through' : ''}">${esc(st.title || 'Step ' + (k + 1))}</div>
              ${st.detail ? `<div class="tsub" style="margin-top:2px;line-height:1.55">${esc(st.detail)}</div>` : ''}</div></div>`).join('')}`
          : '<p class="hint" style="margin:0">No step plan yet — build one in the app to get the eight-step breakdown.</p>'}
      </div></div>`;
  };

  const q = (SONGQ || '').trim().toLowerCase();
  const shown = q ? lib.filter(x => `${x.title} ${x.artist || ''}`.toLowerCase().includes(q)) : lib;

  $('#screen').innerHTML = `<div class="content">
    ${head('Songs', `${lib.length} in your library · ${sets.length} setlist${sets.length === 1 ? '' : 's'}`,
      `<div style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" id="learnBtn">Learn a song</button>
        <button class="btn ghost" id="setlistBtn">Build a setlist</button></div>`)}
    <input id="songSearch" placeholder="Search your songs…" value="${esc(SONGQ)}"
      style="width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px">
    <div class="cols"><div class="stack">
      ${card('Library', q ? `${shown.length} of ${lib.length}` : lib.length, shown.length
        ? shown.map(songRow).join('')
        : (q ? empty('Nothing matches', `No song in your library matches "${esc(SONGQ)}".`)
             : empty('No songs yet', 'Use “Learn a song” and Prova builds a step-by-step plan.')))}
    </div><div class="stack">
      ${card('Setlists', sets.length, sets.length
        ? sets.map((x, i) => {
            const id = 'set' + i, open = OPEN[id], songs = x.songs || [];
            return `<div class="trow${open ? ' open' : ''}">
              <div class="thead2" data-open="${id}">
                <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 5l7 7-7 7"/></svg>
                <div style="flex:1;min-width:0"><div class="ttl">${esc(x.name)}</div>

    viewSongs();

  });
  $('#learnBtn').onclick = learnSongSheet;
  $('#setlistBtn').onclick = setlistSheet;
  paintArtwork();
}

const SHEET_F = 'width:100%;background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:inherit;font:inherit';

// ── Learn a song — generateSongPlan, saved into songLibrary ──────────────
function learnSongSheet() {
  $('#overlays').innerHTML = `<div class="scrim" data-close></div><div class="modal" style="text-align:left">
    <div style="display:flex;align-items:center"><span class="lab">Learn a song</span>
