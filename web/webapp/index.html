<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prova</title>
<link rel="icon" href="/img/icon-192.png">
<style>
  :root{
    color-scheme:dark;
    --page:#101318;--ground:#171A21;--card:#212630;--raised:#2A303C;--line:#333B4A;
    --ink:#F4F6FA;--ink-2:#A8B2C4;--ink-3:#8A94A8;--primary:#2A99DB;--primary-dk:#1E7CB5;
    --teal:#1D93A1;--good:#6EE7B7;--warn:#B8894A;--bad:#F58B8B;--on-primary:#fff;
    --r-sm:8px;--r-md:12px;--r-lg:18px;
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Helvetica,Arial,sans-serif;
    --round:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;
    --serif:Georgia,"Iowan Old Style",serif;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.22);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
  h1,h2,h3{margin:0;text-wrap:balance}
  button,input{font:inherit;color:inherit}
  .hidden{display:none!important}
  :focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:4px}
  .fig{font-family:var(--round);font-weight:600;font-variant-numeric:tabular-nums}

  .login{min-height:100vh;display:grid;place-items:center;padding:24px}
  .loginbox{width:min(400px,100%);background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:30px;box-shadow:var(--shadow)}
  .loginbox .word{font-family:var(--serif);font-size:21px;letter-spacing:3.5px}
  .loginbox p{color:var(--ink-3);font-size:13px;margin:6px 0 22px}
  label{display:block;font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-3);margin:0 0 6px}
  input{width:100%;background:var(--raised);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px}
  input:focus{border-color:var(--primary);outline:none}
  input::placeholder{color:var(--ink-3)}
  /* Chrome paints saved-password fields pale blue and ignores background —
     only an inset shadow the size of the box overrides it. */
  input:-webkit-autofill,
  input:-webkit-autofill:hover,
  input:-webkit-autofill:focus,
  input:-webkit-autofill:active{
    -webkit-text-fill-color:var(--ink);
    -webkit-box-shadow:0 0 0 1000px var(--raised) inset;
    box-shadow:0 0 0 1000px var(--raised) inset;
    caret-color:var(--ink);
    transition:background-color 9999s ease-out 0s;
  }
  select{background:var(--raised);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;color:var(--ink)}
  textarea{background:var(--raised);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;color:var(--ink)}
  input[type=number]::-webkit-inner-spin-button{opacity:.35}
  .field{margin-bottom:15px}
  .err{color:var(--bad);font-size:13px;min-height:19px;margin-top:4px}
  .rolebtn{display:block;width:100%;text-align:left;background:var(--raised);border:1px solid var(--line);
    border-radius:var(--r-md);padding:14px 16px;margin-bottom:10px;cursor:pointer}
  .rolebtn:hover{border-color:var(--primary)}
  .rolebtn b{display:block;font-size:14.5px;font-weight:650}
  .rolebtn span{display:block;font-size:12.5px;color:var(--ink-3);margin-top:2px}
  .linkbtn{width:100%;background:none;border:0;color:var(--ink-3);font-size:13px;cursor:pointer;padding:10px 0;text-align:center}
  .linkbtn b{color:var(--primary)}
  .linkbtn:hover{color:var(--ink)}

  .btn{border:0;cursor:pointer;font-weight:650;background:var(--primary);color:var(--on-primary);border-radius:var(--r-sm);padding:11px 20px}
  .btn:hover{background:var(--primary-dk)}
  .btn[disabled]{opacity:.5;cursor:default}
  .btn.ghost{background:transparent;color:var(--ink-2);border:1px solid var(--line)}
  .btn.sm{padding:7px 13px;font-size:13px}
  .btn.wide{width:100%}

  .shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh;background:var(--ground)}
  .rail{border-right:1px solid var(--line);background:var(--page);display:flex;flex-direction:column;padding:20px 13px;gap:22px}
  .brand{display:flex;align-items:center;gap:11px;padding:0 8px}
  .brand img{width:30px;height:30px;border-radius:8px}
  .brand .word{font-family:var(--serif);font-size:18px;letter-spacing:3.5px}
  .nav{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:var(--r-sm);color:var(--ink-2);font-weight:500;cursor:pointer;background:none;border:0;width:100%;text-align:left}
  .nav svg{width:17px;height:17px;flex:none;opacity:.85}
  .nav:hover{background:var(--card);color:var(--ink)}
  .nav[aria-current="page"]{background:var(--card);color:var(--ink);font-weight:650;box-shadow:inset 2px 0 0 var(--primary)}
  .eyebrow{font-size:10.5px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink-3);padding:0 10px 7px}
  .ask{margin-top:auto;text-align:left;width:100%;cursor:pointer;border:0;border-radius:var(--r-md);
    padding:12px 14px;background:linear-gradient(150deg,var(--teal),var(--primary));color:#fff}
  .ask strong{display:block;font-size:13.5px}
  .ask span{display:block;font-size:11.5px;opacity:.85}
  .who{display:flex;align-items:center;gap:10px;padding:12px 8px 0;border-top:1px solid var(--line)}
  .avatar{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:11.5px;font-weight:700;background:var(--raised);color:var(--ink-2);font-family:var(--round)}
  .who .nm{font-size:13px;font-weight:600;line-height:1.25;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .who .rl{font-size:11.5px;color:var(--ink-3)}

  .top{display:flex;align-items:center;gap:16px;padding:0 26px;height:64px;border-bottom:1px solid var(--line);background:var(--ground);position:sticky;top:0;z-index:5}
  .top h1{font-size:16px;font-weight:650}
  .chips{margin-left:auto;display:flex;gap:8px}
  .chip{display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600}
  .chip .lab{color:var(--ink-3);font-weight:500}
  .chip .v{font-family:var(--round);font-variant-numeric:tabular-nums}

  .content{padding:26px;display:flex;flex-direction:column;gap:22px}
  .greet h2{font-size:24px;font-weight:640;letter-spacing:-.3px}
  .greet p{margin:3px 0 0;color:var(--ink-3);font-size:13.5px}
  .cols{display:grid;grid-template-columns:minmax(0,2.15fr) minmax(0,1fr);gap:22px;align-items:start}
  .stack{display:flex;flex-direction:column;gap:22px;min-width:0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow)}
  .card>header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .card h3{font-size:14.5px;font-weight:650}
  .card header .meta{margin-left:auto;font-size:12.5px;color:var(--ink-3);font-family:var(--round)}
  .hint{color:var(--ink-3);font-size:12.5px}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;box-shadow:var(--shadow)}
  .stat .k{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-3)}
  .stat .v{font-family:var(--round);font-weight:600;font-size:28px;line-height:1.15;font-variant-numeric:tabular-nums}
  .stat .v small{font-size:12.5px;color:var(--ink-3);font-weight:600;margin-left:4px}

  .planhead{display:flex;align-items:center;gap:18px;padding:18px 20px;border-radius:var(--r-lg);
    background:linear-gradient(180deg,color-mix(in srgb,var(--primary) 9%,var(--card)),var(--card));
    border:1px solid color-mix(in srgb,var(--primary) 26%,var(--line));box-shadow:var(--shadow)}
  .planhead.complete{background:linear-gradient(180deg,color-mix(in srgb,var(--good) 8%,var(--card)),var(--card));
    border-color:color-mix(in srgb,var(--good) 26%,var(--line))}
  .planhead .phcopy{flex:1;min-width:0}
  .planhead .phline{font-size:19px;font-weight:650;letter-spacing:-.2px}
  .planhead .phsub{font-size:13px;color:var(--ink-3);margin-top:2px}

  .trow{border-top:1px solid var(--line)}
  .trow:first-child{border-top:0}
  .thead2{display:flex;align-items:center;gap:11px;padding:12px 0;cursor:pointer;min-width:0}
  .chev{width:15px;height:15px;flex:none;color:var(--ink-3);transition:transform .18s}
  .trow.open .chev{transform:rotate(90deg)}
  .tbody2{padding:0 0 14px 26px;display:none}
  .trow.open .tbody2{display:block}
  .tdesc{color:var(--ink-2);font-size:13px;line-height:1.6;white-space:pre-wrap;margin:0 0 12px}
  .tick{width:20px;height:20px;border-radius:50%;flex:none;border:1.5px solid var(--line);display:grid;place-items:center}
  .tick.on{background:var(--good);border-color:var(--good)}
  .ttl{font-weight:600;font-size:13.5px}
  .ttl.done{color:var(--ink-3);text-decoration:line-through}
  .tsub{font-size:12px;color:var(--ink-3)}
  .dur{font-size:12.5px;color:var(--ink-2);font-family:var(--round);font-weight:600;flex:none}
  .pill{font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:3px 8px;border-radius:999px;flex:none}
  .pill.set{background:color-mix(in srgb,var(--teal) 20%,transparent);color:var(--teal)}
  .showmore{width:100%;background:none;border:0;border-top:1px solid var(--line);color:var(--ink-3);font-size:12.5px;font-weight:650;padding:12px 0 0;cursor:pointer}

  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40}
  .modal{position:fixed;z-index:41;top:50%;left:50%;transform:translate(-50%,-50%);width:min(460px,94vw);background:var(--ground);border:1px solid var(--line);border-radius:22px;padding:26px;text-align:center;box-shadow:var(--shadow)}
  .modal .lab{font-size:11px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:var(--ink-3)}
  .clock{font-family:var(--round);font-weight:600;font-size:44px;font-variant-numeric:tabular-nums;line-height:1}
  .x{background:none;border:0;color:var(--ink-3);cursor:pointer;font-size:20px;padding:4px 8px}

  .celeb-root{position:fixed;inset:0;display:grid;place-items:center;z-index:9999;pointer-events:none}
  .celeb-card{display:flex;flex-direction:column;align-items:center;background:var(--raised);border-radius:28px;padding:26px 34px;border:1px solid color-mix(in srgb,var(--primary) 18%,transparent);box-shadow:0 12px 24px rgba(0,0,0,.35);animation:cIn .42s cubic-bezier(.2,1.5,.4,1) both}
  .celeb-root.out .celeb-card{animation:cOut .24s ease forwards}
  @keyframes cIn{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
  @keyframes cOut{to{opacity:0;transform:scale(.92)}}
  .celeb-ring{position:absolute;width:76px;height:76px;border-radius:38px;background:var(--teal);animation:cRing .72s cubic-bezier(.22,.61,.36,1) forwards}
  @keyframes cRing{0%{opacity:.5;transform:scale(.4)}60%{opacity:.12}100%{opacity:0;transform:scale(2.4)}}
  .celeb-bw{position:relative;display:grid;place-items:center;margin-bottom:14px}
  .celeb-badge{width:76px;height:76px;border-radius:38px;display:grid;place-items:center;font-size:38px;background:color-mix(in srgb,var(--teal) 13%,transparent);border:1px solid color-mix(in srgb,var(--teal) 33%,transparent)}
  .celeb-title{font-size:19px;font-weight:800;margin-bottom:4px}
  .celeb-pts{color:var(--teal);font-family:var(--round);font-size:40px;font-weight:800;line-height:1.1}
  .celeb-sub{color:var(--ink-3);font-size:13px;margin-top:2px}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:11px 22px;box-shadow:var(--shadow);opacity:0;transition:.22s;z-index:60;font-size:13.5px;font-weight:600}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .rows{display:flex;flex-direction:column}
  .prow{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line)}
  .prow:first-child{border-top:0;padding-top:0}
  .prow .pl{flex:1;min-width:0}
  .prow .pt{font-weight:600;font-size:13.5px}
  .prow .ps{font-size:12px;color:var(--ink-3)}
  a.btn{text-decoration:none;display:inline-block}
  .empty{text-align:center;padding:30px 20px;color:var(--ink-3)}
  .opt{background:var(--raised);border:1px solid var(--line);border-radius:var(--r-md);padding:13px 16px;
    text-align:left;cursor:pointer;font-size:13.5px;font-weight:550;color:inherit}
  .opt:hover{border-color:var(--primary)}
  .opt.right{border-color:var(--good);color:var(--good)}
  .opt.wrong{border-color:var(--bad);color:var(--bad)}
  .pill{font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:3px 8px;border-radius:999px}
  .pill.set{background:color-mix(in srgb,var(--teal) 20%,transparent);color:var(--teal)}
  .pill.warn{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn)}
  .msg{display:grid;grid-template-columns:270px minmax(0,1fr);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--card);box-shadow:var(--shadow);height:600px}
  .convs{border-right:1px solid var(--line);overflow-y:auto;background:var(--page)}
  .conv{display:flex;gap:11px;padding:13px 14px;border:0;border-bottom:1px solid var(--line);cursor:pointer;width:100%;text-align:left;background:none;color:inherit;align-items:center}
  .conv:hover{background:var(--card)}
  .conv[aria-selected="true"]{background:var(--card);box-shadow:inset 2px 0 0 var(--primary)}
  .conv .cn{font-size:13.5px;font-weight:650;display:block}
  .conv .cp{font-size:12px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;max-width:170px}
  .thread{display:flex;flex-direction:column;min-width:0}
  .thead{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px}
  .thead .tn{font-weight:650;font-size:14px} .thead .ts{font-size:12px;color:var(--ink-3)}
  .bubbles{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:11px}
  .bub{max-width:74%;padding:10px 14px;border-radius:16px;font-size:13.5px;line-height:1.5}
  .bub.them{background:var(--raised);border-bottom-left-radius:5px;align-self:flex-start}
  .bub.me{background:var(--primary);color:var(--on-primary);border-bottom-right-radius:5px;align-self:flex-end}
  .composer{border-top:1px solid var(--line);padding:12px 14px;display:flex;gap:10px;align-items:center}
  .composer input{flex:1;background:var(--raised);border:1px solid var(--line);border-radius:999px;padding:9px 15px}

  @keyframes sp{to{transform:rotate(360deg)}}
  .metro{position:fixed;right:22px;bottom:22px;z-index:30;display:flex;align-items:center;gap:12px;
    background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 14px 9px 12px;box-shadow:var(--shadow)}
  .metro{display:none}
  .metro.ready{display:flex}
  /* Only the steppers are round — this rule used to hit the BPM button too
     and squashed it to 26px, clipping the number. */
  .metro .step{background:var(--raised);border:1px solid var(--line);color:var(--ink-2);
    width:28px;height:28px;border-radius:50%;cursor:pointer;padding:0;line-height:1;flex:none;font-size:15px}
  .metro .play{background:var(--raised);border:1px solid var(--line);color:var(--ink-2);
    border-radius:999px;padding:5px 14px;cursor:pointer;font-size:13px;font-weight:650;flex:none}
  .metro .open{background:none;border:0;display:flex;align-items:center;gap:11px;cursor:pointer;
    color:inherit;padding:0 4px 0 0;flex:none}
  .metro .open .txt{display:flex;flex-direction:column;align-items:flex-start;line-height:1.05}
  .mbpm{font-family:var(--round);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;display:block}
  .mlab{font-size:10px;color:var(--ink-3);letter-spacing:.6px;text-transform:uppercase;font-weight:700;display:block}
  .beatbars{display:flex;gap:6px;align-items:flex-end;height:60px;margin-bottom:6px}
  .beatbar{flex:1;border-radius:5px 5px 3px 3px;background:var(--raised);border:1px solid var(--line);cursor:pointer;
    display:flex;align-items:flex-end;justify-content:center;font-size:10px;color:var(--ink-3);padding-bottom:3px}
  .beatbar.on{border-color:var(--primary)} .beatbar.cur{outline:2px solid var(--primary);outline-offset:1px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  @media (max-width:1080px){.cols{grid-template-columns:minmax(0,1fr)}.shell{grid-template-columns:70px minmax(0,1fr)}.rail .word,.nav span,.eyebrow,.who .nm,.who .rl{display:none}.nav{justify-content:center}}
  @media (max-width:720px){.stats{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="splash" style="min-height:100vh;display:grid;place-items:center">
  <div style="text-align:center">
    <img src="/img/icon-192.png" alt="" style="width:64px;height:64px;border-radius:17px">
    <div style="font-family:var(--serif);font-size:20px;letter-spacing:3.5px;margin-top:14px">PROVA</div>
    <div class="spin" style="margin-top:18px;display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--primary);border-radius:50%;animation:sp .7s linear infinite"></div>
  </div>
</div>
<div class="login hidden" id="login">
  <div class="loginbox">

    <div id="welcome">
      <div style="text-align:center;padding:4px 0 6px">
        <img src="/img/icon-192.png" alt="" style="width:60px;height:60px;border-radius:16px">
        <div class="word" style="margin-top:14px">PROVA</div>
        <div style="font-size:10.5px;letter-spacing:2.6px;text-transform:uppercase;color:var(--primary);font-weight:700;margin-top:4px">Your AI music coach</div>
      </div>
      <div style="font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--ink-3);font-weight:700;margin:26px 0 12px">Get started</div>
      <button class="rolebtn" data-role="student"><b>I'm a Student</b><span>Learn with a teacher — get assigned tasks and lessons</span></button>
      <button class="rolebtn" data-role="personal"><b>Personal</b><span>Practice solo with an AI plan and progress tracking</span></button>
      <button class="rolebtn" data-role="teacher"><b>I'm a Teacher</b><span>Monitor students and assign practice</span></button>
      <button class="linkbtn" id="toLogin">Already have an account? <b>Log in</b></button>
    </div>

    <div id="signin" class="hidden">
      <button class="linkbtn" data-back style="text-align:left;margin:0 0 14px">← Back</button>
      <div class="word">PROVA</div>
      <p>Welcome back. Sign in to your account.</p>
      <div class="field"><label for="em">Email</label><input id="em" type="email" autocomplete="username"></div>
      <div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password"></div>
      <button class="btn wide" id="loginBtn">Sign in</button>
      <div class="err" id="loginErr"></div>
    </div>

    <div id="signup" class="hidden">
      <button class="linkbtn" data-back style="text-align:left;margin:0 0 14px">← Back</button>
      <div class="word">PROVA</div>
      <p>Create your <span id="suRole">student</span> account.</p>
      <div class="field"><label for="suName">Name</label><input id="suName" autocomplete="name"></div>
      <div class="field"><label for="suEm">Email</label><input id="suEm" type="email" autocomplete="email"></div>
      <div class="field"><label for="suPw">Password</label><input id="suPw" type="password" autocomplete="new-password" placeholder="At least 6 characters"></div>
      <div class="field" id="suInstWrap"><label>Instrument</label>
        <div style="display:flex;gap:8px"><button class="btn ghost sm" data-inst="Guitar" style="flex:1;border-color:var(--primary);color:var(--ink)">Guitar</button>
        <button class="btn ghost sm" data-inst="Bass" style="flex:1">Bass</button></div></div>
      <button class="btn wide" id="suBtn">Create account</button>
      <div class="err" id="suErr"></div>
      <p style="font-size:12px;color:var(--ink-3);margin-top:14px">You'll finish setting up — level, goals and your first plan —
        in the Prova app on your phone.</p>
    </div>

  </div>
</div>

<div class="shell hidden" id="app">
  <aside class="rail">
    <div class="brand"><img src="/img/icon-192.png" alt=""><div class="word">PROVA</div></div>
    <div id="nav"></div>
    <button class="ask" data-go="ask"><strong>Ask Prova</strong><span>Stuck on something? Just ask.</span></button>
    <div class="who"><div class="avatar" id="meAv">–</div>
      <div style="min-width:0"><div class="nm" id="meNm">…</div><div class="rl" id="meRl"></div></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFunctions, httpsCallable } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js';
import { getFirestore, doc, getDoc, updateDoc, setDoc, increment, collection, getDocs,
  addDoc, serverTimestamp, onSnapshot, query, orderBy, limit }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const app = initializeApp({
  apiKey: 'AIzaSyAP7411t8bn81DoCtJI7ajy30UGaPdaRNU',
  authDomain: 'prova-583c9.firebaseapp.com',
  projectId: 'prova-583c9',
});
const auth = getAuth(app), db = getFirestore(app), fns = getFunctions(app);
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const toast = (m) => { const t = $('#toast'); t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2400); };

// ── The app's own rules, copied verbatim so the numbers match ─────────────
// src/lib/score.js
const POINTS_PER_MIN = 2, TASK_BASE = 5, TEACHER_TASK_MULTIPLIER = 3;
const TASK_DIFFICULTY = { warmup:1.0, theory:1.1, ear_training:1.2, repertoire:1.2, technique:1.3, improvisation:1.4 };
const taskPoints = (s = {}) => Math.round((s.duration || 0) * POINTS_PER_MIN * (TASK_DIFFICULTY[s.category] || 1.1)) + TASK_BASE;
const teacherTaskPoints = (sec) => Math.round((Math.max(0, sec) / 60) * POINTS_PER_MIN * TEACHER_TASK_MULTIPLIER);
// src/lib/displayName.js
const displayName = (u) => (u?.username?.trim()) || (u?.name?.trim()) || (u?.email ? u.email.split('@')[0] : 'there');
const initials = (n) => n.split(/\s+/).slice(0,2).map(w => w[0]).join('').toUpperCase();
// src/lib/practiceLog.js uses a UTC date key; sessionProgress uses toDateString()
const dayKey = () => new Date().toISOString().split('T')[0];
const todayKey = () => new Date().toDateString();
const DAYS = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
const TODAY_NAME = DAYS[new Date().getDay()];

let me = null, uid = null, sessions = [], screen = 'today';

// ── auth ─────────────────────────────────────────────────────────────────
// Welcome → sign in, or Welcome → pick a role → sign up. Straight to a login
// box was a shortcut; the app asks who you are first, so this does too.
const panes = ['welcome','signin','signup'];
const show = (id) => panes.forEach(p => $('#' + p).classList.toggle('hidden', p !== id));
let SIGNUP_ROLE = 'student', SIGNUP_INST = 'Guitar';
document.querySelectorAll('[data-role]').forEach(b => b.onclick = () => {
  SIGNUP_ROLE = b.getAttribute('data-role');
  $('#suRole').textContent = SIGNUP_ROLE === 'teacher' ? 'teacher' : SIGNUP_ROLE === 'personal' ? 'personal' : 'student';
  $('#suInstWrap').classList.toggle('hidden', SIGNUP_ROLE === 'teacher');
  show('signup');
});
$('#toLogin').onclick = () => show('signin');
document.querySelectorAll('[data-back]').forEach(b => b.onclick = () => show('welcome'));
document.querySelectorAll('[data-inst]').forEach(b => b.onclick = () => {
  SIGNUP_INST = b.getAttribute('data-inst');
  document.querySelectorAll('[data-inst]').forEach(x => x.setAttribute('style',
    'flex:1' + (x === b ? ';border-color:var(--primary);color:var(--ink)' : '')));
});

$('#loginBtn').onclick = async () => {
  $('#loginErr').textContent = ''; $('#loginBtn').disabled = true;
  try { await signInWithEmailAndPassword(auth, $('#em').value.trim(), $('#pw').value); }
  catch { $('#loginErr').textContent = 'Sign-in failed — check your email and password.'; }
  finally { $('#loginBtn').disabled = false; }
};
$('#pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#loginBtn').click(); });

$('#suBtn').onclick = async () => {
  const nm = $('#suName').value.trim(), em = $('#suEm').value.trim(), pw = $('#suPw').value;
  $('#suErr').textContent = '';
  if (!nm || !em || pw.length < 6) { $('#suErr').textContent = 'Name, email, and a password of at least 6 characters.'; return; }
  $('#suBtn').disabled = true;
  try {
    const cred = await createUserWithEmailAndPassword(auth, em, pw);
    // The same fields the app's onboarding writes first — the rest (level,
    // goals, the generated plan) is finished on the phone.
    await setDoc(doc(db, 'users', cred.user.uid), {
      email: em, username: nm, role: SIGNUP_ROLE, createdAt: new Date().toISOString(),
      onboardingComplete: false, streak: 0, provaScore: 0, totalMinutes: 0,
      ...(SIGNUP_ROLE === 'teacher' ? {} : { instrument: SIGNUP_INST }),
    }, { merge: true });
  } catch (e) {
    $('#suErr').textContent = /email-already-in-use/.test(e?.code || '')
      ? 'That email already has an account — log in instead.'
      : /weak-password/.test(e?.code || '') ? 'Pick a longer password.'
      : 'Could not create the account. Try again.';
    $('#suBtn').disabled = false;
  }
};
$('#signout').onclick = confirmSignOut;
function confirmSignOut() {
  $('#overlays').innerHTML = `<div class="scrim" data-close></div><div class="modal">
    <h3 style="font-size:18px;margin-bottom:10px">Sign out?</h3>
    <p class="hint" style="margin:0">You'll need your email and password to get back in.</p>
    <div style="display:flex;gap:10px;margin-top:22px">
      <button class="btn ghost" data-close style="flex:1">Cancel</button>
      <button class="btn" id="soYes" style="flex:1">Sign out</button></div></div>`;
  $('#soYes').onclick = async () => {
    $('#overlays').innerHTML = '';
    await signOut(auth);
    try { Object.keys(localStorage).filter(k => k.startsWith('prova:')).forEach(k => localStorage.removeItem(k)); } catch {}
    ['#em', '#pw', '#suEm', '#suPw', '#suName'].forEach(sel => { const el = $(sel); if (el) el.value = ''; });
  };
}

// Nothing is shown until Firebase has resolved the session — otherwise a
// signed-in visitor sees the welcome screen flash before their account
// loads. Same reason the app holds `loading` in useAuth (PR #67).
onAuthStateChanged(auth, async (user) => {
  if (!user) {
    $('#splash').classList.add('hidden');
    $('#login').classList.remove('hidden'); $('#app').classList.add('hidden');
    document.getElementById('metro').classList.remove('ready');
    if (metroInt) { METRO.playing = false; metroStop(); }
    show('welcome');
    return;
  }
  uid = user.uid;
  // Role decides the whole experience, exactly as it does in the app — a
  // teacher signing in here was getting the student screen with an empty
  // plan. Studio is the teacher surface.
  try {
    const snap = await getDoc(doc(db, 'users', user.uid));
    if ((snap.data() || {}).role === 'teacher') {
      $('#splash').innerHTML = `<div style="text-align:center">
        <img src="/img/icon-192.png" alt="" style="width:64px;height:64px;border-radius:17px">
        <div style="font-family:var(--serif);font-size:20px;letter-spacing:3.5px;margin-top:14px">PROVA</div>
        <div style="color:var(--ink-3);font-size:13px;margin-top:12px">Teacher account — opening Studio…</div></div>`;
      location.replace('/studio/');
      return;
    }
  } catch { /* fall through to the student view */ }
  loadPrior();
  try { await load(); }
  catch { $('#splash').classList.add('hidden'); $('#login').classList.remove('hidden'); show('welcome'); return; }
  $('#splash').classList.add('hidden');
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  renderNav(); go('today');
  document.getElementById('metro').classList.add('ready');
});
// If Firebase never answers (offline, blocked), don't sit on the splash.
setTimeout(() => {
  if (!$('#splash').classList.contains('hidden') && !auth.currentUser) {
    $('#splash').classList.add('hidden'); $('#login').classList.remove('hidden'); show('welcome');
  }
}, 8000);

async function load() {
  me = (await getDoc(doc(db, 'users', uid))).data() || {};
  sessions = me.practicePlan?.weeklyPlan?.[TODAY_NAME]?.sessions || [];
  const nm = displayName(me);
  $('#meNm').textContent = nm; $('#meAv').textContent = initials(nm) || '?';
  $('#meRl').textContent = [me.instrument, me.level].filter(Boolean).join(' · ');
  $('#chipStreak').textContent = me.streak || 0;
  $('#chipScore').textContent = (me.provaScore || 0).toLocaleString();
}
const doneIds = () => (me.sessionProgress?.date === todayKey() ? (me.sessionProgress.ids || []) : []);
const assigned = () => Array.isArray(me.assignedTasks) ? me.assignedTasks : [];

// ── nav ──────────────────────────────────────────────────────────────────
const ICON = { home:'<path d="M3 9l9-6 9 6v10a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>' };
const svg = (p) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">${p}</svg>`;
const NAV = [
  { g: 'Practice' },
  { id: 'today',    t: 'Today',    i: '<path d="M3 9l9-6 9 6v10a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>' },
  { id: 'practice', t: 'Practice', i: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>' },
  { id: 'songs',    t: 'Songs',    i: '<path d="M9 18V5l10-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/>' },
  { id: 'schedule', t: 'Schedule', i: '<path d="M8 3v4M16 3v4M4 8h16M5 5h14v15H5z"/>' },
  { g: 'Track' },
  { id: 'progress', t: 'Progress', i: '<path d="M4 19V9m5 10V5m5 14v-7m5 7V8"/>' },
  { id: 'journal',  t: 'Journal',  i: '<path d="M4 20h4L19 9a2.8 2.8 0 10-4-4L4 16z"/>' },
  { g: 'Studio' },
  { id: 'messages', t: 'Messages', i: '<path d="M21 12a8 8 0 01-8 8H4l2-3a8 8 0 1115-5z"/>' },
  { id: 'profile',  t: 'Profile',  i: '<circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0114 0"/>' },
];
const TITLES = { today:'Today', practice:'Practice', songs:'Songs', schedule:'Schedule',
  progress:'Progress', journal:'Journal', profile:'Profile', messages:'Messages', chords:'Chords & scales', library:'Lesson library', ear:'Ear training', fret:'Fretboard game', ask:'Ask Prova' };
const PARENT = { chords:'practice', library:'practice', ear:'practice', fret:'practice', ask:'practice' };
function renderNav() {
  $('#nav').innerHTML = NAV.map((x) => x.g
    ? `<div class="eyebrow">${x.g}</div>`
    : `<button class="nav" data-go="${x.id}"${x.id === screen || PARENT[screen] === x.id ? ' aria-current="page"' : ''}>${svg(x.i)}<span>${x.t}</span></button>`
  ).join('');
}
$('#app').addEventListener('click', (e) => { const b = e.target.closest('[data-go]'); if (b) go(b.getAttribute('data-go')); });
// Every screen's renderer in one place. Expanding a row must repaint the
// screen you are ON — calling render() directly painted Today over whatever
// tab you were looking at.
const VIEWS = { today: render, practice: viewPractice, songs: viewSongs, schedule: viewSchedule,
  progress: viewProgress, journal: viewJournal, profile: viewProfile, messages: viewMessages,
  chords: viewChords, library: viewLibrary, ear: viewEar, fret: viewFret, ask: viewAsk };
const rerender = () => (VIEWS[screen] || render)();
function go(id) {
  screen = id;
  $('#pageTitle').textContent = TITLES[id] || '';
  renderNav();
  (VIEWS[id] || render)();
  window.scrollTo({ top: 0 });
}

// ── celebration, ported from src/components/Celebration.js ───────────────
const PRAISE = ['Nice work!','Boom!','Great job!','Love it!','Keep going!','On fire!'];
let celebN = 0;
function celebrate({ points = 0, title, subtitle, emoji = '🎸' } = {}) {
  const pts = Math.max(0, Math.round(points));
  const host = document.createElement('div');
  host.className = 'celeb-root';
  host.innerHTML = `<div class="celeb-card"><div class="celeb-bw"><div class="celeb-ring"></div>
    <div class="celeb-badge">${emoji}</div></div>
    <div class="celeb-title">${esc(title || PRAISE[celebN++ % PRAISE.length])}</div>
    ${pts ? `<div class="celeb-pts">+<span class="celeb-n">0</span><span style="color:var(--ink-2);font-size:16px"> pts</span></div>` : ''}
    ${subtitle ? `<div class="celeb-sub">${esc(subtitle)}</div>` : ''}</div>`;
  document.body.appendChild(host);
  if (pts) {
    const n = host.querySelector('.celeb-n'), t0 = performance.now() + 140;
    const run = () => { const e = performance.now() - t0;
      if (e < 0) return requestAnimationFrame(run);
      const k = Math.min(1, e / 600);
      n.textContent = Math.round((1 - (1 - k) ** 2) * pts);
      if (k < 1) requestAnimationFrame(run); };
    requestAnimationFrame(run);
    setTimeout(() => { if (n) n.textContent = pts; }, 780);
  }
  setTimeout(() => { host.classList.add('out'); setTimeout(() => host.remove(), 260); }, pts ? 1550 : 1150);
}

// ── render ───────────────────────────────────────────────────────────────
const OPEN = {}; const SHOWALL = {};
function rows(list, kind, limit) {
  const shown = SHOWALL[kind] ? list : list.slice(0, limit);
  return shown.map((x, i) => {
    const id = kind + i, isOpen = OPEN[id];
    const done = kind === 'plan' ? doneIds().includes(x.id) : !!x.completed;
    return `<div class="trow${isOpen ? ' open' : ''}">
      <div class="thead2" data-open="${id}">
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 5l7 7-7 7"/></svg>
        <div class="tick${done ? ' on' : ''}">${done ? '<svg viewBox="0 0 24 24" fill="none" stroke="var(--ground)" stroke-width="3.5" style="width:11px;height:11px"><path d="M20 6L9 17l-5-5"/></svg>' : ''}</div>
        <div style="flex:1;min-width:0"><div class="ttl${done ? ' done' : ''}">${esc(x.title)}</div>
          ${x.category ? `<div class="tsub">${esc(String(x.category).replace(/_/g,' '))}</div>` : ''}</div>
        ${kind === 'assigned' ? '<span class="pill set">Teacher</span>' : ''}
        ${x.duration ? `<div class="dur">${x.duration} min</div>` : ''}
      </div>
      <div class="tbody2">
        ${x.description ? `<p class="tdesc">${esc(x.description)}</p>` : '<p class="hint" style="margin:0 0 12px">No description.</p>'}
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          ${done ? '<span class="hint">Completed</span>'
            : `<button class="btn sm" data-play="${kind}:${i}">Practice this</button>`}
          <button class="btn sm ghost" data-yt="${esc(x.youtube || (x.title + ' ' + (me.instrument || 'guitar') + ' tutorial'))}" data-yttitle="${esc(x.title)}">▶ Watch a lesson</button>
          ${x.song ? `<button class="btn sm ghost" data-yt="${esc(x.song)} ${esc(me.instrument || 'guitar')} tutorial" data-yttitle="${esc(x.song)}">🎵 ${esc(x.song)}</button>` : ''}
        </div>
      </div></div>`;
  }).join('') +
  (list.length > limit ? `<button class="showmore" data-showall="${kind}">${SHOWALL[kind] ? 'Show less' : `Show all (${list.length})`}</button>` : '');
}

function render() {
  const a = assigned(), d = doneIds();
  const donePlan = sessions.filter(s => d.includes(s.id)).length;
  const planned = sessions.reduce((t, s) => t + (s.duration || 0), 0);
  const doneMin = sessions.filter(s => d.includes(s.id)).reduce((t, s) => t + (s.duration || 0), 0);
  const left = Math.max(0, planned - doneMin);
  const all = sessions.length > 0 && donePlan === sessions.length;
  const pct = sessions.length ? Math.round(donePlan / sessions.length * 100) : 0;
  const C = 176;
  const hour = new Date().getHours();
  const greet = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';

  $('#screen').innerHTML = `<div class="content">
    <div class="greet"><h2>${greet}, ${esc(displayName(me))}.</h2>
      <p>${new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'})}</p></div>
    <div class="stats">
      <div class="stat"><div class="k">Streak</div><div class="v">${me.streak || 0}<small>days</small></div></div>
      <div class="stat"><div class="k">Total practice</div><div class="v">${Math.round((me.totalMinutes || 0) / 60)}<small>hrs</small></div></div>
      <div class="stat"><div class="k">Prova Score</div><div class="v">${(me.provaScore || 0).toLocaleString()}</div></div>
    </div>
    <div class="cols"><div class="stack">
      ${sessions.length ? `<div class="planhead${all ? ' complete' : ''}">
        <svg width="72" height="72" viewBox="0 0 72 72" style="flex:none">
          <circle cx="36" cy="36" r="28" fill="none" stroke="var(--raised)" stroke-width="7"/>
          <circle cx="36" cy="36" r="28" fill="none" stroke="${all ? 'var(--good)' : 'var(--primary)'}" stroke-width="7"
            stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C - C * pct / 100}"
            transform="rotate(-90 36 36)" style="transition:stroke-dashoffset .5s cubic-bezier(.2,.8,.2,1)"/>
          <text x="36" y="40" text-anchor="middle" font-family="var(--round)" font-weight="600" font-size="17" fill="var(--ink)">${donePlan}/${sessions.length}</text></svg>
        <div class="phcopy"><div class="phline">${all ? 'Done for today' : `${left} minutes left today`}</div>
          <div class="phsub">${doneMin} of ${planned} min practiced</div></div>
        <button class="btn${all ? ' ghost' : ''}" data-play="next">${
          all ? 'Practice more' : hasStartedToday() ? 'Resume practice' : 'Start practice'}</button>
      </div>` : ''}
      <section class="card"><header><h3>Today's sessions</h3>
        <span class="meta">${sessions.length ? `${donePlan} of ${sessions.length} done` : ''}</span></header>
        ${sessions.length ? rows(sessions, 'plan', 4)
          : `<div class="empty">No plan for ${TODAY_NAME}. Generate one in the app, or take a rest day.</div>`}
      </section>
      ${a.length ? `<section class="card"><header><h3>Assigned by your teacher</h3>
        <span class="meta">${a.filter(t => t.completed).length} of ${a.length} done</span></header>
        ${rows(a, 'assigned', 4)}</section>` : ''}
    </div><div class="stack">
      <section class="card"><header><h3>This account</h3></header>
        <p class="hint" style="margin:0">Signed in as ${esc(me.email || '')}. Everything here is your real data —
        completing a task writes the same points, minutes and streak the app does.</p></section>
    </div></div>
  </div>`;
}

// ── interactions ─────────────────────────────────────────────────────────
document.addEventListener('click', (e) => {
  if (e.target.closest('#overlays')) return;
  let t;
  if ((t = e.target.closest('[data-open]'))) {
    const y = window.scrollY, k = t.getAttribute('data-open');
    OPEN[k] = !OPEN[k]; rerender(); window.scrollTo(0, y); return;
  }
  if ((t = e.target.closest('[data-showall]'))) {
    const y = window.scrollY, k = t.getAttribute('data-showall');
    SHOWALL[k] = !SHOWALL[k]; rerender(); window.scrollTo(0, y); return;
  }
  if ((t = e.target.closest('[data-play]'))) {
    const v = t.getAttribute('data-play');
    if (v === 'next') {
      const last = recallLast();                    // resume exactly where they stopped
      if (last) return openPlayer(last.kind, last.i);
      const q = queue();
      if (!q.length) { toast('Everything is done for today'); return; }
      openPlayer(q[0].kind, q[0].i);
    } else { const [kind, i] = v.split(':'); openPlayer(kind, +i); }

let CH = { root: 'All', type: 'All' };
function chordSvg(c) {
  const W=92,H=112,L=15,T=24,SP=12.4,FR=18;
  const pos = c.f.filter(x => x > 0);
  const base = pos.length && Math.min(...pos) > 4 ? Math.min(...pos) : 1;
  let o = '';
  for (let i=0;i<6;i++) o += `<line x1="${L+i*SP}" y1="${T}" x2="${L+i*SP}" y2="${T+4*FR}" stroke="var(--ink-3)"/>`;
  for (let f=0;f<=4;f++) o += `<line x1="${L}" y1="${T+f*FR}" x2="${L+5*SP}" y2="${T+f*FR}" stroke="var(--ink-3)" stroke-width="${f===0&&base===1?3:1}"/>`;
  if (base>1) o += `<text x="${L-6}" y="${T+FR-5}" text-anchor="end" font-size="9" fill="var(--ink-3)">${base}</text>`;
  c.f.forEach((fr,i)=>{ const x=L+i*SP;
    if (fr===-1) o += `<path d="M${x-3.2} ${T-12}l6.4 6.4M${x+3.2} ${T-12}l-6.4 6.4" stroke="var(--ink-3)" stroke-width="1.5"/>`;
    else if (fr===0) o += `<circle cx="${x}" cy="${T-8}" r="3.4" fill="none" stroke="var(--ink-3)" stroke-width="1.5"/>`;
    else { const row=fr-base+1; if(row<1||row>4) return;
      o += `<circle cx="${x}" cy="${T+(row-.5)*FR}" r="5.5" fill="var(--primary)"/>`;
      if (c.fg[i]) o += `<text x="${x}" y="${T+(row-.5)*FR+3.2}" text-anchor="middle" font-size="8" fill="#fff" font-weight="700">${c.fg[i]}</text>`; }});
  return `<div style="background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center">
    <div style="font-weight:650;font-size:13px;margin-bottom:6px">${esc(c.n)}</div>
    <svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${o}</svg></div>`;
}
function viewChords() {
  const roots = ['All', ...new Set(APP.chords.map(c => c.r))];
  const types = ['All', ...new Set(APP.chords.map(c => c.ty))];
  const list = APP.chords.filter(c => (CH.root==='All'||c.r===CH.root) && (CH.type==='All'||c.ty===CH.type));
  const chip = (k,v,on) => `<button class="btn sm ghost" data-ch="${k}" data-v="${esc(v)}"${on?' style="border-color:var(--primary);color:var(--ink)"':''}>${esc(v)}</button>`;
  $('#screen').innerHTML = `<div class="content">
    ${head('Chords &amp; scales', `${APP.chords.length} shapes · ${APP.scales.length} scales`)}
    <div style="display:flex;gap:8px;flex-wrap:wrap">${roots.map(r=>chip('root',r,CH.root===r)).join('')}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">${types.map(t=>chip('type',t,CH.type===t)).join('')}</div>
    ${card('Shapes', `${list.length} of ${APP.chords.length}`,
      list.length ? `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px">${list.map(chordSvg).join('')}</div>`

    ${card('Scales', APP.scales.length, `<div class="hint">${APP.scales.map(x=>esc(x.name)).join(' · ')}</div>`)}
  </div>`;
}

// ── Metronome, from src/lib/MetronomeContext.js ──────────────────────────
// Ten click sets and per-beat accent levels 1–4; levelSound maps them to
// sample + volume exactly as the app does.
const CLICKSETS = [['classic','Classic','square',1500,2400,.03],['wood','Wood','triangle',900,1400,.05],
  ['beep','Beep','sine',1000,1600,.06],['clave','Clave','square',2200,3000,.025],
  ['hat','Hi-hat','sawtooth',6000,9000,.02],['rim','Rimshot','square',1800,2600,.02],
  ['cowbell','Cowbell','square',800,1100,.09],['digital','Digital','sine',1760,2640,.04],
  ['marimba','Marimba','sine',600,900,.16],['triangle','Triangle','sine',3200,4400,.25]];
const METRO = { bpm: 80, set: 'classic', beats: 4, denom: 4, accents: [4,1,1,1], playing: false, beat: 0 };
let AC = null;
function actx() { if (!AC) { const C = window.AudioContext || window.webkitAudioContext; if (C) AC = new C(); }
  if (AC && AC.state === 'suspended') AC.resume(); return AC; }
function tone(freq, at, dur, vol, type) {
  const c = actx(); if (!c) return;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'triangle'; o.frequency.value = freq;
  g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(vol, at + .008);
  g.gain.exponentialRampToValueAtTime(.0008, at + dur);
  o.connect(g); g.connect(c.destination); o.start(at); o.stop(at + dur + .05);
}
const levelSound = (l) => l >= 4 ? { a:true, v:1 } : l === 3 ? { a:true, v:.78 } : l === 2 ? { a:false, v:.8 } : { a:false, v:.42 };
function clickNow(level) {
  const cs = CLICKSETS.find(c => c[0] === METRO.set) || CLICKSETS[0], ls = levelSound(level), c = actx();
  if (c) tone(ls.a ? cs[4] : cs[3], c.currentTime, cs[5], ls.v * .34, cs[2]);
}
let metroInt = null;
function metroStart() {
  clearInterval(metroInt); METRO.beat = 0;
  const step = () => { clickNow(METRO.accents[METRO.beat] || 1); paintMetro();
    METRO.beat = (METRO.beat + 1) % METRO.beats; };
  step(); metroInt = setInterval(step, 60000 / METRO.bpm * (4 / METRO.denom));
}
function metroStop() { clearInterval(metroInt); metroInt = null; METRO.beat = 0; paintMetro(); }
function paintMetro() {
  $('#mBpm').textContent = METRO.bpm;
  $('#mPlay').textContent = METRO.playing ? 'Stop' : 'Play';
  $('#metroDots').innerHTML = METRO.accents.map((a, i) => {
    const lit = METRO.playing && i === METRO.beat, sz = a >= 3 ? 9 : 6;
    return `<span style="width:${sz}px;height:${sz}px;border-radius:50%;display:inline-block;background:${
      lit ? 'var(--primary)' : a >= 3 ? 'var(--ink-3)' : 'var(--line)'}"></span>`;
  }).join('');
  document.querySelectorAll('.beatbar').forEach((b, i) => b.classList.toggle('cur', METRO.playing && i === METRO.beat));
}
function metroSheet() {
  $('#overlays').innerHTML = `<div class="scrim" data-close></div><div class="modal" style="text-align:left">
    <div style="display:flex;align-items:center"><span class="lab">Metronome</span>

    <div style="display:flex;align-items:center;gap:14px;margin:14px 0 18px">
      <button class="btn ghost" data-mt="down">−</button>
      <div style="flex:1;text-align:center">
        <input id="mtBpm" type="number" min="30" max="240" value="${METRO.bpm}" inputmode="numeric"
          style="width:120px;text-align:center;font-family:var(--round);font-weight:600;font-size:40px;
          background:transparent;border:0;border-bottom:1px solid var(--line);padding:0 0 4px;color:var(--ink)">
        <div class="hint" style="margin-top:4px">bpm — type it</div></div>

    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px">
      ${[40,60,80,100,120,140,160].map(b => `<button class="btn sm ghost" data-mt="bpm" data-v="${b}"${
        METRO.bpm === b ? ' style="border-color:var(--primary);color:var(--ink)"' : ''}>${b}</button>`).join('')}</div>
    <label>Time signature</label>
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:16px">

        ${[2,3,4,5,6,7,8,9,12].map(n => `<option value="${n}"${METRO.beats===n?' selected':''}>${n}</option>`).join('')}</select>
      <span class="hint">/</span>
      <select id="mtDenom" style="flex:1;background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:9px">
        ${[2,4,8,16].map(n => `<option value="${n}"${METRO.denom===n?' selected':''}>${n}</option>`).join('')}</select></div>
    <label>Accents — tap a beat to cycle 1 → 4</label>
    <div class="beatbars">${METRO.accents.map((a,i)=>`<div class="beatbar${a>=3?' on':''}" data-beat="${i}" style="height:${24+a*10}%">${a}</div>`).join('')}</div>
    <label style="margin-top:14px">Click sound</label>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px">
      ${CLICKSETS.map(c=>`<button class="btn sm ghost" data-mtset="${c[0]}"${METRO.set===c[0]?' style="border-color:var(--primary);color:var(--ink)"':''}>${c[1]}</button>`).join('')}</div>
    <button class="btn wide" data-mt="toggle" style="margin-top:20px">${METRO.playing ? 'Stop' : 'Start'}</button></div>`;
}

$('#mDown').onclick = () => { METRO.bpm = Math.max(30, METRO.bpm - 1); if (METRO.playing) metroStart(); paintMetro(); };

document.addEventListener('click', (e) => {

  if ((t = e.target.closest('[data-beat]'))) {

});

// ══ GAMES ══════════════════════════════════════════════════════════════
// Award rules from EarTrainingScreen / FretboardGameScreen: rounds of 10,
// 20 points, first 3 rewarded rounds a day, +2 minutes logged, and the
// same streak stamp the app writes.
const ROUND_LEN = 10, ROUND_POINTS = 20, REWARDED_ROUNDS_PER_DAY = 3;
// audio context + tone() are defined with the metronome, below.
const midiHz = (m) => 440 * Math.pow(2, (m - 69) / 12);
function playMidi(m, delay, dur) { const c = actx(); if (c) tone(midiHz(m), c.currentTime + (delay || 0), dur || .75); }
const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

// The one write both games share.
async function awardRound(counterField, category, score) {
  try {
    const today = todayKey();
    const cur = (await getDoc(doc(db, 'users', uid))).data() || {};
    const c = cur[counterField] || {};
    const rounds = c.date === today ? (c.rounds || 0) : 0;
    if (rounds >= REWARDED_ROUNDS_PER_DAY) {
      celebrate({ points: 0, title: 'Round complete!', subtitle: `${score}/${ROUND_LEN} correct · no points left today`, emoji: '🎧' });
      return;
    }
    const patch = { [counterField]: { date: today, rounds: rounds + 1 },
      provaScore: increment(ROUND_POINTS), totalMinutes: increment(2) };
    const last = cur.lastSessionDate ? new Date(cur.lastSessionDate) : null;
    const d0 = new Date(); d0.setHours(0,0,0,0);
    const lastDay = last ? new Date(last.getFullYear(), last.getMonth(), last.getDate()) : null;
    const diff = lastDay ? Math.round((d0 - lastDay) / 86400000) : 999;
    if (diff >= 1) { patch.streak = diff === 1 ? increment(1) : 1; patch.lastSessionDate = new Date().toISOString(); }
    await updateDoc(doc(db, 'users', uid), patch);
    await setDoc(doc(db, 'sessionHistory', uid, 'logs', dayKey()),
      { date: dayKey(), totalMinutes: increment(2), categories: { [category]: increment(2) } }, { merge: true });
    me.provaScore = (me.provaScore || 0) + ROUND_POINTS;
    me.totalMinutes = (me.totalMinutes || 0) + 2;
    if (diff >= 1) { me.streak = diff === 1 ? (me.streak || 0) + 1 : 1; me.lastSessionDate = new Date().toISOString(); }
    $('#chipScore').textContent = (me.provaScore || 0).toLocaleString();
    $('#chipStreak').textContent = me.streak || 0;
    celebrate({ points: ROUND_POINTS, title: 'Round complete!', subtitle: `${score}/${ROUND_LEN} correct`, emoji: '🎧' });
  } catch { toast('Round finished — could not save the points'); }
}

// ── Ear training ───────────────────────────────────────────────────────
const INTERVALS = [[2,'Major 2nd'],[3,'Minor 3rd'],[4,'Major 3rd'],[5,'Perfect 4th'],
                   [7,'Perfect 5th'],[9,'Major 6th'],[11,'Major 7th'],[12,'Octave']];
const EAR = { level: 2, q: null, picked: null, score: 0, round: 1 };
const earPool = () => INTERVALS.slice(0, EAR.level === 1 ? 4 : EAR.level === 2 ? 6 : 8);
function earNew() {
  const pool = earPool(), ans = pick(pool);
  EAR.q = { root: 57 + Math.floor(Math.random() * 6), ans,
            opts: shuffle(shuffle(pool.filter(x => x[0] !== ans[0])).slice(0, 3).concat([ans])) };
  EAR.picked = null;
}
function earPlay() { if (!EAR.q) earNew(); playMidi(EAR.q.root, 0, .7); playMidi(EAR.q.root + EAR.q.ans[0], .75, .9); }
function viewEar() {
  if (!EAR.q) earNew();
  const names = { 1:'Starter · 4 intervals', 2:'Melodic · 6 intervals', 3:'Complete · 8 intervals' };
  $('#screen').innerHTML = `<div class="content">
    ${head('Ear training', `Round ${EAR.round} of ${ROUND_LEN} · ${names[EAR.level]}`)}
    <div style="display:flex;gap:8px;flex-wrap:wrap">${[1,2,3].map(l =>
      `<button class="btn sm ghost" data-earlvl="${l}"${EAR.level===l?' style="border-color:var(--primary);color:var(--ink)"':''}>${names[l]}</button>`).join('')}</div>
    <div class="cols"><div class="stack">
      ${card('What interval was that?', `Score ${EAR.score}`,
        `<div style="text-align:center;padding:6px 0 20px">
          <button class="btn" data-ear="play" style="padding:16px 30px">▶ Play the interval</button></div>
        <div style="display:flex;flex-direction:column;gap:10px">${EAR.q.opts.map(o => {
          const cls = EAR.picked == null ? '' : (o[0] === EAR.q.ans[0] ? 'right' : (o[0] === EAR.picked ? 'wrong' : ''));
          return `<button class="opt ${cls}" data-ear="ans" data-v="${o[0]}">${o[1]}</button>`;
        }).join('')}</div>
        ${EAR.picked != null ? `<button class="btn" data-ear="next" style="width:100%;margin-top:16px">${EAR.round >= ROUND_LEN ? 'Finish round' : 'Next interval'}</button>` : ''}`)}
    </div><div class="stack">
      ${card('This round', '', `<div class="hint">Correct ${EAR.score} of ${EAR.round - 1}</div>
        <div class="track" style="margin-top:8px"><i style="width:${EAR.round / ROUND_LEN * 100}%"></i></div>`)}
    </div></div></div>`;
}
// ── Fretboard ──────────────────────────────────────────────────────────
const STRINGS = [[64,'high E'],[59,'B'],[55,'G'],[50,'D'],[45,'A'],[40,'low E']];
const FRET = { level: 2, q: null, picked: null, score: 0, round: 1 };
const fretMax = () => FRET.level === 1 ? 5 : FRET.level === 2 ? 7 : 12;
function fretNew() {
  const si = Math.floor(Math.random() * 6), f = Math.floor(Math.random() * fretMax()) + 1;
  FRET.q = { si, fret: f, midi: STRINGS[si][0] + f }; FRET.picked = null;
}
function viewFret() {
  if (!FRET.q) fretNew();
  const max = fretMax(), W = 40 + max * 62;
  let o = '';
  for (let st = 0; st < 6; st++) o += `<line x1="30" y1="${16+st*20}" x2="${W-10}" y2="${16+st*20}" stroke="var(--ink-3)"/>`;
  for (let f = 0; f <= max; f++) o += `<line x1="${30+f*62}" y1="16" x2="${30+f*62}" y2="116" stroke="var(--ink-3)" stroke-width="${f===0?3:1}"/>`;
  [3,5,7,9].forEach(f => { if (f <= max) o += `<circle cx="${30+(f-.5)*62}" cy="66" r="5" fill="var(--line)"/>`; });
  for (let st = 0; st < 6; st++) for (let f = 1; f <= max; f++) {
    const hit = FRET.picked && FRET.picked.si === st && FRET.picked.fret === f;
    const right = FRET.picked && st === FRET.q.si && f === FRET.q.fret;
    o += `<rect data-fret="${st}_${f}" x="${30+(f-1)*62}" y="${6+st*20}" width="62" height="20"
      fill="${right?'var(--good)':hit?'var(--bad)':'transparent'}" opacity="${right||hit?'.55':'1'}" style="cursor:pointer"/>`;
  }
  const names = { 1:'Frets 1–5', 2:'Frets 1–7', 3:'All 12 frets' };
  $('#screen').innerHTML = `<div class="content">
    ${head('Fretboard game', `Round ${FRET.round} of ${ROUND_LEN} · ${names[FRET.level]}`)}
    <div style="display:flex;gap:8px;flex-wrap:wrap">${[1,2,3].map(l =>
      `<button class="btn sm ghost" data-fretlvl="${l}"${FRET.level===l?' style="border-color:var(--primary);color:var(--ink)"':''}>${names[l]}</button>`).join('')}</div>
    ${card(`Find <b style="color:var(--primary)">${NOTE_NAMES[FRET.q.midi % 12]}</b> on the <b style="color:var(--primary)">${STRINGS[FRET.q.si][1]}</b> string`,
      `Score ${FRET.score}`,
      `<div style="overflow-x:auto"><svg width="${W}" height="130" viewBox="0 0 ${W} 130" style="max-width:100%">${o}</svg></div>
      ${FRET.picked ? `<div style="margin-top:14px;display:flex;gap:10px;align-items:center">
        <span class="pill ${FRET.picked.ok?'set':'warn'}">${FRET.picked.ok ? 'Correct' : 'That was ' + NOTE_NAMES[(STRINGS[FRET.picked.si][0] + FRET.picked.fret) % 12]}</span>
        <button class="btn sm" data-fretact="next">${FRET.round >= ROUND_LEN ? 'Finish round' : 'Next note'}</button></div>`
        : '<p class="hint" style="margin:14px 0 0">Click the fret — you will hear what you pick.</p>'}`)}
  </div>`;
}
document.addEventListener('click', async (e) => {
  let t;
  if ((t = e.target.closest('[data-earlvl]'))) { EAR.level = +t.getAttribute('data-earlvl'); EAR.round = 1; EAR.score = 0; earNew(); viewEar(); return; }
  if ((t = e.target.closest('[data-ear]'))) {
    const a = t.getAttribute('data-ear');
    if (a === 'play') return earPlay();
    if (a === 'ans' && EAR.picked == null) {
      EAR.picked = +t.getAttribute('data-v');
      if (EAR.picked === EAR.q.ans[0]) EAR.score++;
      return viewEar();
    }
    if (a === 'next') {
      if (EAR.round >= ROUND_LEN) { await awardRound('earTraining', 'ear', EAR.score);
        EAR.round = 1; EAR.score = 0; } else EAR.round++;
      earNew(); viewEar(); setTimeout(earPlay, 250); return;
    }
    return;
  }
  if ((t = e.target.closest('[data-fretlvl]'))) { FRET.level = +t.getAttribute('data-fretlvl'); FRET.round = 1; FRET.score = 0; fretNew(); viewFret(); return; }
  if ((t = e.target.closest('[data-fret]'))) {
    if (FRET.picked) return;
    const [si, f] = t.getAttribute('data-fret').split('_').map(Number);
    const ok = si === FRET.q.si && f === FRET.q.fret;
    FRET.picked = { si, fret: f, ok };
    playMidi(STRINGS[si][0] + f, 0, .8);
    if (ok) FRET.score++;
    return viewFret();
  }
  if ((t = e.target.closest('[data-fretact]'))) {
    if (FRET.round >= ROUND_LEN) { await awardRound('fretGame', 'fretboard', FRET.score); FRET.round = 1; FRET.score = 0; }
    else FRET.round++;
    fretNew(); viewFret(); return;
  }
});

// src/lib/chat.js: chatId is the two uids sorted and joined, the thread
// lives at chats/{chatId}/messages, and each side keeps a pointer at
// userChats/{uid}/conversations/{chatId}.
const makeChatId = (a, b) => [a, b].sort().join('_');
let CONVS = [], CUR = null, unsubMsgs = null, MSGS = [];
const NAMES = {};   // uid → display name, resolved once

async function nameFor(uid, fallback) {
  if (NAMES[uid]) return NAMES[uid];
  try {
    const d = (await getDoc(doc(db, 'users', uid))).data() || {};
    NAMES[uid] = displayName({ ...d, email: d.email || fallback });
  } catch { NAMES[uid] = (fallback || '').split('@')[0] || 'Someone'; }
  return NAMES[uid];
}

async function loadConvs() {
  const snap = await getDocs(collection(db, 'userChats', uid, 'conversations'));
  CONVS = snap.docs.map(d => ({ id: d.id, ...d.data() }))
    .sort((a, b) => (b.lastMessageAt?.seconds || 0) - (a.lastMessageAt?.seconds || 0));
  await Promise.all(CONVS.map(async c => { c.name = await nameFor(c.otherUid, c.otherEmail); }));
}

function openThread(chatId) {
  CUR = CONVS.find(c => c.id === chatId) || null;
  if (unsubMsgs) { unsubMsgs(); unsubMsgs = null; }
  MSGS = [];
  if (!CUR) return paintThread();
  paintThread();
  const q = query(collection(db, 'chats', chatId, 'messages'), orderBy('timestamp', 'asc'), limit(200));
  unsubMsgs = onSnapshot(q, (snap) => {
    MSGS = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    paintThread();
    const b = document.querySelector('#thBub'); if (b) b.scrollTop = b.scrollHeight;
  }, () => { MSGS = []; paintThread(); });
  setDoc(doc(db, 'chats', chatId), { lastRead: { [uid]: new Date().toISOString() } }, { merge: true }).catch(() => {});
}

function paintThread() {
  const host = document.querySelector('#thread'); if (!host) return;
  if (!CUR) { host.innerHTML = `<div class="empty">Pick a conversation.</div>`; return; }
  host.innerHTML = `
    <div class="thead"><span class="avatar">${initials(CUR.name || '?')}</span>
      <div><div class="tn">${esc(CUR.name)}</div><div class="ts">${esc(CUR.otherEmail || '')}</div></div></div>
    <div class="bubbles" id="thBub">${MSGS.length ? MSGS.map(m => {
      const mine = m.senderUid === uid;
      const when = m.timestamp?.seconds
        ? new Date(m.timestamp.seconds * 1000).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : '';
      if (m.mediaUrl) return `<div class="bub ${mine ? 'me' : 'them'}" style="padding:6px">
        ${m.mediaType === 'video'
          ? `<video src="${esc(m.mediaUrl)}" controls style="max-width:230px;border-radius:12px;display:block"></video>`
          : `<img src="${esc(m.mediaUrl)}" alt="" style="max-width:230px;border-radius:12px;display:block">`}</div>`;
      return `<div class="bub ${mine ? 'me' : 'them'}">${esc(m.text)}
        <span style="display:block;font-size:10.5px;opacity:.6;margin-top:3px">${when}</span></div>`;
    }).join('') : '<div class="empty">No messages yet — say hello.</div>'}</div>
    <div class="composer">
      <input id="msgIn" placeholder="Write a message…" autocomplete="off">
      <button class="btn sm" id="msgSend">Send</button></div>`;
  const b = document.querySelector('#thBub'); if (b) b.scrollTop = b.scrollHeight;
  const inp = document.querySelector('#msgIn');
  document.querySelector('#msgSend').onclick = sendMsg;
  inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMsg(); });
  inp.focus();
}

async function sendMsg() {
  const inp = document.querySelector('#msgIn');
  const text = (inp.value || '').trim();
  if (!text || !CUR) return;
  inp.value = '';
  const meta = { chatId: CUR.id, lastMessage: text, lastMessageAt: serverTimestamp(), lastSenderUid: uid };
  try {
    await addDoc(collection(db, 'chats', CUR.id, 'messages'),
      { senderUid: uid, text, timestamp: serverTimestamp() });
    // Both sides get the pointer updated, exactly as sendChatMessage does.
    await Promise.all([
      setDoc(doc(db, 'userChats', uid, 'conversations', CUR.id),
        { ...meta, otherUid: CUR.otherUid, otherEmail: CUR.otherEmail || '' }, { merge: true }),
      setDoc(doc(db, 'userChats', CUR.otherUid, 'conversations', CUR.id),
        { ...meta, otherUid: uid, otherEmail: me.email || '' }, { merge: true }),
    ]);
  } catch { inp.value = text; toast('Could not send — check your connection'); }
}

async function viewMessages() {
  document.querySelector('#screen').innerHTML =
    `<div class="content"><div class="greet"><h2>Messages</h2>
      <p>Loading your conversations…</p></div></div>`;
  await loadConvs();
  document.querySelector('#screen').innerHTML = `<div class="content">
    <div class="greet"><h2>Messages</h2><p>${CONVS.length
      ? `${CONVS.length} conversation${CONVS.length === 1 ? '' : 's'}`

    ${CONVS.length ? `<div class="msg">
      <div class="convs" id="convList">${CONVS.map((c, i) => `
        <button class="conv" data-conv="${esc(c.id)}" aria-selected="${i === 0}">
          <span class="avatar">${initials(c.name || '?')}</span>
          <span style="min-width:0"><span class="cn">${esc(c.name)}</span>
          <span class="cp">${esc(c.lastMessage || 'No messages yet')}</span></span></button>`).join('')}</div>
      <div class="thread" id="thread"></div></div>`
      : `<section class="card"><div class="empty">
          <div style="font-weight:650;color:var(--ink)">No conversations</div>
          <div style="font-size:13px;margin-top:4px">Threads appear here once you're connected to a teacher or a student.</div>
        </div></section>`}
  </div>`;
  const list = document.querySelector('#convList');
  if (list) {
    list.addEventListener('click', (e) => {

}

// ── practice player — Done locked until the clock runs out ───────────────
let PLAY = null, timer = null, WATCHING = false;
// Elapsed time on a task you left is kept, exactly like the app's priorSec —
// and kept in localStorage too, so five seconds is not lost to a refresh.
const priorKey = () => `prova:prior:${uid}:${todayKey()}`;
let PRIOR = {};
function loadPrior() { try { PRIOR = JSON.parse(localStorage.getItem(priorKey()) || '{}'); } catch { PRIOR = {}; } }
function savePrior() { try { localStorage.setItem(priorKey(), JSON.stringify(PRIOR)); } catch {} }
// The app's hasStartedToday: once you've opened the player at all today the
// button reads Resume, and it survives leaving the page.
const startedKey = () => `prova:started:${uid}:${todayKey()}`;
const hasStartedToday = () => {
  try { if (localStorage.getItem(startedKey()) === '1') return true; } catch {}
  return Object.keys(PRIOR).length > 0 || doneIds().length > 0;
};
const markStarted = () => { try { localStorage.setItem(startedKey(), '1'); } catch {} };
function playList(kind) { return kind === 'plan' ? sessions : assigned(); }
// One queue for the whole run — the day's plan, then anything the teacher
// set — so Next carries you across both, as the app's player does.
function queue() {
  const d = doneIds(), a = assigned();
  return [
    ...sessions.map((x, i) => ({ kind: 'plan', i })).filter(q => !d.includes(sessions[q.i].id)),
    ...a.map((x, i) => ({ kind: 'assigned', i })).filter(q => !a[q.i].completed),
  ];
}
// A teacher task's timer is durationMin; a plan session's is duration.
const targetFor = (kind, item) => ((kind === 'plan' ? item.duration : item.durationMin) || 0) * 60;
const lastKey = () => `prova:last:${uid}:${todayKey()}`;
const rememberLast = (kind, i) => { try { localStorage.setItem(lastKey(), kind + ':' + i); } catch {} };
function recallLast() {
  try {
    const v = localStorage.getItem(lastKey()); if (!v) return null;
    const [kind, i] = v.split(':');
    const item = playList(kind)[+i]; if (!item) return null;
    const done = kind === 'plan' ? doneIds().includes(item.id) : !!item.completed;
    return done ? null : { kind, i: +i };
  } catch { return null; }
}
function openPlayer(kind, i) {
  const item = playList(kind)[i];
  if (!item) return;
  markStarted(); rememberLast(kind, i);
  PLAY = { kind, i, item, target: targetFor(kind, item),
           elapsed: PRIOR[kind + i] || 0, paused: false, t0: performance.now() };
  drawPlayer(); tick();
}
// Leaving a task keeps its clock, then move on — the app's handleSkip.
function stash() { if (PLAY) { PRIOR[PLAY.kind + PLAY.i] = PLAY.elapsed; savePrior(); } }
function step(delta) {
  stash();
  const q = queue();
  const at = q.findIndex(x => x.kind === PLAY.kind && x.i === PLAY.i);
  const next = q[(at < 0 ? 0 : at) + delta];
  if (!next) { closePlayer(); return; }
  openPlayer(next.kind, next.i);
}
function closePlayer() { stash(); clearInterval(timer); PLAY = null; $('#overlays').innerHTML = ''; rerender(); }
function tick() {
  clearInterval(timer);
  timer = setInterval(() => {
    if (!PLAY || PLAY.paused) return;
    const now = performance.now();
    PLAY.elapsed += (now - PLAY.t0) / 1000; PLAY.t0 = now;
    const c = $('#pClock'); if (!c) return;
    const rem = Math.max(0, PLAY.target - PLAY.elapsed);
    c.textContent = PLAY.target ? fmt(rem) : fmt(PLAY.elapsed);
    const b = $('#pDone');
    if (b) b.disabled = PLAY.target > 0 ? rem > 0 : PLAY.elapsed < 30;
  }, 200);
}
const fmt = (s) => `${String(Math.floor(s / 60)).padStart(2,'0')}:${String(Math.floor(s % 60)).padStart(2,'0')}`;
function drawPlayer() {
  const rem = Math.max(0, PLAY.target - PLAY.elapsed);
  $('#overlays').innerHTML = `<div class="scrim" data-close></div><div class="modal">
    <div style="display:flex;align-items:center"><span class="lab">Now practicing</span>
      <button class="x" data-close style="margin-left:auto">×</button></div>
    <h3 style="margin:8px 0 12px;font-size:18px">${esc(PLAY.item.title)}</h3>
    ${PLAY.item.description ? `<p style="margin:0 0 20px;color:var(--ink-2);font-size:13px;line-height:1.6;
        text-align:left;white-space:pre-wrap;max-height:150px;overflow:auto;background:var(--card);
        border:1px solid var(--line);border-radius:12px;padding:13px 15px">${esc(PLAY.item.description)}</p>` : '<div style="height:8px"></div>'}
    <div class="clock" id="pClock">${PLAY.target ? fmt(rem) : fmt(PLAY.elapsed)}</div>
    <p class="hint" style="margin:12px 0 0">${PLAY.target
      ? `${Math.round(PLAY.target / 60)} min ${PLAY.kind === 'assigned' ? 'teacher task' : 'task'}`
      : 'No timer — practise for at least 30 seconds'}</p>
    ${PRIOR[PLAY.kind + PLAY.i] ? `<p class="hint" style="margin:8px 0 0">${fmt(PRIOR[PLAY.kind + PLAY.i])} already banked on this task</p>` : ''}
    <button class="btn ghost" id="pWatch" style="width:100%;margin-top:18px">▶ Watch a lesson</button>
    <div style="display:flex;gap:10px;margin-top:10px">
      <button class="btn ghost" id="pPause" style="flex:1">${PLAY.paused ? 'Resume' : 'Pause'}</button>
      <button class="btn" id="pDone" style="flex:1" ${
        (PLAY.target > 0 ? rem > 0 : PLAY.elapsed < 30) ? 'disabled' : ''}>Done</button></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px">
      ${(() => { const q = queue(); const at = q.findIndex(x => x.kind === PLAY.kind && x.i === PLAY.i);
        return `<button class="btn ghost sm" id="pPrev"${at <= 0 ? ' disabled' : ''}>‹ Previous</button>
          <span class="hint">${at < 0 ? 1 : at + 1} of ${q.length}</span>`; })()}
      <button class="btn ghost sm" id="pNext">Next ›</button></div>
    <p class="hint" style="margin:14px 0 0">${PLAY.target
      ? 'Done unlocks when the clock runs out.' : 'Done unlocks after 30 seconds.'} Move on and your time is kept.</p></div>`;
  $('#pPause').onclick = () => { PLAY.paused = !PLAY.paused; PLAY.t0 = performance.now(); drawPlayer(); };
  $('#pDone').onclick = finish;
  $('#pPrev').onclick = () => step(-1);
  $('#pNext').onclick = () => step(1);
  // Watching pauses the clock — the app does the same, so time spent on a
  // video is never counted as time spent practising.
  $('#pWatch').onclick = () => {
    PLAY.paused = true;
    WATCHING = true;
    const it = PLAY.item;
    openYouTube(it.youtube || `${it.title} ${me.instrument || 'guitar'} tutorial`, it.title);
  };
}
$('#overlays').addEventListener('click', (e) => {
  if (!e.target.closest('[data-close]')) return;
  if (WATCHING && PLAY) {           // came from the player — go back to it
    WATCHING = false;
    PLAY.t0 = performance.now();    // stays paused until they press Resume
    drawPlayer();
    return;
  }
  WATCHING = false;
  if (PLAY) closePlayer(); else $('#overlays').innerHTML = '';
});

// The writes. These mirror TodayScreen.handleComplete and practiceLog.js —
// same fields, same increments, so the phone app reads them correctly.
async function finish() {
  const { kind, item } = PLAY;
  const secs = Math.round(PLAY.elapsed);
  const mins = Math.max(1, Math.round(secs / 60));
  $('#pDone').disabled = true;
  try {
    if (kind === 'plan') {
      const prior = doneIds();
      if (prior.includes(item.id)) { toast('Already completed'); return; }
      const pts = taskPoints(item);
      const ids = Array.from(new Set([...prior, item.id]));
      await updateDoc(doc(db, 'users', uid), {
        provaScore: typeof me.provaScore === 'number' ? increment(pts) : (me.provaScore || 0) + pts,
        sessionProgress: { date: todayKey(), ids },
      });
      me.provaScore = (me.provaScore || 0) + pts;
      me.sessionProgress = { date: todayKey(), ids };
      celebrate({ points: pts, title: 'Task done!', subtitle: 'Prova points', emoji: '🎸' });
    } else {
      const pts = teacherTaskPoints(secs);
      const next = assigned().map((t, j) => j === PLAY.i ? { ...t, completed: true } : t);
      const patch = { assignedTasks: next, provaScore: increment(pts), totalMinutes: increment(mins) };
      // streak: same today/yesterday rule as src/lib/practiceLog.js
      const last = me.lastSessionDate ? new Date(me.lastSessionDate) : null;
      const d0 = new Date(); d0.setHours(0,0,0,0);
      const lastDay = last ? new Date(last.getFullYear(), last.getMonth(), last.getDate()) : null;
      const diff = lastDay ? Math.round((d0 - lastDay) / 86400000) : 999;
      if (diff >= 1) { patch.streak = diff === 1 ? increment(1) : 1; patch.lastSessionDate = new Date().toISOString(); }
      await updateDoc(doc(db, 'users', uid), patch);
      await setDoc(doc(db, 'sessionHistory', uid, 'logs', dayKey()),
        { date: dayKey(), totalMinutes: increment(mins), categories: { teacher: increment(mins) } }, { merge: true });
      me.assignedTasks = next;
      me.provaScore = (me.provaScore || 0) + pts;
      me.totalMinutes = (me.totalMinutes || 0) + mins;
      if (diff >= 1) { me.streak = diff === 1 ? (me.streak || 0) + 1 : 1; me.lastSessionDate = new Date().toISOString(); }
      celebrate({ points: pts, title: 'Task done!', subtitle: 'Prova points', emoji: '⭐' });
    }
    delete PRIOR[kind + PLAY.i]; savePrior();
    try { localStorage.removeItem(lastKey()); } catch {}
    $('#chipScore').textContent = (me.provaScore || 0).toLocaleString();
    $('#chipStreak').textContent = me.streak || 0;
  } catch (err) {
    toast('Could not save — check your connection');
  }
  clearInterval(timer); PLAY = null; $('#overlays').innerHTML = ''; rerender();
}
</script>
</body>
</html>
