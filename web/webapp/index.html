// ── practice player — Done locked until the clock runs out ───────────────
let PLAY = null, timer = null, WATCHING = false;
// Elapsed time on a task you left is kept, exactly like the app's priorSec —
// and kept in localStorage too, so five seconds is not lost to a refresh.
const priorKey = () => `prova:prior:${uid}:${todayKey()}`;
let PRIOR = {};
function loadPrior() { try { PRIOR = JSON.parse(localStorage.getItem(priorKey()) || '{}'); } catch { PRIOR = {}; } }
function savePrior() { try { localStorage.setItem(priorKey(), JSON.stringify(PRIOR)); } catch {} }
// The app's hasStartedToday: once you've opened the player at all today the
// button reads Resume, and it survives leaving the page.
const startedKey = () => `prova:started:${uid}:${todayKey()}`;
const hasStartedToday = () => {
  try { if (localStorage.getItem(startedKey()) === '1') return true; } catch {}
  return Object.keys(PRIOR).length > 0 || doneIds().length > 0;
};
const markStarted = () => { try { localStorage.setItem(startedKey(), '1'); } catch {} };
function playList(kind) { return kind === 'plan' ? sessions : assigned(); }
// One queue for the whole run — the day's plan, then anything the teacher
// set — so Next carries you across both, as the app's player does.
function queue() {
  const d = doneIds(), a = assigned();
  return [
    ...sessions.map((x, i) => ({ kind: 'plan', i })).filter(q => !d.includes(sessions[q.i].id)),
    ...a.map((x, i) => ({ kind: 'assigned', i })).filter(q => !a[q.i].completed),
  ];
}
// A teacher task's timer is durationMin; a plan session's is duration.
const targetFor = (kind, item) => ((kind === 'plan' ? item.duration : item.durationMin) || 0) * 60;
const lastKey = () => `prova:last:${uid}:${todayKey()}`;
const rememberLast = (kind, i) => { try { localStorage.setItem(lastKey(), kind + ':' + i); } catch {} };
function recallLast() {
  try {
    const v = localStorage.getItem(lastKey()); if (!v) return null;
    const [kind, i] = v.split(':');
    const item = playList(kind)[+i]; if (!item) return null;
    const done = kind === 'plan' ? doneIds().includes(item.id) : !!item.completed;
    return done ? null : { kind, i: +i };
  } catch { return null; }
}
function openPlayer(kind, i) {
  const item = playList(kind)[i];
  if (!item) return;
  markStarted(); rememberLast(kind, i);
  PLAY = { kind, i, item, target: targetFor(kind, item),
           elapsed: PRIOR[kind + i] || 0, paused: false, t0: performance.now() };
  drawPlayer(); tick();
}
// Leaving a task keeps its clock, then move on — the app's handleSkip.
function stash() { if (PLAY) { PRIOR[PLAY.kind + PLAY.i] = PLAY.elapsed; savePrior(); } }
function step(delta) {
  stash();
  const q = queue();
  const at = q.findIndex(x => x.kind === PLAY.kind && x.i === PLAY.i);
  const next = q[(at < 0 ? 0 : at) + delta];
  if (!next) { closePlayer(); return; }
  openPlayer(next.kind, next.i);
}
function closePlayer() { stash(); clearInterval(timer); PLAY = null; $('#overlays').innerHTML = ''; rerender(); }
function tick() {
  clearInterval(timer);
  timer = setInterval(() => {
    if (!PLAY || PLAY.paused) return;
    const now = performance.now();
    PLAY.elapsed += (now - PLAY.t0) / 1000; PLAY.t0 = now;
    const c = $('#pClock'); if (!c) return;
    const rem = Math.max(0, PLAY.target - PLAY.elapsed);
    c.textContent = PLAY.target ? fmt(rem) : fmt(PLAY.elapsed);
    const b = $('#pDone');
    if (b) b.disabled = PLAY.target > 0 ? rem > 0 : PLAY.elapsed < 30;
  }, 200);
}
const fmt = (s) => `${String(Math.floor(s / 60)).padStart(2,'0')}:${String(Math.floor(s % 60)).padStart(2,'0')}`;
function drawPlayer() {
  const rem = Math.max(0, PLAY.target - PLAY.elapsed);
  $('#overlays').innerHTML = `<div class="scrim" data-close></div><div class="modal">
    <div style="display:flex;align-items:center"><span class="lab">Now practicing</span>
      <button class="x" data-close style="margin-left:auto">×</button></div>
    ${PLAY.kind === 'gigsong' ? `<div style="text-align:center;margin:2px 0 10px">
      <span class="pill" style="background:color-mix(in srgb,var(--teal) 20%,transparent);color:var(--teal)">Gig rehearsal</span></div>` : ''}
    <h3 style="margin:8px 0 12px;font-size:18px">${esc(PLAY.item.title)}</h3>
    ${PLAY.kind === 'gigsong' ? `<p class="hint" style="margin:0 0 16px">
      ${PLAY.item.artist ? 'by ' + esc(PLAY.item.artist) + ' · ' : ''}From your “${esc(PLAY.item.setName)}” set —
      run it like it's the gig.</p>` : ''}
    ${PLAY.item.description ? `<p style="margin:0 0 20px;color:var(--ink-2);font-size:13px;line-height:1.6;
        text-align:left;white-space:pre-wrap;max-height:150px;overflow:auto;background:var(--card);
        border:1px solid var(--line);border-radius:12px;padding:13px 15px">${esc(PLAY.item.description)}</p>` : '<div style="height:8px"></div>'}
    <div class="clock" id="pClock">${PLAY.target ? fmt(rem) : fmt(PLAY.elapsed)}</div>
    <p class="hint" style="margin:12px 0 0">${PLAY.target
      ? `${Math.round(PLAY.target / 60)} min ${PLAY.kind === 'assigned' ? 'teacher task' : 'task'}`
      : 'No timer — practise for at least 30 seconds'}</p>
    ${PRIOR[PLAY.kind + PLAY.i] ? `<p class="hint" style="margin:8px 0 0">${fmt(PRIOR[PLAY.kind + PLAY.i])} already banked on this task</p>` : ''}
    <button class="btn ghost" id="pWatch" style="width:100%;margin-top:18px">▶ Watch a lesson</button>
    <div style="display:flex;gap:10px;margin-top:10px">
      <button class="btn ghost" id="pPause" style="flex:1">${PLAY.paused ? 'Resume' : 'Pause'}</button>
      <button class="btn" id="pDone" style="flex:1" ${
        (PLAY.target > 0 ? rem > 0 : PLAY.elapsed < 30) ? 'disabled' : ''}>Done</button></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px">
      ${PLAY.kind === 'gigsong' ? `<span></span><span class="hint">${PLAY.i + 1} of ${(PLAY.songs || []).length}</span>` :
        (() => { const q = queue(); const at = q.findIndex(x => x.kind === PLAY.kind && x.i === PLAY.i);
        return `<button class="btn ghost sm" id="pPrev"${at <= 0 ? ' disabled' : ''}>‹ Previous</button>
          <span class="hint">${at < 0 ? 1 : at + 1} of ${q.length}</span>`; })()}
      <button class="btn ghost sm" id="pNext">Next ›</button></div>
    <p class="hint" style="margin:14px 0 0">${PLAY.target
      ? 'Done unlocks when the clock runs out.' : 'Done unlocks after 30 seconds.'} Move on and your time is kept.</p></div>`;
  $('#pPause').onclick = () => { PLAY.paused = !PLAY.paused; PLAY.t0 = performance.now(); drawPlayer(); };
  $('#pDone').onclick = () => (PLAY.kind === 'gigsong' ? finishRehearsal() : finish());
  if ($('#pPrev')) $('#pPrev').onclick = () => step(-1);
  $('#pNext').onclick = () => PLAY.kind === 'gigsong'
    ? (PLAY.i + 1 < (PLAY.songs || []).length ? openRehearsal(PLAY.i + 1) : closePlayer())
    : step(1);
  // Watching pauses the clock — the app does the same, so time spent on a
  // video is never counted as time spent practising.
  $('#pWatch').onclick = () => {
    PLAY.paused = true;
    WATCHING = true;
    const it = PLAY.item;
    openYouTube(it.youtube || `${it.title} ${me.instrument || 'guitar'} tutorial`, it.title);
  };
}
$('#overlays').addEventListener('click', (e) => {
  if (!e.target.closest('[data-close]')) return;
  if (WATCHING && PLAY) {           // came from the player — go back to it
    WATCHING = false;
    PLAY.t0 = performance.now();    // stays paused until they press Resume
    drawPlayer();
    return;
  }
  WATCHING = false;
  if (PLAY) closePlayer(); else $('#overlays').innerHTML = '';
});

// The writes. These mirror TodayScreen.handleComplete and practiceLog.js —
// same fields, same increments, so the phone app reads them correctly.
async function finish() {
  const { kind, item } = PLAY;
  const secs = Math.round(PLAY.elapsed);
  const mins = Math.max(1, Math.round(secs / 60));
  $('#pDone').disabled = true;
  try {
    if (kind === 'plan') {
      const prior = doneIds();
      if (prior.includes(item.id)) { toast('Already completed'); return; }
      const pts = taskPoints(item);
      const ids = Array.from(new Set([...prior, item.id]));
      await updateDoc(doc(db, 'users', uid), {
        provaScore: typeof me.provaScore === 'number' ? increment(pts) : (me.provaScore || 0) + pts,
        sessionProgress: { date: todayKey(), ids },
      });
      me.provaScore = (me.provaScore || 0) + pts;
      me.sessionProgress = { date: todayKey(), ids };
      celebrate({ points: pts, title: 'Task done!', subtitle: 'Prova points', emoji: '🎸' });
    } else {
      const pts = teacherTaskPoints(secs);
      const next = assigned().map((t, j) => j === PLAY.i ? { ...t, completed: true } : t);
      const patch = { assignedTasks: next, provaScore: increment(pts), totalMinutes: increment(mins) };
      // streak: same today/yesterday rule as src/lib/practiceLog.js
      const last = me.lastSessionDate ? new Date(me.lastSessionDate) : null;
      const d0 = new Date(); d0.setHours(0,0,0,0);
      const lastDay = last ? new Date(last.getFullYear(), last.getMonth(), last.getDate()) : null;
      const diff = lastDay ? Math.round((d0 - lastDay) / 86400000) : 999;
      if (diff >= 1) { patch.streak = diff === 1 ? increment(1) : 1; patch.lastSessionDate = new Date().toISOString(); }
      await updateDoc(doc(db, 'users', uid), patch);
      await setDoc(doc(db, 'sessionHistory', uid, 'logs', dayKey()),
        { date: dayKey(), totalMinutes: increment(mins), categories: { teacher: increment(mins) } }, { merge: true });
      me.assignedTasks = next;
      me.provaScore = (me.provaScore || 0) + pts;
      me.totalMinutes = (me.totalMinutes || 0) + mins;
      if (diff >= 1) { me.streak = diff === 1 ? (me.streak || 0) + 1 : 1; me.lastSessionDate = new Date().toISOString(); }
      celebrate({ points: pts, title: 'Task done!', subtitle: 'Prova points', emoji: '⭐' });
    }
    delete PRIOR[kind + PLAY.i]; savePrior();
    try { localStorage.removeItem(lastKey()); } catch {}
    $('#chipScore').textContent = (me.provaScore || 0).toLocaleString();
    $('#chipStreak').textContent = me.streak || 0;
  } catch (err) {
    toast('Could not save — check your connection');
  }
  clearInterval(timer); PLAY = null; $('#overlays').innerHTML = ''; rerender();
}
</script>
</body>
</html>
